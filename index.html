<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Executive Control Portal – ניהול ובקרת שטח</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#0a2a4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg: #f1f5f9;
  --bg-subtle: #e2e8f0;
  --card: #ffffff;
  --card-alt: #f8fafc;
  --tx: #0f172a;
  --tx-sec: #334155;
  --mut: #64748b;
  --line: #e2e8f0;
  --pri: #0f4c81;
  --pri-hover: #0a365c;
  --pri-light: #e0f2fe;
  --pri-tx: #ffffff;
  --acc: #0284c7;
  --bad: #e11d48;
  --bad-bg: #ffe4e6;
  --ok: #059669;
  --ok-bg: #d1fae5;
  --warn: #d97706;
  --warn-bg: #fef3c7;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
  --shadow-md: 0 4px 14px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.16), 0 8px 10px -6px rgba(15, 23, 42, 0.1);
  --radius: 16px;
}

:root[data-theme=dark] {
  --bg: #090e1a;
  --bg-subtle: #111827;
  --card: #162032;
  --card-alt: #0f172a;
  --tx: #f8fafc;
  --tx-sec: #cbd5e1;
  --mut: #94a3b8;
  --line: #283548;
  --pri: #38bdf8;
  --pri-hover: #7dd3fc;
  --pri-light: rgba(56, 189, 248, 0.14);
  --pri-tx: #090e1a;
  --acc: #38bdf8;
  --bad: #fb7185;
  --bad-bg: rgba(251, 113, 133, 0.14);
  --ok: #34d399;
  --ok-bg: rgba(52, 211, 153, 0.14);
  --warn: #fbbf24;
  --warn-bg: rgba(251, 191, 36, 0.14);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 20px 25px rgba(0, 0, 0, 0.65);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #090e1a;
    --bg-subtle: #111827;
    --card: #162032;
    --card-alt: #0f172a;
    --tx: #f8fafc;
    --tx-sec: #cbd5e1;
    --mut: #94a3b8;
    --line: #283548;
    --pri: #38bdf8;
    --pri-hover: #7dd3fc;
    --pri-light: rgba(56, 189, 248, 0.14);
    --pri-tx: #090e1a;
    --acc: #38bdf8;
    --bad: #fb7185;
    --bad-bg: rgba(251, 113, 133, 0.14);
    --ok: #34d399;
    --ok-bg: rgba(52, 211, 153, 0.14);
    --warn: #fbbf24;
    --warn-bg: rgba(251, 191, 36, 0.14);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 20px 25px rgba(0, 0, 0, 0.65);
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: 'Heebo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Top Executive Bar */
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 28px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 30;
  box-shadow: var(--shadow-sm);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
}
.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--pri), var(--acc));
  color: var(--pri-tx);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 20px;
  box-shadow: 0 4px 10px rgba(15, 76, 129, 0.3);
}
header h1 {
  font-size: 20px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.live-pill {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--ok-bg);
  color: var(--ok);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ok);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

header h1 small {
  display: block;
  font-size: 12px;
  font-weight: 400;
  color: var(--mut);
}
.user-badge {
  font-size: 12px;
  color: var(--mut);
  background: var(--card-alt);
  border: 1px solid var(--line);
  padding: 6px 12px;
  border-radius: 99px;
  direction: ltr;
}
@media (max-width: 760px) { .user-badge { display: none; } header { padding: 12px 16px; } }

button, input, select { font: inherit; }

.btn {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--tx);
  border-radius: 10px;
  padding: 8px 15px;
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.16s ease;
  box-shadow: var(--shadow-sm);
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--card-alt); border-color: var(--mut); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.pri { background: var(--pri); color: var(--pri-tx); border-color: var(--pri); }
.btn.pri:hover:not(:disabled) { background: var(--pri-hover); border-color: var(--pri-hover); }
.btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.ok:hover:not(:disabled) { opacity: 0.92; }
.btn.bad { color: var(--bad); border-color: var(--bad-bg); background: var(--bad-bg); }
.btn.bad:hover:not(:disabled) { background: var(--bad); color: #fff; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }

main { max-width: 1220px; margin: 0 auto; padding: 24px 20px 48px; }

/* Executive KPI Cards */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
  margin-bottom: 22px;
}
.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 22px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat::after {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 5px;
  background: var(--pri);
}
.stat.s-ok::after { background: var(--ok); }
.stat.s-acc::after { background: var(--acc); }
.stat.s-warn::after { background: var(--warn); }
.stat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.stat b { font-size: 30px; font-weight: 800; line-height: 1.1; color: var(--tx); }
.stat-ico { font-size: 20px; opacity: 0.85; }
.stat span { color: var(--mut); font-size: 13px; font-weight: 600; }
.stat small { color: var(--acc); font-size: 11.5px; margin-top: 4px; font-weight: 500; }

/* Control Panel (Search & Multi-Filters) */
.controls-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}
.search-wrap { position: relative; margin-bottom: 14px; }
.search {
  width: 100%;
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card-alt);
  color: var(--tx);
  font-size: 15px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-light); background: var(--card); }

.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.filters select, .filters input {
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card-alt);
  color: var(--tx);
  font-size: 13.5px;
  font-weight: 500;
}
.filters label {
  font-size: 13px;
  color: var(--mut);
  font-weight: 600;
  display: flex;
  gap: 6px;
  align-items: center;
  background: var(--card-alt);
  padding: 4px 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
}
.filters label input { border: none; background: transparent; padding: 4px; }
.quick-dates { display: flex; gap: 6px; margin-right: auto; }
@media (max-width: 820px) { .quick-dates { margin-right: 0; } }

/* Action Bar & View Tabs */
.bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
  align-items: center;
}
.bar .spacer { flex: 1; }
.tabs {
  display: inline-flex;
  background: var(--card);
  padding: 5px;
  border-radius: 12px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  flex-wrap: wrap;
}
.tabs .btn { border: none; box-shadow: none; background: transparent; padding: 7px 14px; border-radius: 8px; }
.tabs .btn.pri { background: var(--pri); color: var(--pri-tx); }

/* Report List Rows */
.row {
  display: grid;
  grid-template-columns: 115px 1.2fr 1.6fr auto;
  gap: 14px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 10px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.18s ease;
}
.row:hover {
  border-color: var(--pri);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
@media (max-width: 760px) {
  .row { grid-template-columns: 1fr 1fr; gap: 10px; }
  .row .meta-end { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
}
.row small { color: var(--mut); display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.2px; margin-bottom: 2px; }
.row .val { font-weight: 700; font-size: 15px; color: var(--tx); }
.row .meta-end { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.row .id-row {
  grid-column: 1 / -1;
  padding-top: 10px;
  margin-top: 2px;
  border-top: 1px dashed var(--line);
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  font-size: 12.5px;
  color: var(--mut);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
}
.badge.co { background: var(--pri-light); color: var(--pri); }
.badge.gps { background: var(--ok-bg); color: var(--ok); }
header { -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px); }
.stat { transition: transform .18s ease, box-shadow .18s ease; }
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(2, 132, 199, .35); outline-offset: 2px; }
.role-pill { display: inline-block; margin-inline-start: 6px; padding: 1px 8px; border-radius: 999px; background: var(--pri-light); color: var(--pri); font-size: 11px; font-weight: 800; }
::selection { background: var(--pri-light); color: var(--pri); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.appr { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.appr-b { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--line, #e2e8f0); color: var(--mut, #64748b); }
.appr-b.ok { background: var(--ok-bg, #dcfce7); color: var(--ok, #16a34a); }
.appr-b.bad { background: #fee2e2; color: #dc2626; }
.appr-btn { white-space: nowrap; font: inherit; font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 8px; border: 1px solid var(--line, #e2e8f0); background: var(--card, #fff); color: var(--tx, #0f172a); cursor: pointer; }
.appr-btn.ok { color: var(--ok, #16a34a); border-color: var(--ok, #16a34a); }
.appr-btn.bad { color: #dc2626; border-color: #dc2626; }
.appr-btn:hover { background: var(--pri-light, #e0f2fe); }
.appr-note { flex-basis: 100%; font-size: 12px; color: var(--mut, #64748b); }
.row > .appr { grid-column: 1 / -1; margin-top: 2px; padding-top: 10px; border-top: 1px dashed var(--line, #e2e8f0); align-items: center; }
.row .appr-note { flex-basis: auto; margin-inline-start: 4px; font-size: 13px; }
.v-done { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: var(--ok, #16a34a); color: #fff; font-size: 13px; font-weight: 900; line-height: 1; flex: none; }
.nc-chip { direction: ltr; unicode-bidi: embed; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; color: var(--ok); background: var(--ok-bg); padding: 2px 8px; border-radius: 6px; }
.nc-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.nc-actions a, .nc-actions button { font: inherit; font-size: 15px; font-weight: 700; padding: 11px 20px; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--tx); cursor: pointer; text-decoration: none; flex: 1 1 140px; box-shadow: var(--shadow-sm, 0 1px 2px rgba(15,23,42,.06)); }
.nc-actions a:hover, .nc-actions button:hover { background: var(--pri-light); }
.badge.ph-cnt { background: var(--card-alt); border: 1px solid var(--line); color: var(--tx-sec); }
.badge.lines-cnt { background: var(--warn-bg); color: var(--warn); }

/* Summary / Executive Analytics View */
.analytics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 18px;
}
.ana-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}
.ana-card h3 {
  margin: 0 0 14px;
  font-size: 16px;
  font-weight: 800;
  color: var(--pri);
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
}
.ana-row {
  margin-bottom: 12px;
}
.ana-row-top {
  display: flex;
  justify-content: space-between;
  font-size: 13.5px;
  font-weight: 600;
  margin-bottom: 4px;
}
.ana-bar-bg {
  height: 8px;
  background: var(--card-alt);
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.ana-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--pri), var(--acc));
  border-radius: 99px;
}

.empty, .msg { text-align: center; color: var(--mut); padding: 44px 16px; font-size: 15px; font-weight: 500; }
.err { background: var(--bad-bg); border: 1px solid var(--bad); color: var(--bad); border-radius: 12px; padding: 14px 18px; margin-bottom: 14px; white-space: pre-wrap; line-height: 1.5; font-weight: 600; }
.err.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.link { background: none; border: 0; color: var(--pri); cursor: pointer; padding: 8px 0; text-decoration: underline; font-weight: 600; }

/* Login */
.login {
  max-width: 420px;
  margin: 10vh auto;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 36px 32px;
  box-shadow: var(--shadow-lg);
}
.login h2 { margin: 0 0 6px; font-size: 25px; font-weight: 800; }
.login p { margin: 0 0 22px; color: var(--mut); font-size: 14px; }
.login input {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card-alt);
  color: var(--tx);
}

/* Modal & Structured Report Detail Sheet */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(5px);
  display: none;
  z-index: 50;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px 12px;
}
.modal.open { display: block; animation: fadeIn 0.18s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.sheet {
  background: var(--card);
  max-width: 960px;
  margin: 10px auto 30px;
  border-radius: 20px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  overflow-y: auto;
  max-height: 92vh;
  -webkit-overflow-scrolling: touch;
}

.sheet-header {
  background: linear-gradient(135deg, var(--pri), var(--pri-hover));
  color: var(--pri-tx);
  padding: 24px 28px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
.sheet-header h3 { margin: 0 0 4px; font-size: 23px; font-weight: 800; }
.sheet-header .sub-id { font-size: 13px; opacity: 0.9; direction: ltr; display: inline-block; font-family: monospace; }
.sheet-close {
  background: rgba(255,255,255,0.2);
  border: none;
  color: inherit;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sheet-close:hover { background: rgba(255,255,255,0.35); }

.sheet-body { padding: 24px 28px; }

.detail-section {
  background: var(--card-alt);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 20px;
}
.section-title {
  font-size: 15.5px;
  font-weight: 800;
  color: var(--pri);
  margin: 0 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.meta-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
  gap: 12px;
}
.meta-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
}
.meta-box .lbl { font-size: 11px; font-weight: 700; color: var(--mut); margin-bottom: 2px; }
.meta-box .val { font-size: 14px; font-weight: 700; color: var(--tx); word-break: break-word; }

.work-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.work-table th {
  background: var(--pri-light);
  color: var(--pri);
  text-align: right;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 800;
}
.work-table td {
  padding: 10px 14px;
  border-top: 1px solid var(--line);
  font-size: 14px;
  vertical-align: top;
}
.work-table tr:nth-child(even) td { background: var(--card-alt); }
.work-table td:first-child { font-weight: 700; color: var(--tx-sec); width: 38%; }

/* Photo Gallery & Lightbox */
.gallery-cat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 16px 0 10px;
  padding: 8px 14px;
  background: var(--card);
  border-right: 4px solid var(--pri);
  border-radius: 8px;
  font-weight: 800;
  font-size: 14px;
}
.photos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 12px;
}
.photo-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: transform 0.16s, box-shadow 0.16s;
}
.photo-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--pri); }
.photo-card img {
  width: 100%;
  aspect-ratio: 4/3;

  display: block;
  cursor: zoom-in;
  background: var(--bg-subtle);
}

}

  flex: 1;
  border: 1px solid var(--line);
  background: var(--card-alt);
  color: var(--tx);
  border-radius: 6px;
  padding: 5px 6px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.photo-actions button:hover { background: var(--pri); color: var(--pri-tx); border-color: var(--pri); }

/* Lightbox Modal */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(5, 10, 20, 0.94);
  z-index: 100;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 16px 28px;

.gallery-hub-controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 18px;
  background: var(--card);
  padding: 14px 18px;

  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}

/* Toast Notification */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #0f172a;
  color: #fff;

  border-radius: 30px;
  font-size: 14px;

.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* Print / Executive PDF Layout */
#sheet { display: none; }
@media print {
  body > *:not(#sheet) { display: none !important; }
  #sheet { display: block; color: #0f172a; background: #fff; font-family: 'Heebo', Arial, sans-serif; }
  #sheet .p { page-break-after: always; min-height: 94vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  #sheet .p:last-child { page-break-after: auto; }
  #sheet .p img { max-width: 100%; max-height: 82vh; object-fit: contain; border-radius: 8px; border: 1px solid #cbd5e1; }
  #sheet .first { display: block; min-height: auto; padding: 24px; }

  #sheet table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  #sheet th, #sheet td { border: 1px solid #cbd5e1; padding: 9px 12px; text-align: right; font-size: 13px; }
  #sheet th { background: #f1f5f9; font-weight: 700; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
#map { position: relative; z-index: 0; }

async function auth(path, body) {
  const r = await fetch(`${SB}/auth/v1/${path}`, {
    method: 'POST',
    headers: { apikey: KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)

  if (!r.ok) throw new Error(j.error_description || j.msg || 'שגיאת התחברות');
  const fac = ((j.user && j.user.factors) || []).filter(f => f.factor_type === 'totp' && f.status === 'verified').map(f => f.id);
  return { access_token: j.access_token, refresh_token: j.refresh_token, email: j.user && j.user.email, factors: fac };
}

const UNIT_WORD = '(גוב|גובים|עמוד|עמודים|manhole|pole)';
const UNIT_NUM_RE = new RegExp("((מס['׳]?|מספר|num|no\\.?|#)\\s*" + UNIT_WORD + ")|(" + UNIT_WORD + "\\s*(מס['׳]?|מספר|num|no\\.?|#))", 'i');
const UNIT_EXACT_RE = new RegExp('^\\s*' + UNIT_WORD + '\\s*$', 'i');
const unitKeyOk = k => UNIT_NUM_RE.test(k) || UNIT_EXACT_RE.test(k);
function unitOf(r, p) {
  if (r && r._saved) return r.unit_text ? { text: r.unit_text } : null;   // מיקום שמור (הדיווח נמחק)
  const found = [];
  const add = (key, val) => {
    if (val == null || typeof val === 'object') return;
    const v = String(val).trim();
    if (!v || v === '—') return;
    const kind = /עמוד|pole/i.test(key) ? 'עמוד' : 'גוב';
    if (!found.some(f => f.kind === kind)) found.push({ kind, num: v });
  };
  if (p) for (const k of Object.keys(p)) if (k !== 'url' && k !== 'category' && unitKeyOk(k)) add(k, p[k]);
  const dt = parseJ(r.details);
  if (dt && typeof dt === 'object') for (const k of Object.keys(dt)) if (k !== 'lines' && k !== 'gps' && unitKeyOk(k)) add(k, dt[k]);
  for (const k of Object.keys(r)) if (!['details', 'photos'].includes(k) && unitKeyOk(k)) add(k, r[k]);
  if (r.unit_number) add(r.unit_kind || 'גוב', r.unit_number);
  for (const [k, v] of linesOf(r)) if (UNIT_NUM_RE.test(String(k))) add(String(k), joinV(v));
  return found.length ? { text: found.map(f => `${f.kind} ${f.num}`).join(' · ') } : null;
}
function photoName(r, p) {
  const base = (p && p.category) || 'תיעוד כללי';
  const u = unitOf(r, p);
  return u ? `${base} · ${u.text}` : base;
}
function linesOf(r) { const dt = parseJ(r.details); return dt && Array.isArray(dt.lines) ? dt.lines.filter(Array.isArray) : []; }
function photosOf(r) { const p = parseJ(r.photos); return Array.isArray(p) ? p.filter(x => x && x.url) : []; }

    if (navigator.share) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        const file = new File([blob], 'report-photo.jpg', { type: blob.type || 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ title, files: [file] });
          return;
        }
      } catch (e) {}
      await navigator.share({ title, url });
      return;
    }

    const a = document.createElement('a');

    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  } catch (e) {
    window.open(url, '_blank');
  }
}

/* Download All Filtered Photos as Structured ZIP Folders */
async function downloadFilteredZip(rows) {
  if (typeof JSZip === 'undefined') {
    showToast('ספריית ה-ZIP עדיין נטענת, נסה שוב בעוד רגע');
    return;
  }
  const items = [];
  rows.forEach(r => {
    photosOf(r).forEach((p, idx) => {
      items.push({
        url: p.url,
        company: (r.company || 'ללא_חברה').replace(/[\\/:*?"<>|]/g, '_'),
        project: (r.project || 'ללא_פרויקט').replace(/[\\/:*?"<>|]/g, '_'),
        category: (p.category || 'כללי').replace(/[\\/:*?"<>|]/g, '_'),
        label: photoName(r, p).replace(/[\\/:*?"<>|]/g, '_').replace(/\s*·\s*/g, '_').replace(/\s+/g, '_'),
        date: r.date || 'ללא_תאריך',
        report_id: r.report_id,
        idx: idx + 1
      });
    });
  });

  if (!items.length) {
    showToast('אין תמונות להורדה בסינון הנוכחי');
    return;
  }

  const btn = $('#zip-btn');
  if (btn) { btn.disabled = true; btn.textContent = `⏳ אורז ${items.length} תמונות...`; }
  showToast(`מתחיל הורדה ואריזה של ${items.length} תמונות לתיקיות...`);

  try {
    const zip = new JSZip();
    let okCount = 0;
    for (const item of items) {
      try {
        const res = await fetch(item.url);
        if (!res.ok) continue;
        const blob = await res.blob();
        const ext = (blob.type && blob.type.includes('png')) ? 'png' : 'jpg';
        const folderPath = `${item.company}/${item.project}/${item.category}`;
        const fileName = `${item.label}_${item.date}_${item.report_id}_${item.idx}.${ext}`;
        zip.folder(folderPath).file(fileName, blob);
        okCount++;
      } catch (e) {}
    }

    if (!okCount) {
      showToast('לא ניתן היה להוריד את התמונות מהשרת');
      return;
    }

    const content = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(content);
    a.download = `תיעוד-תמונות-מסודר-${today()}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    showToast(`ירד בהצלחה! ${okCount} תמונות מסודרות בתיקיות`);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📦 הורדת תמונות כתיקיות (ZIP)'; }
  }
}

/* ===== חלון דו-שיח מעוצב (במקום alert / prompt / confirm) ===== */
function dlg(o) {
  return new Promise(res => {
    const ov = document.createElement('div');
    ov.className = 'dlg-ov'; ov.setAttribute('dir', 'rtl');
    ov.innerHTML = `<div class="dlg" role="dialog" aria-modal="true">
      <h3>${esc(o.title || '')}</h3>
      ${o.text ? `<p>${esc(o.text)}</p>` : ''}
      ${o.reasons ? `<div class="dlg-chips">${o.reasons.map(t => `<button type="button" class="chip">${esc(t)}</button>`).join('')}</div>` : ''}
      ${o.input ? `<textarea class="dlg-in" rows="3" placeholder="${esc(o.placeholder || '')}">${esc(o.value || '')}</textarea><div class="dlg-err"></div>` : ''}
      <div class="dlg-act"><button type="button" class="btn ${o.danger ? 'bad' : 'pri'}" data-ok>${esc(o.ok || 'אישור')}</button>${o.noCancel ? '' : '<button type="button" class="btn" data-no>ביטול</button>'}</div>
    </div>`;
    document.body.appendChild(ov);
    const ta = ov.querySelector('.dlg-in'), err = ov.querySelector('.dlg-err');
    const done = v => { document.removeEventListener('keydown', onKey, true); ov.remove(); res(v); };
    const submit = () => {
      if (!o.input) return done(true);
      const v = ta.value.trim();
      if (o.required && !v) { err.textContent = o.requiredMsg || 'שדה חובה'; ta.focus(); return; }
      done(v);
    };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(o.input ? null : false); } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey || !o.input)) { e.preventDefault(); submit(); } };
    document.addEventListener('keydown', onKey, true);
    ov.querySelector('[data-ok]').onclick = submit;
    const no = ov.querySelector('[data-no]'); if (no) no.onclick = () => done(o.input ? null : false);
    ov.onclick = e => { if (e.target === ov) done(o.input ? null : false); };
    ov.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (!ta) return; ta.value = (ta.value.trim() ? ta.value.trim() + ', ' : '') + c.textContent; err.textContent = ''; ta.focus(); });
    setTimeout(() => (ta || ov.querySelector('[data-ok]')).focus(), 30);
  });
}

var sortKey = '', sortDir = 1;
var SORT_GET = { date: r => String(r.date || ''), contractor: r => String(r.contractor_name || ''), project: r => String(r.project || ''), company: r => String(r.company || '') };
function sortRows(rows) {
  if (!sortKey || !SORT_GET[sortKey]) return rows;
  const g = SORT_GET[sortKey];
  return rows.slice().sort((a, b) => sortDir * g(a).localeCompare(g(b), 'he', { numeric: true }));
}

function pDate(v) {
  v = String(v || '').trim(); let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], m[2] - 1, +m[3]);
  m = v.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
  if (m) return new Date(+m[3] < 100 ? 2000 + +m[3] : +m[3], m[2] - 1, +m[1]);
  return null;
}

async function renderTodo() {

  const last = new Map();

  const crows = [...names].map(n => ({ n, d: last.get(n), a: last.has(n) ? ageD(last.get(n)) : null })).sort((x, y) => (y.a === null ? 9999 : y.a) - (x.a === null ? 9999 : x.a));

// ה-QR מגיע כ-SVG בתוך data URI בלי קידוד; תווים כמו # שוברים אותו, לכן מקודדים מחדש
function mfaQrSrc(q) {
  q = String(q || '');
  if (/^data:image\/svg\+xml/i.test(q)) { const i = q.indexOf(','); let svg = q.slice(i + 1); try { svg = decodeURIComponent(svg); } catch (e) {} return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); }
  return q;
}
// מצייר את ה-QR ישירות כ-SVG בדף (בלי תמונה חיצונית); אם נכשל – מציג הוראה להזנה ידנית
function mfaDrawQr(el, q) {
  try {
    q = String(q || '');
    let svg = q;
    if (/^data:/i.test(q)) { svg = q.slice(q.indexOf(',') + 1); try { svg = decodeURIComponent(svg); } catch (e) {} }
    const doc = new DOMParser().parseFromString(svg, 'image/svg+xml');
    const root = doc.documentElement;
    if (!root || root.nodeName.toLowerCase() !== 'svg' || doc.getElementsByTagName('parsererror').length) throw new Error('bad svg');
    root.querySelectorAll('script,foreignObject').forEach(n => n.remove());
    if (!root.getAttribute('viewBox') && root.getAttribute('width') && root.getAttribute('height')) root.setAttribute('viewBox', '0 0 ' + parseFloat(root.getAttribute('width')) + ' ' + parseFloat(root.getAttribute('height')));
    root.removeAttribute('width'); root.removeAttribute('height');
    root.setAttribute('style', 'width:200px;height:200px;display:block');
    el.appendChild(document.importNode(root, true));
  } catch (e) { el.innerHTML = '<span style="color:#555;font-size:13px;padding:8px">לא ניתן להציג את ה-QR.<br>השתמש בהזנה ידנית של המפתח למטה.</span>'; }
}
async function mfaCall(path, body, token, method) {
  const r = await fetch(`${SB}/auth/v1/${path}`, { method: method || 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || 'הפעולה נכשלה');
  return j;
}
async function mfaVerify(fid, code, token) {
  const ch = await mfaCall(`factors/${fid}/challenge`, null, token);
  return await mfaCall(`factors/${fid}/verify`, { challenge_id: ch.id, code: String(code).replace(/\s/g, '') }, token);
}

}

        ctx.drawImage(cv, 0, y, cv.width, h, 0, 0, cv.width, h);
        if (!first) pdf.addPage(); first = false;
        pdf.addImage(part.toDataURL('image/jpeg', 0.9), 'JPEG', 10, 10, W, h * ratio);
      }
    }
    return pdf.output('blob');
  } finally { if (overlay) overlay.remove(); }
}
async function savePdfFor(id, o = {}) {
  const r = reports.find(x => x.report_id === id); if (!r) return;
  if (_pdfBusy) { showToast('קובץ אחר בהכנה, אנא המתן'); return; }
  const name = pdfName(r);
  let handle = null;
  // חשוב: זו הפעולה הראשונה, לפני כל await – כך החלון נפתח מיד
  if (window.showSaveFilePicker) {
    try { handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'PDF', accept: { 'application/pdf': ['.pdf'] } }] }); }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  _pdfBusy = true;
  const btn = o.btn, label = o.label;
  if (btn) { btn.disabled = true; btn.textContent = 'מכין PDF…'; }
  showToast('מכין PDF…');
  let ok = false;
  try {
    const blob = await buildPdfBlob(r);
    if (handle) { const w = await handle.createWritable(); await w.write(blob); await w.close(); }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
    ok = true;
    showToast('ה-PDF נשמר');
    await markSaved(r);
  } catch (e) {
    showToast('יצירת ה-PDF נכשלה: ' + ((e && e.message) || e));
  } finally { _pdfBusy = false; }
  if (ok) refresh();
  if (btn) { btn.disabled = false; btn.textContent = ok ? '✅ נשמר – שמירה בשם שוב' : label; }
}
/* שמירת PDF מרוכזת: בחירת תיקייה (או ZIP) ← קובץ לכל דיווח נבחר */
async function bulkPdf(ids) {
  const list = ids.map(i => reports.find(x => x.report_id === i)).filter(Boolean);
  if (!list.length) return;
  if (_pdfBusy) { showToast('קובץ אחר בהכנה, אנא המתן'); return; }
  let dir = null;
  if (window.showDirectoryPicker) {
    try { dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'dash-pdf' }); }
    catch (e) { if (e && e.name === 'AbortError') return; dir = null; }
  }
  if (!dir && typeof JSZip === 'undefined') { showToast('ספריית ה-ZIP עדיין נטענת, נסה שוב בעוד רגע'); return; }
  _pdfBusy = true;
  const zip = dir ? null : new JSZip(), used = new Set();
  let done = 0, failed = 0;
  try {
    for (const r of list) {
      showToast(`מכין PDF ${done + failed + 1} מתוך ${list.length}…`);
      try {
        const blob = await buildPdfBlob(r);
        let nm = pdfName(r); if (used.has(nm)) nm = nm.replace(/\.pdf$/, `-${done + 1}.pdf`); used.add(nm);
        if (dir) await writeFileTo(dir, nm, blob); else zip.file(nm, blob);
        await markSaved(r); done++;
      } catch (e) { console.error(e); failed++; }
    }
    if (zip && done) {
      const zb = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(zb); a.download = `דוחות-${today()}.zip`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
  } finally { _pdfBusy = false; }
  showToast(`נשמרו ${done} קובצי PDF${dir ? ' בתיקייה שבחרת' : ' (קובץ ZIP)'}${failed ? ' · ' + failed + ' נכשלו' : ''}`);
  refresh();
}

/* Smart Logical Sort Gallery Hub (Company -> Project / Category / Flat) */
function renderGalleryHub(rows) {
  const allItems = [];
  rows.forEach(r => {
    const phs = photosOf(r);
    phs.forEach(p => {
      allItems.push({
        url: p.url,
        category: p.category || 'תיעוד כללי',
        label: photoName(r, p),
        company: r.company || 'ללא שיוך חברה',
        project: r.project || 'ללא שם פרויקט',
        contractor: r.contractor_name || '',
        date: r.date || '',
        report_id: r.report_id
      });
    });
  });

  if (!allItems.length) {
    $('#list').innerHTML = '<div class="empty">אין תמונות להצגה בסינון הנוכחי</div>';
    return;
  }

  let contentHtml = '';

  if (galleryGroupBy === 'company_project') {
    // Hierarchical Logical Sort: Company -> Project
    const tree = new Map();
    allItems.forEach(item => {
      if (!tree.has(item.company)) tree.set(item.company, new Map());
      const projMap = tree.get(item.company);
      if (!projMap.has(item.project)) projMap.set(item.project, []);
      projMap.get(item.project).push(item);
    });

    contentHtml = [...tree].map(([compName, projMap]) => {
      const compTotal = [...projMap.values()].reduce((s, a) => s + a.length, 0);
      return `
        <div class="hub-group">
          <div class="hub-group-title">
            <span>🏢 ${esc(compName)}</span>
            <span class="badge co">${projMap.size} פרויקטים · ${compTotal} תמונות</span>
          </div>
          ${[...projMap].map(([projName, items]) => `
            <div class="hub-sub-title">
              <span>📁 ${esc(projName)}</span>
              <span>${items.length} תמונות</span>
            </div>
            <div class="photos-grid">
              ${items.map(i => renderHubPhotoCard(i)).join('')}
            </div>
          `).join('')}
        </div>
      `;
    }).join('');
  } else {
    const groups = new Map();
    allItems.forEach(item => {
      const key = galleryGroupBy === 'company' ? item.company : (galleryGroupBy === 'category' ? item.category : item.project);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(item);
    });

    contentHtml = [...groups].map(([grpName, items]) => `
      <div class="hub-group">
        <div class="hub-group-title">
          <span>${esc(grpName)}</span>
          <span class="badge ph-cnt">${items.length} תמונות</span>
        </div>
        <div class="photos-grid">
          ${items.map(i => renderHubPhotoCard(i)).join('')}
        </div>
      </div>
    `).join('');
  }

  $('#list').innerHTML = `
    <div class="gallery-hub-controls">
      <span style="font-weight:800;font-size:14px">מיון לוגי חכם לפי:</span>
      <select id="gb-sel" style="padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card-alt);color:var(--tx);font-weight:600">
        <option value="company_project"${galleryGroupBy === 'company_project' ? ' selected' : ''}>🏢 חברה ⬅ 📁 פרויקט (היררכי)</option>
        <option value="company"${galleryGroupBy === 'company' ? ' selected' : ''}>🏢 חברה / לקוח</option>
        <option value="project"${galleryGroupBy === 'project' ? ' selected' : ''}>📁 פרויקט / אתר</option>
        <option value="category"${galleryGroupBy === 'category' ? ' selected' : ''}>🏷️ קטגוריית תמונה</option>
      </select>
      <span style="color:var(--mut);font-size:13px;font-weight:600">סה״כ ${allItems.length} תמונות</span>
      <div style="margin-right:auto">
        <button class="btn pri sm" id="zip-btn">📦 הורדת תמונות כתיקיות (ZIP)</button>
      </div>
    </div>
    ${contentHtml}
  `;

  $('#gb-sel').onchange = e => { galleryGroupBy = e.target.value; renderGalleryHub(rows); };
  $('#zip-btn').onclick = () => downloadFilteredZip(rows);
}

function ensureLeaflet() {
  if (window.L) return Promise.resolve();
  if (leafletP) return leafletP;
  leafletP = new Promise((res, rej) => {
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = base + 'leaflet.min.css';
    const cssDone = new Promise(r => { l.onload = r; l.onerror = r; setTimeout(r, 3500); });   // מחכים לעיצוב המפה לפני שמציירים
    document.head.appendChild(l);
    const sc = document.createElement('script'); sc.src = base + 'leaflet.min.js';
    sc.onload = () => cssDone.then(res);
    sc.onerror = () => { leafletP = null; rej(new Error('leaflet')); };

  });
  return leafletP;
}

function addBase(map) {
  // ברירת מחדל: מפת רחובות של Esri (אותו שרת של הלוויין שעובד); חלופות: CARTO ו-OpenStreetMap
  const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles © Esri' });
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles © Esri' });
  const carto = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { subdomains: 'abcd', maxZoom: 20, attribution: '© OpenStreetMap © CARTO' });
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
  let errs = 0;
  esri.on('tileerror', () => { if (++errs === 8) { map.removeLayer(esri); sat.addTo(map); } });   // אם גם זה נחסם – לוויין
  esri.addTo(map);
  L.control.layers({ 'מפה': esri, 'לוויין': sat, 'מפה (CARTO)': carto, 'מפה (OSM)': osm }, null, { position: 'topleft' }).addTo(map);
}

    <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${g.latitude},${g.longitude}" style="padding:6px 10px;background:#f1f5f9;border-radius:7px;text-decoration:none;color:#0f172a;font-weight:700">Google ↗</a>
    <a target="_blank" rel="noopener" href="https://waze.com/ul?ll=${g.latitude},${g.longitude}&navigate=yes" style="padding:6px 10px;background:#f1f5f9;border-radius:7px;text-decoration:none;color:#0f172a;font-weight:700">Waze ↗</a>
  </div></div>`;

const FIELD_RE = { city: /^(עיר|ישוב|יישוב|שם עיר)$/, project: /^(שם פרויקט|פרויקט|פרויקט \/ אתר|שם האתר|אתר)$/ };
function fieldOf(r, kind) {
  const v = r[kind]; if (v != null && String(v).trim() !== '') return String(v).trim();
  for (const [k, val] of linesOf(r)) if (FIELD_RE[kind].test(String(k).replace(/[:׳']/g, '').trim())) { const x = String(joinV(val)).trim(); if (x) return x; }
  return '';
}

/* ===== שמירת מיקומים כתיקייה: מיקומים / עיר / פרויקט.xlsx ===== */
var safeName = t => String(t || '').replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim().slice(0, 80) || 'ללא שם';
function placesTree(rows) {
  const tree = new Map();
  rows.map(r => ({ r, g: gpsOf(r) })).filter(x => x.g).forEach(x => {
    const c = fieldOf(x.r, 'city') || 'ללא עיר', p = fieldOf(x.r, 'project') || 'ללא פרויקט';
    if (!tree.has(c)) tree.set(c, new Map());
    const pm = tree.get(c); if (!pm.has(p)) pm.set(p, []); pm.get(p).push(x);
  });
  return tree;
}
function unitLabel(r) {
  const u = unitOf(r, null); if (u) return u.text;
  const ls = linesOf(r), kind = ls.find(([k]) => /^גוב או עמוד/.test(String(k))), det = ls.find(([k]) => /^פירוט/.test(String(k)));
  const t = [kind && joinV(kind[1]), det && joinV(det[1])].filter(Boolean).join(' · ');
  return t || 'ללא מספר גוב / עמוד';
}
function placesHtml(city, proj, list) {
  const rowsH = list.sort((a, b) => String(b.r.date || '').localeCompare(String(a.r.date || ''))).map(({ r, g }) => `<tr>

    <td><a href="https://waze.com/ul?ll=${g.latitude},${g.longitude}&navigate=yes" target="_blank">Waze</a></td></tr>`).join('');
  return `<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(proj)} – ${esc(city)}</title>
<style>body{font-family:Arial,sans-serif;margin:24px;color:#0f172a}h1{font-size:20px;margin:0}p{color:#64748b;margin:4px 0 16px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #cbd5e1;padding:9px 12px;text-align:right}th{background:#f1f5f9}a{color:#0f4c81;font-weight:700}</style></head>
<body><h1>${esc(proj)}</h1><p>${esc(city)} · ${list.length} מיקומים</p>
<table><thead><tr><th>גוב / עמוד</th><th>תאריך</th><th>קבלן</th><th>נ.צ</th><th>Google Maps</th><th>Waze</th></tr></thead><tbody>${rowsH}</tbody></table></body></html>`;
}
async function savePlacesFolder(rows) {
  const tree = placesTree(rows);
  if (!tree.size) { showToast('אין מיקומים לשמירה בסינון הנוכחי'); return; }
  let root = null;
  // חלון בחירת התיקייה נפתח מיד בלחיצה
  if (window.showDirectoryPicker) {
    try { root = await window.showDirectoryPicker({ mode: 'readwrite', id: 'dash-places' }); }
    catch (e) { if (e && e.name === 'AbortError') return; root = null; }
  }
  const files = [];
  tree.forEach((pm, city) => pm.forEach((list, proj) => files.push({ dir: safeName(city), name: safeName(proj) + '.html', data: placesHtml(city, proj, list) })));
  try {
    if (root) {
      const top = await root.getDirectoryHandle('מיקומים', { create: true });
      for (const f of files) { const d = await top.getDirectoryHandle(f.dir, { create: true }); await writeFileTo(d, f.name, f.data); }
      showToast(`נשמרה תיקיית "מיקומים" · ${tree.size} ערים · ${files.length} קבצי קישורים`);
      return;
    }
  } catch (e) { console.error(e); showToast('הכתיבה לתיקייה נכשלה – יורד קובץ ZIP'); }
  try {
    const zip = new JSZip();
    files.forEach(f => zip.folder('מיקומים').folder(f.dir).file(f.name, f.data));
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'מיקומים.zip'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    showToast('התיקייה ירדה כקובץ ZIP (מיקומים.zip)');
  } catch (e) { showToast('שמירת התיקייה נכשלה: ' + ((e && e.message) || e)); }
}

/* ===== לשונית "מיקומים": רק מיקומים (נ.צ, Waze, Google Maps) – לפי ערים, ובתוך כל עיר לפי פרויקט ===== */

/* ===== מיקומים שמורים: נשארים במסך "מיקומים" ובמפה גם אחרי שמוחקים את הדיווח ===== */
let savedLocs = [], locTableOk = false;
const locRowOf = r => {
  const g = gpsOf(r); if (!g) return null;
  const u = unitOf(r, null);
  return { report_id: r.report_id, city: fieldOf(r, 'city') || null, project: fieldOf(r, 'project') || null, unit_text: u ? u.text : null,
    latitude: +g.latitude, longitude: +g.longitude, report_date: r.date || null, contractor_name: r.contractor_name || null,
    company: r.company || null, approval_status: r.approval_status || null };
};
async function loadSavedLocs() {
  try {
    const r = await api(`${SB}/rest/v1/saved_locations?select=*&limit=10000`);
    if (!r.ok) { locTableOk = false; return; }
    savedLocs = await r.json(); locTableOk = true;
  } catch (e) { locTableOk = false; }
}
async function syncLocations(only) {
  if (!locTableOk) return { ok: true, skipped: true };
  try {
    const have = new Map(savedLocs.map(x => [x.report_id, x]));
    const todo = (only || reports).map(locRowOf).filter(Boolean).filter(x => {
      const h = have.get(x.report_id);
      return !h || (h.approval_status || null) !== x.approval_status || (h.unit_text || null) !== x.unit_text || (h.city || null) !== x.city || (h.project || null) !== x.project;
    });
    for (let i = 0; i < todo.length; i += 200) {
      const chunk = todo.slice(i, i + 200);
      const r = await api(`${SB}/rest/v1/saved_locations?on_conflict=report_id`, { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(chunk) });
      if (!r.ok) return { ok: false };
      chunk.forEach(x => { const k = savedLocs.findIndex(y => y.report_id === x.report_id); if (k >= 0) savedLocs[k] = { ...savedLocs[k], ...x }; else savedLocs.push(x); });
    }
    return { ok: true, n: todo.length };
  } catch (e) { return { ok: false }; }
}
// שורות "דמה" למיקומים ששמורים בטבלה והדיווח שלהם כבר נמחק – כדי שייראו במפה ובמסך המיקומים

    approval_status: x.approval_status, unit_text: x.unit_text, details: JSON.stringify({ gps: { latitude: x.latitude, longitude: x.longitude }, lines: [] }), photos: '[]', _saved: true
  }));
}

async function delSavedLoc(id) {

/* ===================== ייצוא אקסל מקצועי ===================== */
const joinV = v => Array.isArray(v) ? v.join(', ') : (v ?? '');
const HE_MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
const monthKeyOf = r => { const m = /^(\d{4})-(\d{2})/.exec(String(r.date || '')) || /^(\d{4})-(\d{2})/.exec(String(r.created_at || '')); return m ? `${m[1]}-${m[2]}` : null; };
const monthLabelOf = key => { const [y, m] = key.split('-'); return `${HE_MONTHS[+m - 1]} ${y}`; };
const XB = c => ({ style: 'thin', color: { rgb: c } });
const BORD = { top: XB('CBD5E1'), bottom: XB('CBD5E1'), left: XB('CBD5E1'), right: XB('CBD5E1') };
const GROUP_COLORS = { 'פרטי הדיווח': ['0A365C', '0F4C81'], 'סעיפי עבודה': ['115E59', '0F766E'], 'נתונים נוספים': ['475569', '64748B'], 'אישור': ['92400E', 'B45309'], 'מיקום': ['1E293B', '334155'] };

function simpleSheet(title, head, data, widths, numCols = [], total = null) {
  const N = head.length;
  const aoa = [[title, ...Array(N - 1).fill('')], Array(N).fill(''), head, ...data];
  if (total) aoa.push(total);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: N - 1 } }];
  ws['!cols'] = widths.map(w => ({ wch: w }));
  ws['!views'] = [{ rightToLeft: true, RTL: true, showGridLines: false }];
  ws['!rows'] = [{ hpt: 34 }, { hpt: 6 }, { hpt: 30 }];
  const lastR = aoa.length - 1;
  for (let R = 0; R <= lastR; R++) for (let C = 0; C < N; C++) {
    const addr = XLSX.utils.encode_cell({ r: R, c: C });
    const cell = ws[addr] || (ws[addr] = { t: 's', v: '' });
    if (R === 0) cell.s = { font: { name: 'Arial', sz: 16, bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '0A2A4A' } }, alignment: { horizontal: 'right', vertical: 'center', readingOrder: 2 } };
    else if (R === 1) continue;
    else if (R === 2) cell.s = { font: { name: 'Arial', sz: 10.5, bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '0F4C81' } }, alignment: { horizontal: 'center', vertical: 'center', wrapText: true }, border: { ...BORD, bottom: { style: 'medium', color: { rgb: '0A365C' } } } };
    else if (total && R === lastR) cell.s = { font: { name: 'Arial', sz: 10.5, bold: true, color: { rgb: '0A365C' } }, fill: { fgColor: { rgb: 'E2E8F0' } }, alignment: { horizontal: numCols.includes(C) ? 'center' : 'right', vertical: 'center' }, border: { ...BORD, top: { style: 'medium', color: { rgb: '0A365C' } } } };
    else cell.s = { font: { name: 'Arial', sz: 10, bold: numCols.includes(C), color: { rgb: '0F172A' } }, fill: { fgColor: { rgb: (R % 2) ? 'FFFFFF' : 'F1F5F9' } }, alignment: { horizontal: numCols.includes(C) ? 'center' : 'right', vertical: 'center', wrapText: true }, border: BORD };
  }
  if (data.length) ws['!autofilter'] = { ref: `${XLSX.utils.encode_cell({ r: 2, c: 0 })}:${XLSX.utils.encode_cell({ r: 2 + data.length, c: N - 1 })}` };

const idbOpen = () => new Promise((res, rej) => { const q = indexedDB.open('dash_fs', 1); q.onupgradeneeded = () => q.result.createObjectStore('h'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const idbGet = async k => { try { const d = await idbOpen(); return await new Promise(res => { const r = d.transaction('h').objectStore('h').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); } catch (e) { return null; } };

async function getBaseDir(pick) {
  if (!window.showDirectoryPicker) return null;
  let h = pick ? null : await idbGet('dir');
  if (h) { try { let pm = await h.queryPermission({ mode: 'readwrite' }); if (pm !== 'granted') pm = await h.requestPermission({ mode: 'readwrite' }); if (pm !== 'granted') h = null; } catch (e) { h = null; } }
  if (!h && pick) { h = await window.showDirectoryPicker({ mode: 'readwrite', id: 'dash-excel' }); await idbSet('dir', h); }
  return h || null;
}
async function writeFileTo(dir, name, data) { const fh = await dir.getFileHandle(name, { create: true }); const w = await fh.createWritable(); await w.write(data); await w.close(); }

async function exportExcelMonthly(pick) {
  if (typeof XLSX === 'undefined') { showToast('ספריית האקסל עדיין נטענת, נסה שוב בעוד רגע'); return; }
  let dir = null;
  try { dir = await getBaseDir(pick); } catch (e) { if (e && e.name === 'AbortError') return; showToast('לא ניתן לגשת לתיקייה שנבחרה – הקובץ יורד כרגיל'); dir = null; }
  showToast('מכין את קובץ האקסל…');
  const now = new Date(), curKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const curName = `${monthLabelOf(curKey)}.xlsx`;
  let mk = null;
  try {
    const byMonth = new Map();
    [...reports].sort((a, b) => String(a.date || '').localeCompare(String(b.date || ''))).forEach(r => { const k = monthKeyOf(r); if (!k) return; if (!byMonth.has(k)) byMonth.set(k, []); byMonth.get(k).push(r); });
    mk = k => buildWorkbook(byMonth.get(k) || [], `דוח ביצוע עבודות – ${monthLabelOf(k)}`, `חודש ${monthLabelOf(k)} · הופק ב-${now.toLocaleDateString('he-IL')} · ${(byMonth.get(k) || []).length} דיווחים`);
    if (!dir) {
      XLSX.writeFile(mk(curKey), curName);
      showToast(`הקובץ "${curName}" הורד` + (window.showDirectoryPicker ? ' · לשמירה אוטומטית בתיקיות לחץ על "תיקיית שמירה"' : ''));
      return;
    }
    const bytes = wb => XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    await writeFileTo(dir, curName, bytes(mk(curKey)));
    const arch = await dir.getDirectoryHandle('דוח חודשי', { create: true });
    const prevKeys = [...byMonth.keys()].filter(k => k < curKey).sort(), latestPrev = prevKeys[prevKeys.length - 1];
    for (const k of prevKeys) {
      const nm = `${monthLabelOf(k)}.xlsx`;
      let exists = true; try { await arch.getFileHandle(nm); } catch (e) { exists = false; }
      if (!exists || k === latestPrev) await writeFileTo(arch, nm, bytes(mk(k)));
    }
    // קבצי חודשים קודמים שנשארו בתיקייה הראשית – עוברים לתיקיית "דוח חודשי"
    const re = new RegExp('^(' + HE_MONTHS.join('|') + ') (\\d{4})\\.xlsx$');
    for await (const [nm, h] of dir.entries()) {
      const m = h.kind === 'file' && re.exec(nm); if (!m || nm === curName) continue;

      if (key >= curKey) continue;
      let exists = true; try { await arch.getFileHandle(nm); } catch (e) { exists = false; }
      if (!exists) await writeFileTo(arch, nm, await (await h.getFile()).arrayBuffer());
      await dir.removeEntry(nm);
    }
    showToast(`נשמר: ${curName} בתיקייה שבחרת · חודשים קודמים בתיקייה "דוח חודשי"`);
  } catch (e) {
    console.error(e);
    try { if (mk) { XLSX.writeFile(mk(curKey), curName); showToast('לא ניתן לכתוב לתיקייה – הקובץ הורד כרגיל'); return; } } catch (e2) { console.error(e2); }
    showToast('יצירת קובץ האקסל נכשלה: ' + ((e && e.message) || e));

/* נעילה אוטומטית: אחרי 30 דקות ללא פעילות (או אתר סגור / ברקע כל הזמן הזה) – נדרשת סיסמה מחדש */
const LOCK_MS = 30 * 60 * 1000;
const seenAt = () => { try { return +localStorage.getItem('dash_seen') || 0; } catch (e) { return 0; } };
const touchSeen = () => { try { if (session) localStorage.setItem('dash_seen', String(Date.now())); } catch (e) {} };
function lockIfStale() {
  if (session && Date.now() - seenAt() > LOCK_MS) {
    saveSession(null);
    try { localStorage.removeItem('dash_seen'); } catch (e) {}
    return true;
  }
  return false;
}
let lastAct = Date.now();
const markActive = () => { const t = Date.now(); if (t - lastAct > 5000) { lastAct = t; touchSeen(); } };
['pointerdown', 'keydown', 'touchstart', 'wheel', 'mousemove', 'scroll'].forEach(ev => addEventListener(ev, markActive, { passive: true, capture: true }));
setInterval(() => { if (session && lockIfStale()) renderLogin('נותקת עקב חוסר פעילות של 30 דקות – יש להתחבר מחדש.'); }, 30000);
addEventListener('pagehide', touchSeen);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { touchSeen(); return; }
  if (lockIfStale()) renderLogin('נותקת עקב חוסר פעילות של 30 דקות – יש להתחבר מחדש.', true);
  else { touchSeen(); if (Date.now() - lastRefresh >= REFRESH_MS) softRefresh(); }
});

/* רענון נתונים אוטומטי כל 15 דקות (בלי לסגור חלונות פתוחים ובלי לאבד מקום) */
const REFRESH_MS = 5 * 60 * 1000;
let lastRefresh = Date.now();
async function softRefresh() {
  if (!session || !$('#list') || document.visibilityState !== 'visible') return;
  if ($('#modal') && $('#modal').classList.contains('open')) return;        // חלון דיווח פתוח
  if (view === 'users' || view === 'map' || view === 'msgs' || view === 'mfa' || view === 'log' || view === 'bin') return;                           // מסכים שלא כדאי להפריע בהם
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;             // באמצע הקלדה
  try {
    let r = await api(`${SB}/rest/v1/reports?select=*&order=id.desc&limit=2000`);
    if (r.status === 400) r = await api(`${SB}/rest/v1/reports?select=*&limit=2000`);
    if (!r.ok) return;
    const rows = await r.json(), seenIds = new Map();
    rows.forEach(x => { if (!seenIds.has(x.report_id)) seenIds.set(x.report_id, x); });
    reports = [...seenIds.values()];
    lastRefresh = Date.now();
    refresh();
  } catch (e) {}
}
setInterval(() => { if (Date.now() - lastRefresh >= REFRESH_MS) softRefresh(); paintGreet(); }, 60000);
setInterval(() => { if (document.visibilityState === 'visible') { checkMsgs(); updateReqBadge(true); } }, 120000);

/* ===== הודעות: מסך שליחה (מנהל) + חלון קופץ למקבלים ===== */
var AUD_LABELS = { all: 'כולם', contractor: 'טכנאי שטח (קבלנים)', staff: 'משתמשי ניהול' };
function nl2br(t) { return esc(t).replace(/\n/g, '<br>'); }
async function renderMsgs() {
  $('#list').innerHTML = '<div class="sk-wrap">' + '<div class="sk sk-r"></div>'.repeat(3) + '</div>';
  const [ra, rr, rp] = await Promise.all([
    api(`${SB}/rest/v1/announcements?select=*&order=created_at.desc&limit=50`),
    api(`${SB}/rest/v1/announcement_reads?select=announcement_id,user_id,read_at&limit=5000`),
    api(`${SB}/rest/v1/profiles?select=id,email,full_name,role,contractor_name`)
  ]);
  if (!ra.ok) { $('#list').innerHTML = '<div class="err">לא ניתן לטעון הודעות. ודא שהרצת את supabase_announcements.sql.</div>'; return; }
  const anns = await ra.json(), reads = rr.ok ? await rr.json() : [], profs = rp.ok ? await rp.json() : [];
  const nameOf = u => u.full_name || u.contractor_name || u.email || '';
  const inAud = (a, u) => (a.audience === 'all' || (a.audience === 'contractor' && u.role === 'contractor') || (a.audience === 'staff' && (u.role === 'admin' || u.role === 'manager')));
  $('#list').innerHTML = `
    <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-sm)">
      <b>📣 שליחת הודעה</b>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <input id="mg-t" placeholder="כותרת (לא חובה)" style="flex:2 1 200px" maxlength="80">
        <select id="mg-a" style="flex:1 1 180px">${Object.entries(AUD_LABELS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
      </div>
      <textarea id="mg-b" rows="3" placeholder="תוכן ההודעה…" style="width:100%;margin-top:8px" maxlength="1000"></textarea>
      <div style="margin-top:8px"><button class="btn pri" id="mg-send">שלח הודעה</button></div>
      <small style="color:var(--mut)">החלון הקופץ מופיע למקבלים כשהם פותחים את האפליקציה/האתר (או תוך כמה דקות אם הם פתוחים), עד שילחצו "קראתי". בנוסף, טכנאי שהפעיל התראות בטלפון מקבל גם התראת push כשהאפליקציה סגורה.</small>
    </div>
    ${anns.length ? anns.map(a => {
      const aud = profs.filter(u => inAud(a, u)), rd = new Set(reads.filter(x => x.announcement_id === a.id).map(x => x.user_id));
      const got = aud.filter(u => rd.has(u.id)), not = aud.filter(u => !rd.has(u.id));
      return `<div style="background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm)">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(a.title || 'הודעה')}</b><span class="role-pill">${esc(AUD_LABELS[a.audience] || a.audience)}</span><span style="color:var(--mut);font-size:12px">${dtl(a.created_at)}</span><span style="margin-inline-start:auto"><button class="btn sm bad" data-delmsg="${esc(a.id)}">מחק</button></span></div>
        <div style="margin:8px 0">${nl2br(a.body)}</div>
        <details><summary style="cursor:pointer;color:var(--mut);font-size:13px">נקראה ע״י ${got.length} מתוך ${aud.length}</summary>
          <div style="font-size:13px;margin-top:6px"><b>קראו:</b> ${got.length ? got.map(u => esc(nameOf(u))).join(', ') : '—'}<br><b>עדיין לא:</b> ${not.length ? not.map(u => esc(nameOf(u))).join(', ') : '—'}</div></details>
      </div>`;
    }).join('') : '<div class="empty">עדיין לא נשלחו הודעות</div>'}`;
  $('#mg-send').onclick = async () => {
    const body = $('#mg-b').value.trim(), title = $('#mg-t').value.trim(), audience = $('#mg-a').value;
    if (!body) { showToast('כתוב את תוכן ההודעה'); return; }
    const ok = await dlg({ title: 'שליחת הודעה', text: `לשלוח את ההודעה אל: ${AUD_LABELS[audience]}?`, ok: 'שלח' });
    if (!ok) return;
    const d = await api(`${SB}/rest/v1/announcements`, { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify({ title: title || null, body, audience }) });
    if (!d.ok) { showToast('השליחה נכשלה – ודא שהרצת את supabase_announcements.sql'); return; }
    let note = 'ההודעה נשלחה';
    try {
      const created = (await d.json())[0];
      const pr = await api(`${SB}/functions/v1/send-push`, { method: 'POST', body: JSON.stringify({ announcement_id: created.id }) });
      if (pr.ok) { const pj = await pr.json(); note += ` · התראות push נשלחו ל-${pj.sent} טלפונים` + (pj.failed ? ` (${pj.failed} נכשלו)` : ''); }
      else if (pr.status === 404 && !(await pr.clone().text()).includes('error')) note += ' · (התראות push עדיין לא הופעלו ב-Supabase)';
      else { let em = ''; try { const ej = await pr.json(); em = ej.error || ej.message || ej.msg || ''; } catch (e) {} note += ' · שליחת ה-push נכשלה (' + pr.status + (em ? ': ' + em : '') + ')'; console.error('send-push', pr.status, em); }
    } catch (e) { note += ' · שליחת ה-push נכשלה: ' + ((e && e.message) || e); console.error('send-push', e); }
    renderMsgs();
    dlg({ title: 'ההודעה נשלחה', text: note.replace('ההודעה נשלחה · ', '').replace('ההודעה נשלחה', 'ללא התראות push'), ok: 'הבנתי', noCancel: true });
  };
  document.querySelectorAll('[data-delmsg]').forEach(b => b.onclick = async () => {
    if (!(await dlg({ title: 'מחיקת הודעה', text: 'ההודעה תימחק לכולם. להמשיך?', ok: 'מחק', danger: true }))) return;
    const d = await api(`${SB}/rest/v1/announcements?id=eq.${encodeURIComponent(b.dataset.delmsg)}`, { method: 'DELETE' });
    showToast(d.ok ? 'ההודעה נמחקה' : 'המחיקה נכשלה'); if (d.ok) renderMsgs();
  });
}
var _msgBusy = false;
async function checkMsgs() {
  if (_msgBusy || !session || !userId || document.getElementById('msg-pop')) return;
  _msgBusy = true;
  try {
    const ra = await api(`${SB}/rest/v1/announcements?select=*&order=created_at.asc&limit=30`);
    if (!ra.ok) return;
    const anns = (await ra.json()).filter(a => a.created_by !== userId);
    if (!anns.length) return;
    const rr = await api(`${SB}/rest/v1/announcement_reads?select=announcement_id&user_id=eq.${encodeURIComponent(userId)}`);
    const done = new Set(rr.ok ? (await rr.json()).map(x => x.announcement_id) : []);
    let loc = []; try { loc = JSON.parse(localStorage.getItem('msg_read') || '[]'); } catch (e) {}
    const a = anns.find(x => !done.has(x.id) && !loc.includes(x.id));
    if (!a) return;
    const ov = document.createElement('div');
    ov.id = 'msg-pop'; ov.className = 'dlg-ov'; ov.setAttribute('dir', 'rtl');
    ov.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><h3>📣 ${esc(a.title || 'הודעה מהמנהל')}</h3><p>${nl2br(a.body)}</p><div class="dlg-act"><button type="button" class="btn pri" data-ok>קראתי</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector('[data-ok]').onclick = async () => {
      try { loc.push(a.id); localStorage.setItem('msg_read', JSON.stringify(loc.slice(-100))); } catch (e) {}
      ov.remove();
      try { await api(`${SB}/rest/v1/announcement_reads`, { method: 'POST', headers: { Prefer: 'resolution=ignore-duplicates,return=minimal' }, body: JSON.stringify({ announcement_id: a.id }) }); } catch (e) {}
      setTimeout(checkMsgs, 400);
    };
  } catch (e) {} finally { _msgBusy = false; }
}

function start() {
  const hp = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (hp.get('type') === 'recovery' && hp.get('access_token')) { renderReset(hp.get('access_token')); return; }
  if (hp.get('error_description')) { history.replaceState(null, '', location.pathname + location.search); renderLogin(hp.get('error_description')); return; }
  const locked = lockIfStale();
  touchSeen();
  if (session) setTimeout(checkMsgs, 2500);
  session ? load() : renderLogin(locked ? 'נותקת עקב חוסר פעילות של 30 דקות – יש להתחבר מחדש.' : undefined, !!locked);
}
/* ===== התראות Push למנהל (בקשת איפוס סיסמה / דיווח חדש / הודעות) ===== */
var ADM_VAPID = 'BILvigSt7Oi1CiRG0nLC-uH4W2u83Uumuq0ijuEhZkIJ_H1KWdpFG0fyAmgws2pdWbDN6ue8YVb7OufjErYVXQk';
function admPushOk() { return !!session && ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window) && location.protocol === 'https:'; }
function admPushLabel() { return ic("bell") + (('Notification' in window && Notification.permission === 'granted') ? ' התראות פעילות ✓' : ' התראות בטלפון'); }
function admB64(b) { const p = '='.repeat((4 - b.length % 4) % 4), r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); }
async function admSub(reg) {
  let sub = await reg.pushManager.getSubscription();
  if (sub) { try { const cur = sub.options && sub.options.applicationServerKey, want = admB64(ADM_VAPID); if (cur && (cur.byteLength !== want.length || new Uint8Array(cur).some((v, i) => v !== want[i]))) { await sub.unsubscribe(); sub = null; } } catch (e) {} }
  return sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: admB64(ADM_VAPID) });
}
async function admSave(sub) {
  const k = sub.toJSON().keys || {};
  const r = await api(`${SB}/rest/v1/push_subscriptions?on_conflict=endpoint`, { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ endpoint: sub.endpoint, p256dh: k.p256dh, auth: k.auth }) });
  return r.ok;
}
async function enableAdminPush() {
  try {
    if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone)) { dlg({ title: 'התראות באייפון', text: 'באייפון צריך קודם להוסיף את האתר למסך הבית: כפתור השיתוף ← "הוספה למסך הבית", ואז לפתוח אותו משם וללחוץ שוב על "התראות בטלפון".', ok: 'הבנתי' }); return; }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { showToast('ההתראות נחסמו. אפשר לאשר אותן בהגדרות הדפדפן.'); return; }
    const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' }).then(() => navigator.serviceWorker.ready);
    const ok = await admSave(await admSub(reg));
    showToast(ok ? 'ההתראות הופעלו במכשיר הזה' : 'ההרשמה לא נשמרה – ודא שהרצת את supabase_push.sql');
    const b = document.getElementById('tb'); if (b) b.innerHTML = admPushLabel();
  } catch (e) { console.error(e); showToast('הפעלת ההתראות נכשלה'); }
}
async function refreshAdminPush() {
  try { if (!admPushOk() || Notification.permission !== 'granted') return; const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' }).then(() => navigator.serviceWorker.ready); await admSave(await admSub(reg)); } catch (e) {}
}
setTimeout(refreshAdminPush, 6000);

start();
</script>
