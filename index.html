<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לוח ניהול – דיווח עבודות</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mut:#6b7690;--line:#e3e8f2;--pri:#1f6feb;--pri-tx:#fff;--bad:#d1364b;--ok:#1a9d5b}
:root[data-theme=dark]{--bg:#0e1420;--card:#172033;--tx:#e8eefc;--mut:#8f9bb5;--line:#26324b;--pri:#4c8dff;--pri-tx:#08101f;--bad:#ff6b7e;--ok:#3ccf8a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1420;--card:#172033;--tx:#e8eefc;--mut:#8f9bb5;--line:#26324b;--pri:#4c8dff;--pri-tx:#08101f;--bad:#ff6b7e;--ok:#3ccf8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
button,input{font:inherit}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn.pri{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}
.btn.bad{color:var(--bad)}
main{max-width:980px;margin:0 auto;padding:16px}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px}.stat span{color:var(--mut);font-size:13px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);margin-bottom:12px}
.row{display:grid;grid-template-columns:110px 1fr 1fr;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.row:active{opacity:.7}.row small{color:var(--mut);display:block;font-size:12px}
.row .id{grid-column:1/-1;color:var(--mut);font-size:12px;direction:ltr;text-align:right}
.empty,.msg{text-align:center;color:var(--mut);padding:30px 10px}
.err.ok{border-color:var(--ok);color:var(--ok)}
.link{background:none;border:0;color:var(--pri);cursor:pointer;padding:6px 0;text-decoration:underline}
.sub{margin:14px 0 6px;font-size:15px;color:var(--mut)}
.cap{font-size:12px;color:var(--mut);margin-top:2px}
.err{background:var(--card);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:14px;margin-bottom:12px;white-space:pre-wrap;line-height:1.5}
.login{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.login h2{margin:0 0 14px}.login input{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10;overflow:auto}
.modal.open{display:block}
.sheet{background:var(--card);max-width:760px;margin:24px auto;border-radius:16px;padding:18px;min-height:40vh}
.sheet h3{margin:0 0 12px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15px;margin-bottom:14px}
.kv div:nth-child(odd){color:var(--mut)}.kv div:nth-child(even){word-break:break-word}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#sheet{display:none}
@media print{body>*:not(#sheet){display:none!important}#sheet{display:block;color:#000;background:#fff}
#sheet .p{page-break-after:always;height:96vh;display:flex;align-items:center;justify-content:center}
#sheet .p:last-child{page-break-after:auto}#sheet .p img{max-width:100%;max-height:96vh;object-fit:contain}
#sheet .first{display:block;height:auto;padding:20px}}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters select,.filters input{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
.filters label{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar .spacer{flex:1}
.tabs{display:flex;gap:6px}
.gps{color:var(--ok);font-size:12px}
.co{background:var(--pri);color:var(--pri-tx);border-radius:6px;padding:1px 8px;font-weight:700;font-size:12px;direction:ltr;display:inline-block}
#map{position:relative;z-index:0}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="detail"></div></div>
<div id="sheet"></div>

<script>
const SB = 'https://oisozmbfaebtqicleufm.supabase.co';
const KEY = 'sb_publishable_8F8GsbT_3oCguIchXRwe0A_zATL1KWA';
const BUCKET = 'report-photos';
const LABELS = {report_id:'מזהה דיווח',contractor_name:'קבלן',date:'תאריך',project:'פרויקט',created_at:'נשמר ב',company:'חברה',city:'עיר',address:'כתובת'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let session = null, reports = [], query = '';

try { session = JSON.parse(localStorage.getItem('dash_session') || 'null'); } catch (e) {}
try { const t = localStorage.getItem('dash_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

function saveSession(s) { session = s; try { s ? localStorage.setItem('dash_session', JSON.stringify(s)) : localStorage.removeItem('dash_session'); } catch (e) {} }

async function auth(path, body) {
  const r = await fetch(`${SB}/auth/v1/${path}`, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.msg || 'שגיאת התחברות');
  return { access_token: j.access_token, refresh_token: j.refresh_token, email: j.user && j.user.email };
}

async function api(url, opts = {}, retry = true) {
  const r = await fetch(url, { ...opts, headers: { apikey: KEY, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 401 && retry && session.refresh_token) {
    try { saveSession(await auth('token?grant_type=refresh_token', { refresh_token: session.refresh_token })); return api(url, opts, false); }
    catch (e) { saveSession(null); renderLogin(); throw e; }
  }
  return r;
}

function renderLogin(msg, ok) {
  $('#app').innerHTML = `<form class="login" id="lf"><h2>כניסה ללוח הניהול</h2>
    <input id="em" type="email" placeholder="אימייל" autocomplete="username" required>
    <input id="pw" type="password" placeholder="סיסמה" autocomplete="current-password" required>
    ${msg ? `<div class="err${ok ? ' ok' : ''}">${esc(msg)}</div>` : ''}
    <button class="btn pri" style="width:100%">התחברות</button>
    <button type="button" class="link" id="fg">שכחתי סיסמה</button></form>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    try { saveSession(await auth('token?grant_type=password', { email: $('#em').value.trim(), password: $('#pw').value })); start(); }
    catch (err) { renderLogin(err.message); }
  };
  $('#fg').onclick = async () => {
    const email = $('#em').value.trim();
    if (!email) { renderLogin('הקלד קודם את האימייל בשדה הראשון ואז לחץ "שכחתי סיסמה"'); return; }
    const hosted = /^https?:/.test(location.protocol);
    const url = `${SB}/auth/v1/recover` + (hosted ? `?redirect_to=${encodeURIComponent(location.origin + location.pathname)}` : '');
    try {
      const r = await fetch(url, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.msg || j.error_description || 'שליחת המייל נכשלה'); }
      renderLogin('אם האימייל רשום, נשלח אליו קישור לאיפוס סיסמה.' + (hosted ? '' : ' שים לב: הלוח פתוח מקובץ מקומי, ולכן הקישור לא יחזור אליו. ראה הסבר אצל Claude.'), true);
    } catch (err) { renderLogin(err.message); }
  };
}

function renderReset(token) {
  $('#app').innerHTML = `<form class="login" id="rf2"><h2>בחירת סיסמה חדשה</h2>
    <input id="np" type="password" placeholder="סיסמה חדשה (לפחות 6 תווים)" autocomplete="new-password" minlength="6" required>
    <button class="btn pri" style="width:100%">שמירת סיסמה</button></form>`;
  $('#rf2').onsubmit = async e => {
    e.preventDefault();
    const r = await fetch(`${SB}/auth/v1/user`, { method: 'PUT', headers: { apikey: KEY, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#np').value }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); alert(j.msg || j.error_description || 'העדכון נכשל'); return; }
    history.replaceState(null, '', location.pathname + location.search);
    saveSession(null); renderLogin('הסיסמה עודכנה. אפשר להתחבר.', true);
  };
}

const SQL_HINT = `אם זו שגיאת הרשאה, הרץ ב-Supabase → SQL Editor:

grant select, delete on public.reports to authenticated;
create policy "dash read" on public.reports for select to authenticated using (true);
create policy "dash delete" on public.reports for delete to authenticated using (true);
create policy "dash list photos" on storage.objects for select to authenticated using (bucket_id='report-photos');
create policy "dash delete photos" on storage.objects for delete to authenticated using (bucket_id='report-photos');`;

async function load() {
  $('#app').innerHTML = '<div class="msg">טוען דיווחים…</div>';
  let r = await api(`${SB}/rest/v1/reports?select=*&order=id.desc&limit=2000`);
  if (r.status === 400) r = await api(`${SB}/rest/v1/reports?select=*&limit=2000`);
  if (!r.ok) {
    let body = ''; try { body = await r.text(); } catch (e) {}
    renderShell(`<div class="err">שגיאה ${r.status} מ-Supabase:\n${esc(body.slice(0, 400))}\n\n${esc(SQL_HINT)}</div>`); return;
  }
  const rows = await r.json();
  const seen = new Map();
  rows.forEach(x => { if (!seen.has(x.report_id)) seen.set(x.report_id, x); });
  reports = [...seen.values()];
  renderShell();
}

let fCompany = '', fContractor = '', fFrom = '', fTo = '', view = 'list', mapObj = null, mapTok = 0, leafletP = null;

function parseJ(v) { if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return null; } } return v; }
function gpsOf(r) { const dt = parseJ(r.details); const g = dt && dt.gps; return g && g.latitude != null && g.longitude != null ? g : null; }
function linesOf(r) { const dt = parseJ(r.details); return dt && Array.isArray(dt.lines) ? dt.lines.filter(Array.isArray) : []; }
function photosOf(r) { const p = parseJ(r.photos); return Array.isArray(p) ? p.filter(x => x && x.url) : []; }
const today = () => new Date().toISOString().slice(0, 10);

function filtered() {
  const q = query.trim().toLowerCase();
  return reports.filter(r =>
    (!q || [r.contractor_name, r.project, r.date, r.report_id, r.city, r.address, r.company].some(v => String(v || '').toLowerCase().includes(q))) &&
    (!fContractor || r.contractor_name === fContractor) &&
    (!fCompany || r.company === fCompany) &&
    (!fFrom || (r.date && r.date >= fFrom)) &&
    (!fTo || (r.date && r.date <= fTo)));
}

function renderShell(extra = '') {
  const names = [...new Set(reports.map(r => r.contractor_name).filter(Boolean))].sort();
  const companies = [...new Set(reports.map(r => r.company).filter(Boolean))].sort();
  $('#app').innerHTML = `<header><h1>דיווח עבודות – ניהול</h1>
    <button class="btn" id="th">🌓</button><button class="btn" id="rf">רענון</button><button class="btn" id="lo">יציאה</button></header>
    <main>${extra}
    <div class="stats" id="stats"></div>
    <input class="search" id="q" placeholder="חיפוש לפי קבלן, פרויקט, עיר, כתובת, תאריך או מזהה" value="${esc(query)}">
    <div class="filters">
      <select id="fc"><option value="">כל הקבלנים</option>${names.map(n => `<option value="${esc(n)}"${n === fContractor ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <select id="fk"><option value="">כל החברות</option>${companies.map(n => `<option value="${esc(n)}"${n === fCompany ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <label>מתאריך <input type="date" id="ff" value="${esc(fFrom)}"></label>
      <label>עד <input type="date" id="ft" value="${esc(fTo)}"></label>
      <button class="btn" id="fx">ניקוי סינון</button>
    </div>
    <div class="bar"><div class="tabs"><button class="btn" id="tl">רשימה</button><button class="btn" id="tm">מפה 📍</button></div><div class="spacer"></div>
      <button class="btn" id="e1">ייצוא לאקסל</button><button class="btn" id="e2">ייצוא פרטים מלאים</button></div>
    <div id="list"></div></main>`;
  $('#th').onclick = () => { const d = document.documentElement; const dark = getComputedStyle(d).getPropertyValue('--bg').trim() === '#0e1420'; d.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('dash_theme', d.dataset.theme); } catch (e) {} };
  $('#rf').onclick = load;
  $('#lo').onclick = () => { saveSession(null); renderLogin(); };
  $('#q').oninput = e => { query = e.target.value; refresh(); };
  $('#fk').onchange = e => { fCompany = e.target.value; refresh(); };
  $('#fc').onchange = e => { fContractor = e.target.value; refresh(); };
  $('#ff').onchange = e => { fFrom = e.target.value; refresh(); };
  $('#ft').onchange = e => { fTo = e.target.value; refresh(); };
  $('#fx').onclick = () => { query = ''; fCompany = fContractor = fFrom = fTo = ''; renderShell(extra); };
  $('#tl').onclick = () => { view = 'list'; refresh(); };
  $('#tm').onclick = () => { view = 'map'; refresh(); };
  $('#e1').onclick = exportSummary;
  $('#e2').onclick = exportLong;
  refresh();
}

function refresh() {
  const rows = filtered();
  const contractors = new Set(rows.map(r => r.contractor_name).filter(Boolean)).size;
  $('#stats').innerHTML = `<div class="stat"><b>${rows.length}</b><span>דיווחים${rows.length !== reports.length ? ' מתוך ' + reports.length : ''}</span></div>
    <div class="stat"><b>${contractors}</b><span>קבלנים</span></div><div class="stat"><b>${rows.filter(gpsOf).length}</b><span>עם מיקום</span></div>`;
  $('#tl').classList.toggle('pri', view === 'list');
  $('#tm').classList.toggle('pri', view === 'map');
  if (view === 'map') renderMap(rows);
  else { mapTok++; if (mapObj) { mapObj.remove(); mapObj = null; } renderList(rows); }
}

function renderList(rows) {
  $('#list').innerHTML = rows.length ? rows.map(r => `<div class="row" data-id="${esc(r.report_id)}">
    <div><small>תאריך</small>${esc(r.date || '—')}</div><div><small>קבלן</small>${esc(r.contractor_name || '—')}</div><div><small>פרויקט</small>${esc(r.project || '—')}</div>
    <div class="id">${r.company ? `<span class="co">${esc(r.company)}</span> ` : ''}${esc(r.report_id)}${r.city || r.address ? ' · ' + esc([r.city, r.address].filter(Boolean).join(', ')) : ''} ${gpsOf(r) ? '<span class="gps">📍 מיקום</span>' : ''}</div></div>`).join('') : '<div class="empty">אין דיווחים להצגה</div>';
  document.querySelectorAll('.row').forEach(el => el.onclick = () => openDetail(el.dataset.id));
}

function ensureLeaflet() {
  if (window.L) return Promise.resolve();
  if (leafletP) return leafletP;
  leafletP = new Promise((res, rej) => {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(l);
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    s.onload = res; s.onerror = () => { leafletP = null; rej(new Error('leaflet')); }; document.head.appendChild(s);
  });
  return leafletP;
}

async function renderMap(rows) {
  const tok = ++mapTok;
  const pts = rows.map(r => ({ r, g: gpsOf(r) })).filter(x => x.g);
  if (mapObj) { mapObj.remove(); mapObj = null; }
  $('#list').innerHTML = `<div id="map" style="height:62vh;border-radius:14px;border:1px solid var(--line)"></div>` +
    (pts.length ? '' : '<div class="empty">אין דיווחים עם מיקום בסינון הנוכחי. מיקום נשמר רק בדיווחים חדשים, כשהמכשיר אישר גישה למיקום.</div>');
  try { await ensureLeaflet(); } catch (e) { if (tok === mapTok) $('#list').innerHTML = '<div class="err">טעינת המפה נכשלה. בדוק חיבור לאינטרנט ונסה שוב.</div>'; return; }
  if (tok !== mapTok || !$('#map')) return;
  mapObj = L.map('map').setView([31.5, 34.9], 8);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapObj);
  const bounds = [];
  pts.forEach(({ r, g }) => {
    L.marker([g.latitude, g.longitude]).addTo(mapObj).bindPopup(`<div dir="rtl"><b>${esc(r.project || 'דיווח')}</b><br>${esc(r.contractor_name || '')} · ${esc(r.date || '')}<br>
      <button data-open="${esc(r.report_id)}" style="margin-top:6px">פתיחת דיווח</button> <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${g.latitude},${g.longitude}">Google Maps</a></div>`);
    bounds.push([g.latitude, g.longitude]);
  });
  if (bounds.length) mapObj.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 });
  mapObj.on('popupopen', e => { const b = e.popup.getElement().querySelector('[data-open]'); if (b) b.onclick = () => openDetail(b.dataset.open); });
}

function csv(rows) {
  const cell = c => {
    c = String(c ?? '');
    if (/^[=+@]/.test(c) || /^-(?![\d.])/.test(c)) c = "'" + c;
    return /[",\n\r]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
  };
  return '\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n');
}
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
const joinV = v => Array.isArray(v) ? v.join(', ') : v;

function exportSummary() {
  const head = ['מזהה דיווח', 'תאריך', 'קבלן', 'פרויקט', 'עיר', 'כתובת', 'חברה', 'קו רוחב', 'קו אורך', 'דיוק (מטר)', 'קישור למפה', 'מספר תמונות', 'פרטי העבודה', 'קישורי תמונות'];
  const body = filtered().map(r => { const g = gpsOf(r), ph = photosOf(r); return [r.report_id, r.date, r.contractor_name, r.project, r.city, r.address, r.company,
    g ? g.latitude : '', g ? g.longitude : '', g && g.accuracy != null ? Math.round(g.accuracy) : '', g ? `https://www.google.com/maps?q=${g.latitude},${g.longitude}` : '',
    ph.length, linesOf(r).map(([k, v]) => k + ': ' + joinV(v)).join(' | '), ph.map(p => p.url).join('\n')]; });
  download(`דיווחים-${today()}.csv`, csv([head, ...body]));
}

function exportLong() {
  const head = ['מזהה דיווח', 'תאריך', 'קבלן', 'פרויקט', 'עיר', 'כתובת', 'שדה', 'ערך'];
  const body = [];
  filtered().forEach(r => { const ls = linesOf(r); (ls.length ? ls : [['', '']]).forEach(([k, v]) => body.push([r.report_id, r.date, r.contractor_name, r.project, r.city, r.address, k, joinV(v)])); });
  download(`פרטי-עבודות-${today()}.csv`, csv([head, ...body]));
}

const photoUrl = (id, name) => `${SB}/storage/v1/object/public/${BUCKET}/${encodeURIComponent(id)}/${encodeURIComponent(name)}`;

async function listPhotos(id) {
  try {
    const r = await api(`${SB}/storage/v1/object/list/${BUCKET}`, { method: 'POST', body: JSON.stringify({ prefix: id, limit: 200, sortBy: { column: 'name', order: 'asc' } }) });
    if (!r.ok) return [];
    return (await r.json()).filter(f => f.name && /\.(jpe?g|png|webp)$/i.test(f.name)).map(f => f.name);
  } catch (e) { return []; }
}

function fmt(k, v) {
  if (v && typeof v === 'object') return `<pre style="margin:0;white-space:pre-wrap">${esc(JSON.stringify(v, null, 1))}</pre>`;
  if (k === 'created_at' && v) { const d = new Date(v); if (!isNaN(d)) return esc(d.toLocaleString('he-IL')); }
  return esc(v ?? '—');
}

async function openDetail(id) {
  const r = reports.find(x => x.report_id === id); if (!r) return;
  const keys = Object.keys(r).filter(k => !['id', 'photos', 'details'].includes(k)).sort((a, b) => (a in LABELS ? Object.keys(LABELS).indexOf(a) : 99) - (b in LABELS ? Object.keys(LABELS).indexOf(b) : 99));
  const lines = linesOf(r);
  const gps = gpsOf(r);
  const mapUrl = gps ? `https://www.google.com/maps?q=${gps.latitude},${gps.longitude}` : '';
  const linesHtml = lines.length ? `<div class="sub">פרטי העבודה</div><div class="kv">${lines.map(([k, v]) => `<div>${esc(k)}</div><div>${esc(Array.isArray(v) ? v.join(', ') : v)}</div>`).join('')}</div>` : '';
  $('#detail').innerHTML = `<h3>${esc(r.project || 'דיווח')}</h3>
    <div class="kv">${keys.map(k => `<div>${esc(LABELS[k] || k)}</div><div>${fmt(k, r[k])}</div>`).join('')}${gps ? `<div>מיקום</div><div><a href="${mapUrl}" target="_blank" rel="noopener">פתיחה במפה</a></div>` : ''}</div>
    ${linesHtml}
    <div id="ph" class="msg">טוען תמונות…</div>
    <div class="actions"><button class="btn pri" id="pr">הורדת PDF / הדפסה</button><button class="btn bad" id="del">מחיקה</button><button class="btn" id="cl">סגירה</button></div>`;
  $('#modal').classList.add('open');
  $('#cl').onclick = () => $('#modal').classList.remove('open');

  let items = (Array.isArray(parseJ(r.photos)) ? parseJ(r.photos) : []).filter(x => x && x.url).map(x => ({ cat: x.category || '', url: x.url }));
  const names = await listPhotos(id);
  if (!items.length) items = names.map(n => ({ cat: '', url: photoUrl(id, n) }));
  const groups = new Map(); items.forEach(i => { if (!groups.has(i.cat)) groups.set(i.cat, []); groups.get(i.cat).push(i); });
  $('#ph').className = '';
  $('#ph').innerHTML = items.length ? [...groups].map(([cat, arr]) => `${cat ? `<div class="sub">${esc(cat)}</div>` : ''}<div class="photos">${arr.map(i => `<img loading="lazy" src="${esc(i.url)}" onclick="window.open(this.src)">`).join('')}</div>`).join('') : '<div class="msg">אין תמונות לדיווח זה</div>';

  $('#pr').onclick = () => {
    $('#sheet').innerHTML = `<div class="p first"><h2>${esc(r.project || 'דיווח')}</h2>${keys.map(k => `<p><b>${esc(LABELS[k] || k)}:</b> ${fmt(k, r[k])}</p>`).join('')}` +
      (lines.length ? `<h3>פרטי העבודה</h3>${lines.map(([k, v]) => `<p><b>${esc(k)}:</b> ${esc(Array.isArray(v) ? v.join(', ') : v)}</p>`).join('')}` : '') + `</div>` +
      items.map(i => `<div class="p"><div style="text-align:center">${i.cat ? `<h3>${esc(i.cat)}</h3>` : ''}<img src="${esc(i.url)}"></div></div>`).join('');
    setTimeout(() => window.print(), 300);
  };
  $('#del').onclick = async () => {
    if (!confirm('למחוק את הדיווח ואת התמונות שלו? אי אפשר לשחזר.')) return;
    const d = await api(`${SB}/rest/v1/reports?report_id=eq.${encodeURIComponent(id)}`, { method: 'DELETE', headers: { Prefer: 'return=representation' } });
    const gone = d.ok ? await d.json() : [];
    if (!d.ok || !gone.length) { alert('המחיקה נכשלה – ייתכן שחסרה הרשאת מחיקה (ראה SQL בהודעת השגיאה).'); return; }
    if (names.length) await api(`${SB}/storage/v1/object/${BUCKET}`, { method: 'DELETE', body: JSON.stringify({ prefixes: names.map(n => `${id}/${n}`) }) }).catch(() => {});
    reports = reports.filter(x => x.report_id !== id);
    $('#modal').classList.remove('open'); renderShell();
  };
}
$('#modal').onclick = e => { if (e.target.id === 'modal') e.target.classList.remove('open'); };

function start() {
  const hp = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (hp.get('type') === 'recovery' && hp.get('access_token')) { renderReset(hp.get('access_token')); return; }
  if (hp.get('error_description')) { history.replaceState(null, '', location.pathname + location.search); renderLogin(hp.get('error_description')); return; }
  session ? load() : renderLogin();
}
start();
</script>
