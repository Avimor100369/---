<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Executive Control Portal – ניהול ובקרת שטח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg: #f1f5f9;
  --bg-subtle: #e2e8f0;
  --card: #ffffff;
  --card-alt: #f8fafc;
  --tx: #0f172a;
  --tx-sec: #334155;
  --mut: #64748b;
  --line: #e2e8f0;
  --pri: #0f4c81;
  --pri-hover: #0a365c;
  --pri-light: #e0f2fe;
  --pri-tx: #ffffff;
  --acc: #0284c7;
  --bad: #e11d48;
  --bad-bg: #ffe4e6;
  --ok: #059669;
  --ok-bg: #d1fae5;
  --warn: #d97706;
  --warn-bg: #fef3c7;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
  --shadow-md: 0 4px 14px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.16), 0 8px 10px -6px rgba(15, 23, 42, 0.1);
  --radius: 16px;
}

:root[data-theme=dark] {
  --bg: #090e1a;
  --bg-subtle: #111827;
  --card: #162032;
  --card-alt: #0f172a;
  --tx: #f8fafc;
  --tx-sec: #cbd5e1;
  --mut: #94a3b8;
  --line: #283548;
  --pri: #38bdf8;
  --pri-hover: #7dd3fc;
  --pri-light: rgba(56, 189, 248, 0.14);
  --pri-tx: #090e1a;
  --acc: #38bdf8;
  --bad: #fb7185;
  --bad-bg: rgba(251, 113, 133, 0.14);
  --ok: #34d399;
  --ok-bg: rgba(52, 211, 153, 0.14);
  --warn: #fbbf24;
  --warn-bg: rgba(251, 191, 36, 0.14);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 20px 25px rgba(0, 0, 0, 0.65);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #090e1a;
    --bg-subtle: #111827;
    --card: #162032;
    --card-alt: #0f172a;
    --tx: #f8fafc;
    --tx-sec: #cbd5e1;
    --mut: #94a3b8;
    --line: #283548;
    --pri: #38bdf8;
    --pri-hover: #7dd3fc;
    --pri-light: rgba(56, 189, 248, 0.14);
    --pri-tx: #090e1a;
    --acc: #38bdf8;
    --bad: #fb7185;
    --bad-bg: rgba(251, 113, 133, 0.14);
    --ok: #34d399;
    --ok-bg: rgba(52, 211, 153, 0.14);
    --warn: #fbbf24;
    --warn-bg: rgba(251, 191, 36, 0.14);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 20px 25px rgba(0, 0, 0, 0.65);
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: 'Heebo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Top Executive Bar */
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 28px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 30;
  box-shadow: var(--shadow-sm);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
}
.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--pri), var(--acc));
  color: var(--pri-tx);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 20px;
  box-shadow: 0 4px 10px rgba(15, 76, 129, 0.3);
}
header h1 {
  font-size: 20px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.live-pill {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--ok-bg);
  color: var(--ok);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ok);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

header h1 small {
  display: block;
  font-size: 12px;
  font-weight: 400;
  color: var(--mut);
}
.user-badge {
  font-size: 12px;
  color: var(--mut);
  background: var(--card-alt);
  border: 1px solid var(--line);
  padding: 6px 12px;
  border-radius: 99px;
  direction: ltr;
}
@media (max-width: 760px) { .user-badge { display: none; } header { padding: 12px 16px; } }

button, input, select { font: inherit; }

.btn {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--tx);
  border-radius: 10px;
  padding: 8px 15px;
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.16s ease;
  box-shadow: var(--shadow-sm);
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--card-alt); border-color: var(--mut); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.pri { background: var(--pri); color: var(--pri-tx); border-color: var(--pri); }
.btn.pri:hover:not(:disabled) { background: var(--pri-hover); border-color: var(--pri-hover); }
.btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.ok:hover:not(:disabled) { opacity: 0.92; }
.btn.bad { color: var(--bad); border-color: var(--bad-bg); background: var(--bad-bg); }
.btn.bad:hover:not(:disabled) { background: var(--bad); color: #fff; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }

main { max-width: 1220px; margin: 0 auto; padding: 24px 20px 48px; }

/* Executive KPI Cards */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
  margin-bottom: 22px;
}
.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 22px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat::after {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 5px;
  background: var(--pri);
}
.stat.s-ok::after { background: var(--ok); }
.stat.s-acc::after { background: var(--acc); }
.stat.s-warn::after { background: var(--warn); }
.stat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.stat b { font-size: 30px; font-weight: 800; line-height: 1.1; color: var(--tx); }
.stat-ico { font-size: 20px; opacity: 0.85; }
.stat span { color: var(--mut); font-size: 13px; font-weight: 600; }
.stat small { color: var(--acc); font-size: 11.5px; margin-top: 4px; font-weight: 500; }

/* Control Panel (Search & Multi-Filters) */
.controls-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}
.search-wrap { position: relative; margin-bottom: 14px; }
.search {
  width: 100%;
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card-alt);
  color: var(--tx);
  font-size: 15px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-light); background: var(--card); }

.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.filters select, .filters input {
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card-alt);
  color: var(--tx);
  font-size: 13.5px;
  font-weight: 500;
}
.filters label {
  font-size: 13px;
  color: var(--mut);
  font-weight: 600;
  display: flex;
  gap: 6px;
  align-items: center;
  background: var(--card-alt);
  padding: 4px 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
}
.filters label input { border: none; background: transparent; padding: 4px; }
.quick-dates { display: flex; gap: 6px; margin-right: auto; }
@media (max-width: 820px) { .quick-dates { margin-right: 0; } }

/* Action Bar & View Tabs */
.bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
  align-items: center;
}
.bar .spacer { flex: 1; }
.tabs {
  display: inline-flex;
  background: var(--card);
  padding: 5px;
  border-radius: 12px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  flex-wrap: wrap;
}
.tabs .btn { border: none; box-shadow: none; background: transparent; padding: 7px 14px; border-radius: 8px; }
.tabs .btn.pri { background: var(--pri); color: var(--pri-tx); }

/* Report List Rows */
.row {
  display: grid;
  grid-template-columns: 115px 1.2fr 1.6fr auto;
  gap: 14px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 10px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.18s ease;
}
.row:hover {
  border-color: var(--pri);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
@media (max-width: 760px) {
  .row { grid-template-columns: 1fr 1fr; gap: 10px; }
  .row .meta-end { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
}
.row small { color: var(--mut); display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.2px; margin-bottom: 2px; }
.row .val { font-weight: 700; font-size: 15px; color: var(--tx); }
.row .meta-end { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.row .id-row {
  grid-column: 1 / -1;
  padding-top: 10px;
  margin-top: 2px;
  border-top: 1px dashed var(--line);
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  font-size: 12.5px;
  color: var(--mut);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
}
.badge.co { background: var(--pri-light); color: var(--pri); }
.badge.gps { background: var(--ok-bg); color: var(--ok); }
header { -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px); }
.stat { transition: transform .18s ease, box-shadow .18s ease; }
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(2, 132, 199, .35); outline-offset: 2px; }
.role-pill { display: inline-block; margin-inline-start: 6px; padding: 1px 8px; border-radius: 999px; background: var(--pri-light); color: var(--pri); font-size: 11px; font-weight: 800; }
::selection { background: var(--pri-light); color: var(--pri); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.appr { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.appr-b { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--line, #e2e8f0); color: var(--mut, #64748b); }
.appr-b.ok { background: var(--ok-bg, #dcfce7); color: var(--ok, #16a34a); }
.appr-b.bad { background: #fee2e2; color: #dc2626; }
.appr-btn { font: inherit; font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 8px; border: 1px solid var(--line, #e2e8f0); background: var(--card, #fff); color: var(--tx, #0f172a); cursor: pointer; }
.appr-btn.ok { color: var(--ok, #16a34a); border-color: var(--ok, #16a34a); }
.appr-btn.bad { color: #dc2626; border-color: #dc2626; }
.appr-btn:hover { background: var(--pri-light, #e0f2fe); }
.appr-note { flex-basis: 100%; font-size: 12px; color: var(--mut, #64748b); }
.row > .appr { grid-column: 1 / -1; margin-top: 2px; padding-top: 10px; border-top: 1px dashed var(--line, #e2e8f0); align-items: center; }
.row .appr-note { flex-basis: auto; margin-inline-start: 4px; font-size: 13px; }
.v-done { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: var(--ok, #16a34a); color: #fff; font-size: 13px; font-weight: 900; line-height: 1; flex: none; }
.nc-chip { direction: ltr; unicode-bidi: embed; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; color: var(--ok); background: var(--ok-bg); padding: 2px 8px; border-radius: 6px; }
.nc-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.nc-actions a, .nc-actions button { font: inherit; font-size: 15px; font-weight: 700; padding: 11px 20px; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--tx); cursor: pointer; text-decoration: none; flex: 1 1 140px; box-shadow: var(--shadow-sm, 0 1px 2px rgba(15,23,42,.06)); }
.nc-actions a:hover, .nc-actions button:hover { background: var(--pri-light); }
.badge.ph-cnt { background: var(--card-alt); border: 1px solid var(--line); color: var(--tx-sec); }
.badge.lines-cnt { background: var(--warn-bg); color: var(--warn); }

/* Summary / Executive Analytics View */
.analytics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 18px;
}
.ana-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}
.ana-card h3 {
  margin: 0 0 14px;
  font-size: 16px;
  font-weight: 800;
  color: var(--pri);
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
}
.ana-row {
  margin-bottom: 12px;
}
.ana-row-top {
  display: flex;
  justify-content: space-between;
  font-size: 13.5px;
  font-weight: 600;
  margin-bottom: 4px;
}
.ana-bar-bg {
  height: 8px;
  background: var(--card-alt);
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.ana-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--pri), var(--acc));
  border-radius: 99px;
}

.empty, .msg { text-align: center; color: var(--mut); padding: 44px 16px; font-size: 15px; font-weight: 500; }
.err { background: var(--bad-bg); border: 1px solid var(--bad); color: var(--bad); border-radius: 12px; padding: 14px 18px; margin-bottom: 14px; white-space: pre-wrap; line-height: 1.5; font-weight: 600; }
.err.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.link { background: none; border: 0; color: var(--pri); cursor: pointer; padding: 8px 0; text-decoration: underline; font-weight: 600; }

/* Login */
.login {
  max-width: 420px;
  margin: 10vh auto;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 36px 32px;
  box-shadow: var(--shadow-lg);
}
.login h2 { margin: 0 0 6px; font-size: 25px; font-weight: 800; }
.login p { margin: 0 0 22px; color: var(--mut); font-size: 14px; }
.login input {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card-alt);
  color: var(--tx);
}

/* Modal & Structured Report Detail Sheet */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(5px);
  display: none;
  z-index: 50;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px 12px;
}
.modal.open { display: block; animation: fadeIn 0.18s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.sheet {
  background: var(--card);
  max-width: 960px;
  margin: 10px auto 30px;
  border-radius: 20px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  overflow-y: auto;
  max-height: 92vh;
  -webkit-overflow-scrolling: touch;
}

.sheet-header {
  background: linear-gradient(135deg, var(--pri), var(--pri-hover));
  color: var(--pri-tx);
  padding: 24px 28px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
.sheet-header h3 { margin: 0 0 4px; font-size: 23px; font-weight: 800; }
.sheet-header .sub-id { font-size: 13px; opacity: 0.9; direction: ltr; display: inline-block; font-family: monospace; }
.sheet-close {
  background: rgba(255,255,255,0.2);
  border: none;
  color: inherit;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sheet-close:hover { background: rgba(255,255,255,0.35); }

.sheet-body { padding: 24px 28px; }

.detail-section {
  background: var(--card-alt);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 20px;
}
.section-title {
  font-size: 15.5px;
  font-weight: 800;
  color: var(--pri);
  margin: 0 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.meta-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
  gap: 12px;
}
.meta-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
}
.meta-box .lbl { font-size: 11px; font-weight: 700; color: var(--mut); margin-bottom: 2px; }
.meta-box .val { font-size: 14px; font-weight: 700; color: var(--tx); word-break: break-word; }

.work-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.work-table th {
  background: var(--pri-light);
  color: var(--pri);
  text-align: right;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 800;
}
.work-table td {
  padding: 10px 14px;
  border-top: 1px solid var(--line);
  font-size: 14px;
  vertical-align: top;
}
.work-table tr:nth-child(even) td { background: var(--card-alt); }
.work-table td:first-child { font-weight: 700; color: var(--tx-sec); width: 38%; }

/* Photo Gallery & Lightbox */
.gallery-cat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 16px 0 10px;
  padding: 8px 14px;
  background: var(--card);
  border-right: 4px solid var(--pri);
  border-radius: 8px;
  font-weight: 800;
  font-size: 14px;
}
.photos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 12px;
}
.photo-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: transform 0.16s, box-shadow 0.16s;
}
.photo-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--pri); }
.photo-card img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  display: block;
  cursor: zoom-in;
  background: var(--bg-subtle);
}
.photo-actions {
  display: flex;
  gap: 4px;

const UNIT_WORD = '(גוב|גובים|עמוד|עמודים|manhole|pole)';
const UNIT_NUM_RE = new RegExp("((מס['׳]?|מספר|num|no\\.?|#)\\s*" + UNIT_WORD + ")|(" + UNIT_WORD + "\\s*(מס['׳]?|מספר|num|no\\.?|#))", 'i');
const UNIT_EXACT_RE = new RegExp('^\\s*' + UNIT_WORD + '\\s*$', 'i');
const unitKeyOk = k => UNIT_NUM_RE.test(k) || UNIT_EXACT_RE.test(k);
function unitOf(r, p) {
  const found = [];
  const add = (key, val) => {
    if (val == null || typeof val === 'object') return;
    const v = String(val).trim();
    if (!v || v === '—') return;
    const kind = /עמוד|pole/i.test(key) ? 'עמוד' : 'גוב';
    if (!found.some(f => f.kind === kind)) found.push({ kind, num: v });
  };
  if (p) for (const k of Object.keys(p)) if (k !== 'url' && k !== 'category' && unitKeyOk(k)) add(k, p[k]);
  const dt = parseJ(r.details);
  if (dt && typeof dt === 'object') for (const k of Object.keys(dt)) if (k !== 'lines' && k !== 'gps' && unitKeyOk(k)) add(k, dt[k]);
  for (const k of Object.keys(r)) if (!['details', 'photos'].includes(k) && unitKeyOk(k)) add(k, r[k]);
  if (r.unit_number) add(r.unit_kind || 'גוב', r.unit_number);
  for (const [k, v] of linesOf(r)) if (UNIT_NUM_RE.test(String(k))) add(String(k), joinV(v));
  return found.length ? { text: found.map(f => `${f.kind} ${f.num}`).join(' · ') } : null;
}
function photoName(r, p) {
  const base = (p && p.category) || 'תיעוד כללי';
  const u = unitOf(r, p);
  return u ? `${base} · ${u.text}` : base;
}
function linesOf(r) { const dt = parseJ(r.details); return dt && Array.isArray(dt.lines) ? dt.lines.filter(Array.isArray) : []; }
function photosOf(r) { const p = parseJ(r.photos); return Array.isArray(p) ? p.filter(x => x && x.url) : []; }

}

        const file = new File([blob], 'report-photo.jpg', { type: blob.type || 'image/jpeg' });

          await navigator.share({ title, files: [file] });

      } catch (e) {}
      await navigator.share({ title, url });

function copyPhotoLink(url) {
  navigator.clipboard.writeText(url).then(() => showToast('הקישור לתמונה הועתק! ניתן להדביק בוואטסאפ או במייל')).catch(() => {
    prompt('העתק את הקישור לתמונה:', url);
  });
}

async function downloadPhoto(url, filename = 'photo.jpg') {
  try {
    const r = await fetch(url);
    const b = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  } catch (e) {
    window.open(url, '_blank');
  }
}

$('#lb-share').onclick = () => sharePhoto(currentLbUrl, currentLbTitle);
$('#lb-copy').onclick = () => copyPhotoLink(currentLbUrl);
$('#lb-dl').onclick = () => downloadPhoto(currentLbUrl, `${currentLbTitle.replace(/\s+/g, '_')}.jpg`);

/* Download All Filtered Photos as Structured ZIP Folders */
async function downloadFilteredZip(rows) {
  if (typeof JSZip === 'undefined') {
    showToast('ספריית ה-ZIP עדיין נטענת, נסה שוב בעוד רגע');
    return;
  }
  const items = [];
  rows.forEach(r => {
    photosOf(r).forEach((p, idx) => {
      items.push({
        url: p.url,
        company: (r.company || 'ללא_חברה').replace(/[\\/:*?"<>|]/g, '_'),
        project: (r.project || 'ללא_פרויקט').replace(/[\\/:*?"<>|]/g, '_'),
        category: (p.category || 'כללי').replace(/[\\/:*?"<>|]/g, '_'),
        label: photoName(r, p).replace(/[\\/:*?"<>|]/g, '_').replace(/\s*·\s*/g, '_').replace(/\s+/g, '_'),
        date: r.date || 'ללא_תאריך',
        report_id: r.report_id,
        idx: idx + 1
      });
    });
  });

  if (!items.length) {
    showToast('אין תמונות להורדה בסינון הנוכחי');
    return;
  }

  const btn = $('#zip-btn');
  if (btn) { btn.disabled = true; btn.textContent = `⏳ אורז ${items.length} תמונות...`; }
  showToast(`מתחיל הורדה ואריזה של ${items.length} תמונות לתיקיות...`);

  try {
    const zip = new JSZip();
    let okCount = 0;
    for (const item of items) {
      try {
        const res = await fetch(item.url);
        if (!res.ok) continue;
        const blob = await res.blob();
        const ext = (blob.type && blob.type.includes('png')) ? 'png' : 'jpg';
        const folderPath = `${item.company}/${item.project}/${item.category}`;
        const fileName = `${item.label}_${item.date}_${item.report_id}_${item.idx}.${ext}`;
        zip.folder(folderPath).file(fileName, blob);
        okCount++;
      } catch (e) {}
    }

    if (!okCount) {
      showToast('לא ניתן היה להוריד את התמונות מהשרת');
      return;
    }

    const content = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(content);
    a.download = `תיעוד-תמונות-מסודר-${today()}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    showToast(`ירד בהצלחה! ${okCount} תמונות מסודרות בתיקיות`);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📦 הורדת תמונות כתיקיות (ZIP)'; }
  }
}

function setQuickDate(days) {
  const end = new Date();
  const start = new Date();
  start.setDate(end.getDate() - days);
  fFrom = start.toISOString().slice(0, 10);
  fTo = end.toISOString().slice(0, 10);
  $('#ff').value = fFrom;
  $('#ft').value = fTo;
  refresh();
}

function refresh() {
  const rows = filtered();
  const contractors = new Set(rows.map(r => r.contractor_name).filter(Boolean)).size;
  const projectsCount = new Set(rows.map(r => r.project).filter(Boolean)).size;
  const totalPhotos = rows.reduce((acc, r) => acc + photosOf(r).length, 0);
  const gpsCount = rows.filter(gpsOf).length;
  const gpsPct = rows.length ? Math.round((gpsCount / rows.length) * 100) : 0;

  $('#stats').innerHTML = `
    <div class="stat">
      <div class="stat-top"><b>${rows.length}</b><span class="stat-ico">📑</span></div>
      <span>סה״כ דיווחים</span>
      <small>${rows.length !== reports.length ? 'מסונן מתוך ' + reports.length + ' דיווחים' : 'כלל הדיווחים במערכת'}</small>
    </div>
    <div class="stat s-acc">
      <div class="stat-top"><b>${projectsCount}</b><span class="stat-ico">🏗️</span></div>
      <span>פרויקטים ואתרים</span>
      <small>${contractors} קבלנים פעילים</small>
    </div>
    <div class="stat s-warn">
      <div class="stat-top"><b>${totalPhotos}</b><span class="stat-ico">📷</span></div>
      <span>תמונות מתועדות</span>
      <small>ממוצע ${(rows.length ? (totalPhotos / rows.length).toFixed(1) : 0)} תמונות לדיווח</small>
    </div>
    <div class="stat s-ok">
      <div class="stat-top"><b>${gpsCount}</b><span class="stat-ico">📍</span></div>
      <span>מאומתים ב-GPS</span>
      <small>${gpsPct}% כיסוי מיקום מאומת</small>
    </div>`;

  $('#tl').classList.toggle('pri', view === 'list');
  $('#tg').classList.toggle('pri', view === 'gallery');
  $('#tm').classList.toggle('pri', view === 'map');
  $('#ta').classList.toggle('pri', view === 'analytics');
  if ($('#tu')) $('#tu').classList.toggle('pri', view === 'users');

  if (view !== 'map') {
    mapTok++;
    if (mapObj) { mapObj.remove(); mapObj = null; }
  }

  if (view === 'map') renderMap(rows);
  else if (view === 'users' && userRole === 'admin') renderUsers();
  else if (view === 'gallery') renderGalleryHub(rows);
  else if (view === 'analytics') renderAnalytics(rows);
  else renderList(rows);
}

/* Smart Logical Sort Gallery Hub (Company -> Project / Category / Flat) */
function renderGalleryHub(rows) {
  const allItems = [];
  rows.forEach(r => {
    const phs = photosOf(r);
    phs.forEach(p => {
      allItems.push({
        url: p.url,
        category: p.category || 'תיעוד כללי',
        label: photoName(r, p),
        company: r.company || 'ללא שיוך חברה',
        project: r.project || 'ללא שם פרויקט',
        contractor: r.contractor_name || '',
        date: r.date || '',
        report_id: r.report_id
      });
    });
  });

  if (!allItems.length) {
    $('#list').innerHTML = '<div class="empty">אין תמונות להצגה בסינון הנוכחי</div>';
    return;
  }

  let contentHtml = '';

  if (galleryGroupBy === 'company_project') {
    // Hierarchical Logical Sort: Company -> Project
    const tree = new Map();
    allItems.forEach(item => {
      if (!tree.has(item.company)) tree.set(item.company, new Map());
      const projMap = tree.get(item.company);
      if (!projMap.has(item.project)) projMap.set(item.project, []);
      projMap.get(item.project).push(item);
    });

    contentHtml = [...tree].map(([compName, projMap]) => {
      const compTotal = [...projMap.values()].reduce((s, a) => s + a.length, 0);
      return `
        <div class="hub-group">
          <div class="hub-group-title">
            <span>🏢 ${esc(compName)}</span>
            <span class="badge co">${projMap.size} פרויקטים · ${compTotal} תמונות</span>
          </div>
          ${[...projMap].map(([projName, items]) => `
            <div class="hub-sub-title">
              <span>📁 ${esc(projName)}</span>
              <span>${items.length} תמונות</span>
            </div>
            <div class="photos-grid">
              ${items.map(i => renderHubPhotoCard(i)).join('')}
            </div>
          `).join('')}
        </div>
      `;
    }).join('');
  } else {
    const groups = new Map();
    allItems.forEach(item => {
      const key = galleryGroupBy === 'company' ? item.company : (galleryGroupBy === 'category' ? item.category : item.project);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(item);
    });

    contentHtml = [...groups].map(([grpName, items]) => `
      <div class="hub-group">
        <div class="hub-group-title">
          <span>${esc(grpName)}</span>
          <span class="badge ph-cnt">${items.length} תמונות</span>
        </div>
        <div class="photos-grid">
          ${items.map(i => renderHubPhotoCard(i)).join('')}
        </div>
      </div>
    `).join('');
  }

  $('#list').innerHTML = `
    <div class="gallery-hub-controls">
      <span style="font-weight:800;font-size:14px">מיון לוגי חכם לפי:</span>
      <select id="gb-sel" style="padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card-alt);color:var(--tx);font-weight:600">
        <option value="company_project"${galleryGroupBy === 'company_project' ? ' selected' : ''}>🏢 חברה ⬅ 📁 פרויקט (היררכי)</option>
        <option value="company"${galleryGroupBy === 'company' ? ' selected' : ''}>🏢 חברה / לקוח</option>
        <option value="project"${galleryGroupBy === 'project' ? ' selected' : ''}>📁 פרויקט / אתר</option>
        <option value="category"${galleryGroupBy === 'category' ? ' selected' : ''}>🏷️ קטגוריית תמונה</option>
      </select>
      <span style="color:var(--mut);font-size:13px;font-weight:600">סה״כ ${allItems.length} תמונות</span>
      <div style="margin-right:auto">
        <button class="btn pri sm" id="zip-btn">📦 הורדת תמונות כתיקיות (ZIP)</button>
      </div>
    </div>
    ${contentHtml}
  `;

  $('#gb-sel').onchange = e => { galleryGroupBy = e.target.value; renderGalleryHub(rows); };
  $('#zip-btn').onclick = () => downloadFilteredZip(rows);
}

function renderHubPhotoCard(i) {
  const safeTitle = `${i.company} | ${i.project} - ${i.label || i.category}`;
  return `
    <div class="photo-card">
      <img loading="lazy" src="${esc(i.url)}" onclick="openLightbox('${esc(i.url)}', '${esc(safeTitle)}')">
      <div class="hub-photo-meta" title="${esc(safeTitle)} | ${esc(i.contractor)} (${esc(i.date)})">
        <b>${esc(i.label || i.category)}</b> · ${esc(i.date)}
      </div>
      <div class="photo-actions">
        <button onclick="openLightbox('${esc(i.url)}', '${esc(safeTitle)}')" title="הגדל">🔍 הצג</button>
        <button onclick="sharePhoto('${esc(i.url)}', '${esc(safeTitle)}')" title="שתף">📤 שלח</button>
        <button onclick="openDetail('${esc(i.report_id)}')" title="פתח דיווח">📄 דיווח</button>
      </div>
    </div>
  `;
}

/* Executive Summary & Analytics Tab */
function renderAnalytics(rows) {
  if (!rows.length) {
    $('#list').innerHTML = '<div class="empty">אין נתונים לניתוח בסינון הנוכחי</div>';
    return;
  }

  const countBy = fn => {
    const m = new Map();
    rows.forEach(r => {
      const k = fn(r) || 'לא צוין';
      m.set(k, (m.get(k) || 0) + 1);
    });
    return [...m.entries()].sort((a, b) => b[1] - a[1]);
  };

  const byCompany = countBy(r => r.company);
  const byContractor = countBy(r => r.contractor_name);
  const byProject = countBy(r => r.project).slice(0, 10);
  const byCity = countBy(r => r.city).slice(0, 10);

  const renderBars = (title, icon, arr) => {
    const max = arr.length ? arr[0][1] : 1;
    return `
      <div class="ana-card">
        <h3><span>${icon} ${title}</span><span style="font-size:12px;color:var(--mut)">${arr.length}</span></h3>
        ${arr.map(([lbl, cnt]) => `
          <div class="ana-row">
            <div class="ana-row-top">
              <span>${esc(lbl)}</span>
              <span>${cnt} דיווחים (${Math.round((cnt / rows.length) * 100)}%)</span>
            </div>
            <div class="ana-bar-bg"><div class="ana-bar-fill" style="width:${Math.max(4, Math.round((cnt / max) * 100))}%"></div></div>
          </div>
        `).join('')}
      </div>
    `;
  };

  $('#list').innerHTML = `
    <div class="analytics-grid">
      ${renderBars('התפלגות דיווחים לפי חברה', '🏢', byCompany)}
      ${renderBars('תפוקת דיווחים לפי קבלן', '👷', byContractor)}
      ${renderBars('פרויקטים מובילים (Top 10)', '📁', byProject)}
      ${renderBars('פריסה גיאוגרפית לפי ערים', '🏙️', byCity)}
    </div>
  `;
}

function ensureLeaflet() {
  if (window.L) return Promise.resolve();
  if (leafletP) return leafletP;
  leafletP = new Promise((res, rej) => {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(l);
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    s.onload = res; s.onerror = () => { leafletP = null; rej(new Error('leaflet')); }; document.head.appendChild(s);
  });
  return leafletP;
}

async function renderMap(rows) {
  const tok = ++mapTok;
  const pts = rows.map(r => ({ r, g: gpsOf(r) })).filter(x => x.g);
  if (mapObj) { mapObj.remove(); mapObj = null; }
  $('#list').innerHTML = `<div id="map" style="height:64vh;border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow-md)"></div>` +
    (pts.length ? '' : '<div class="empty">אין דיווחים עם מיקום GPS בסינון הנוכחי.</div>');
  try { await ensureLeaflet(); } catch (e) { if (tok === mapTok) $('#list').innerHTML = '<div class="err">טעינת המפה נכשלה. בדוק חיבור לאינטרנט ונסה שוב.</div>'; return; }
  if (tok !== mapTok || !$('#map')) return;
  mapObj = L.map('map').setView([31.5, 34.9], 8);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapObj);
  const bounds = [];
  pts.forEach(({ r, g }) => {
    L.marker([g.latitude, g.longitude]).addTo(mapObj).bindPopup(`<div dir="rtl" style="font-family:Heebo,sans-serif;min-width:190px">
      <b style="font-size:14px;color:#0f4c81">${esc(r.project || 'דיווח')}</b><br>
      <span style="font-size:12px;font-weight:700">${esc(r.company || '')}</span><br>
      <span style="color:#64748b;font-size:12px">${esc(r.contractor_name || '')} · ${esc(r.date || '')}</span><br>
      <span style="direction:ltr;unicode-bidi:embed;font-family:monospace;font-size:12px;color:#059669;font-weight:700">🧭 ${esc(ncText(g))}</span><br>
      <div style="margin-top:8px;display:flex;gap:6px">
        <button data-open="${esc(r.report_id)}" style="background:#0f4c81;color:#fff;border:none;padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:600">פתיחת דיווח</button>
        <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${g.latitude},${g.longitude}" style="padding:5px 9px;background:#f1f5f9;border-radius:6px;text-decoration:none;color:#0f172a;font-weight:600">ניווט ↗</a>
      </div>
    </div>`);
    bounds.push([g.latitude, g.longitude]);
  });
  if (bounds.length) mapObj.fitBounds(bounds, { padding: [35, 35], maxZoom: 16 });
  mapObj.on('popupopen', e => { const b = e.popup.getElement().querySelector('[data-open]'); if (b) b.onclick = () => openDetail(b.dataset.open); });
}

/* Executive Styled Multi-Sheet Excel (.xlsx) Export – one row per work item, no merged text */
const joinV = v => Array.isArray(v) ? v.join(', ') : (v ?? '');

const XB = c => ({ style: 'thin', color: { rgb: c } });
function styleWorksheet(ws, colWidths, opts = {}) {
  const { linkCols = [], groupCol = null, centerCols = [], ltrCols = [], coordCols = [], numCols = [] } = opts;
  ws['!views'] = [{ rightToLeft: true }];
  ws['!cols'] = colWidths.map(w => ({ wch: w }));
  if (!ws['!ref']) return;
  const range = XLSX.utils.decode_range(ws['!ref']);
  ws['!autofilter'] = { ref: ws['!ref'] };

  const headerStyle = {
    font: { name: 'Arial', sz: 11, bold: true, color: { rgb: 'FFFFFF' } },
    fill: { fgColor: { rgb: '0F4C81' } },
    alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
    border: { top: XB('0A365C'), bottom: { style: 'medium', color: { rgb: '0A365C' } }, left: XB('0A365C'), right: XB('0A365C') }
  };

  let group = 0, prevKey = null;
  for (let R = range.s.r; R <= range.e.r; ++R) {
    if (R > 0 && groupCol !== null) {
      const gc = ws[XLSX.utils.encode_cell({ r: R, c: groupCol })];
      const key = gc ? String(gc.v) : '';
      if (prevKey !== null && key !== prevKey) group++;
      prevKey = key;
    }
    for (let C = range.s.c; C <= range.e.c; ++C) {
      const addr = XLSX.utils.encode_cell({ r: R, c: C });
      let cell = ws[addr];
      if (!cell) { if (R === 0) continue; cell = ws[addr] = { t: 's', v: '' }; }
      if (R === 0) { cell.s = headerStyle; continue; }
      const band = (groupCol !== null ? group : R) % 2 === 0;
      const isLink = linkCols.includes(C) && typeof cell.v === 'string' && cell.v.startsWith('http');
      if (isLink) { cell.l = { Target: cell.v, Tooltip: 'לחץ לפתיחה' }; cell.v = 'פתח'; }
      if (coordCols.includes(C) && typeof cell.v === 'number') cell.z = '0.000000';
      const center = centerCols.includes(C) || numCols.includes(C) || isLink;
      cell.s = {
        font: { name: 'Arial', sz: 10, bold: numCols.includes(C), color: { rgb: isLink ? '0284C7' : '0F172A' }, underline: isLink },
        fill: { fgColor: { rgb: band ? 'F1F5F9' : 'FFFFFF' } },
        alignment: { horizontal: ltrCols.includes(C) || coordCols.includes(C) ? 'left' : (center ? 'center' : 'right'), vertical: 'center', wrapText: true },
        border: { top: XB('CBD5E1'), bottom: XB('CBD5E1'), left: XB('CBD5E1'), right: XB('CBD5E1') }
      };
    }
  }
  ws['!rows'] = [{ hpt: 30 }];
}

function exportExcelStyled() {
  const rows = filtered();
  if (!rows.length) { showToast('אין נתונים לייצוא בסינון הנוכחי'); return; }
  if (typeof XLSX === 'undefined') { showToast('ספריית האקסל עדיין נטענת, נסה שוב בעוד רגע'); return; }

  const workLines = r => linesOf(r).filter(([k]) => !UNIT_NUM_RE.test(String(k)));  // מס׳ גוב/עמוד מופיע בעמודה משלו
  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  const mapLink = g => g ? `https://www.google.com/maps?q=${g.latitude},${g.longitude}` : '';
  const scalar = v => (v && typeof v === 'object') ? (Array.isArray(v) ? v.join(', ') : JSON.stringify(v)) : (v ?? '');

  // כל שדות המידע הנוספים של הדיווח (מעבר לשדות הבסיס) – נאספים אוטומטית
  const baseKeys = ['report_id', 'date', 'company', 'contractor_name', 'project', 'city', 'address'];
  const skip = new Set(['id', 'photos', 'details', 'created_at', 'updated_at', 'exported_at', 'approval_status', 'approval_note', 'approved_by', 'approved_at', 'lat', 'lon', 'unit_kind', 'unit_number', ...baseKeys]);
  const extraKeys = [];
  const isPhotoKey = k => /תמונ|photo|image|img|pic/i.test(k);
  const addExtra = k => { if (!isPhotoKey(k) && !extraKeys.includes(k) && !unitKeyOk(k.replace(/^details\./,''))) extraKeys.push(k); };
  rows.forEach(r => {
    Object.keys(r).forEach(k => { if (!skip.has(k) && r[k] != null && r[k] !== '') addExtra(k); });
    const dt = parseJ(r.details);
    if (dt && typeof dt === 'object') Object.keys(dt).forEach(k => { if (k !== 'lines' && k !== 'gps' && dt[k] != null && dt[k] !== '') addExtra('details.' + k); });
  });
  const extraVal = (r, k) => {
    if (k.startsWith('details.')) { const dt = parseJ(r.details); return scalar(dt && dt[k.slice(8)]); }
    return scalar(r[k]);
  };
  const extraLabel = k => LABELS[k] || k.replace(/^details\./, '');
  const fmtCreated = v => { if (!v) return ''; const d = new Date(v); return isNaN(d) ? String(v) : d.toLocaleString('he-IL'); };

  const unitOfRow = r => { const u = unitOf(r, null); return u ? u.text : ''; };
  const locHead = ['נ.צ', 'קו רוחב (Lat)', 'קו אורך (Lon)', 'ניווט'];
  const locCells = r => { const g = gpsOf(r); return [g ? ncText(g) : 'ללא מיקום', g ? +(+g.latitude).toFixed(6) : '', g ? +(+g.longitude).toFixed(6) : '', mapLink(g)]; };

  // שדות שהם בעצם עמודות רגילות (תאריך / פרויקט / עיר / כתובת) – לא נספרים כסעיף עבודה ולא מוכפלים
  const canonOf = name => {
    const t = String(name).replace(/[:׳']/g, '').trim();
    if (/^(תאריך|תאריך ביצוע)$/.test(t)) return 'date';
    if (/^(שם פרויקט|פרויקט|פרויקט \/ אתר|שם האתר|אתר)$/.test(t)) return 'project';
    if (/^(עיר|ישוב|יישוב|שם עיר)$/.test(t)) return 'city';
    if (/^(כתובת|כתובת מדויקת)$/.test(t)) return 'address';
    return null;
  };

  // איסוף שדות הדיווח לפי סדר הטופס: כל שדה = עמודה; אם אותו שדה חוזר באותו דיווח – עמודה נוספת (כבל, כבל (2)…)
  const totals = new Map(), itemNames = [], maxOcc = new Map();
  const perReport = rows.map(r => {
    const m = new Map(), cnt = new Map();
    const top = { date: r.date || '', project: r.project || '', city: r.city || '', address: r.address || '' };
    workLines(r).forEach(([k, v]) => {
      const name = String(k || '—'), val = joinV(v), n = Number(val), isNum = val !== '' && !isNaN(n);
      const cn = canonOf(name);
      if (cn) { if (!top[cn] && val !== '') top[cn] = val; return; }
      const c = (cnt.get(name) || 0) + 1; cnt.set(name, c);
      if (!itemNames.includes(name)) itemNames.push(name);
      maxOcc.set(name, Math.max(maxOcc.get(name) || 0, c));
      m.set(name + '\u0000' + c, isNum ? n : val);
      const t = totals.get(name) || { count: 0, sum: 0, hasNum: false, reports: new Set() };
      t.count++; t.reports.add(r.report_id);
      if (isNum) { t.sum += n; t.hasNum = true; }
      totals.set(name, t);
    });
    m.top = top;
    return m;
  });
  const itemCols = [];
  itemNames.forEach(nm => { for (let c = 1; c <= maxOcc.get(nm); c++) itemCols.push({ key: nm + '\u0000' + c, label: c === 1 ? nm : `${nm} (${c})` }); });

  // גליון 1 – דיווחים: שורה אחת לכל דיווח; תאריך, פרויקט, עיר, כתובת ושאר שדות הטופס (עד טקסט חופשי) – כל אחד בעמודה נפרדת; המיקום בסוף
  const nI = itemCols.length, nE = extraKeys.length;
  const s1 = [['מזהה דיווח', 'חברה / לקוח', 'קבלן מבצע', 'תאריך ביצוע', 'פרויקט / אתר', 'עיר', 'כתובת', 'גוב / עמוד',
    ...itemCols.map(c => c.label), ...extraKeys.map(extraLabel), 'זמן קליטה במערכת', 'סטטוס אישור', 'הערת אישור', 'אושר ע״י', 'תאריך אישור', ...locHead]];
  rows.forEach((r, i) => {
    const t = perReport[i].top;
    s1.push([r.report_id || '', r.company || '', r.contractor_name || '', t.date, t.project, t.city, t.address, unitOfRow(r),
      ...itemCols.map(c => perReport[i].has(c.key) ? perReport[i].get(c.key) : ''),
      ...extraKeys.map(k => extraVal(r, k)), fmtCreated(r.created_at),
      r.approval_status === 'approved' ? 'אושר' : r.approval_status === 'rejected' ? 'לא אושר' : 'ממתין', r.approval_note || '', r.approved_by || '', fmtCreated(r.approved_at), ...locCells(r)]);
  });
  const cNC = 13 + nI + nE, cLat = cNC + 1, cLon = cNC + 2, cMap = cNC + 3;
  const longText = l => /טקסט|הערות|הערה|תיאור|פירוט/.test(l);
  const w1 = XLSX.utils.aoa_to_sheet(s1);
  styleWorksheet(w1, [16, 16, 18, 13, 24, 14, 24, 16,
      ...itemCols.map(c => longText(c.label) ? 42 : Math.min(26, Math.max(12, c.label.length + 3))), ...extraKeys.map(() => 18), 18, 14, 30, 20, 18, 26, 14, 14, 9],
    { linkCols: [cMap], centerCols: [3, 7, cNC], ltrCols: [cNC], coordCols: [cLat, cLon], numCols: itemCols.filter(c => !longText(c.label)).map(c => 8 + itemCols.indexOf(c)) });
  XLSX.utils.book_append_sheet(wb, w1, 'דיווחים');

  // גליון סיכום כמויות לפי סעיף
  const s3 = [['סעיף / סוג עבודה', 'מס׳ דיווחים', 'מס׳ הופעות', 'סה״כ כמות']];
  [...totals].sort((a, b) => a[0].localeCompare(b[0], 'he')).forEach(([k, t]) => s3.push([k, t.reports.size, t.count, t.hasNum ? t.sum : '']));
  const w3 = XLSX.utils.aoa_to_sheet(s3);
  styleWorksheet(w3, [36, 14, 14, 16], { numCols: [1, 2, 3] });
  XLSX.utils.book_append_sheet(wb, w3, 'סיכום סעיפים');

  XLSX.writeFile(wb, `דוח-בקרה-שורה-לדיווח-${today()}.xlsx`);
  showToast('קובץ האקסל המעוצב הורד בהצלחה!');
}

const photoUrl = (id, name) => `${SB}/storage/v1/object/public/${BUCKET}/${encodeURIComponent(id)}/${encodeURIComponent(name)}`;

async function listPhotos(id) {
  try {
    const r = await api(`${SB}/storage/v1/object/list/${BUCKET}`, { method: 'POST', body: JSON.stringify({ prefix: id, limit: 200, sortBy: { column: 'name', order: 'asc' } }) });
    if (!r.ok) return [];
    return (await r.json()).filter(f => f.name && /\.(jpe?g|png|webp)$/i.test(f.name)).map(f => f.name);
  } catch (e) { return []; }
}

function fmt(k, v) {
  if (v && typeof v === 'object') return `<pre style="margin:0;white-space:pre-wrap;font-size:12px">${esc(JSON.stringify(v, null, 1))}</pre>`;
  if ((k === 'created_at' || k === 'updated_at') && v) { const d = new Date(v); if (!isNaN(d)) return esc(d.toLocaleString('he-IL')); }
  return esc(v ?? '—');
}

/* Structured Executive Report Modal */
async function openDetail(id) {
  const r = reports.find(x => x.report_id === id);
  if (!r) return;

  const priorityKeys = ['date', 'company', 'contractor_name', 'project', 'city', 'address', 'created_at'];
  const extraKeys = Object.keys(r).filter(k => !['id', 'photos', 'details', 'report_id', 'exported_at', 'approval_status', 'approval_note', 'approved_by', 'approved_at', ...priorityKeys].includes(k) && r[k] != null && r[k] !== '' && !((k === 'lat' || k === 'lon') && gpsOf(r)));
  const allMetaKeys = [...priorityKeys.filter(k => k in r), ...extraKeys];

  const lines = linesOf(r);
  const gps = gpsOf(r);
  const mapUrl = gps ? `https://www.google.com/maps?q=${gps.latitude},${gps.longitude}` : '';

  const apprBox = `
    <div class="meta-box" style="grid-column:1/-1">
      <div class="lbl">סטטוס אישור</div>
      <div class="val" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${apprBadge(r)}${r.approved_by ? `<span style="font-size:12px;color:var(--mut)">${esc(r.approved_by)}${r.approved_at ? ' · ' + esc(new Date(r.approved_at).toLocaleString('he-IL')) : ''}</span>` : ''}</div>
      ${r.approval_note ? `<div style="margin-top:6px;font-size:13px">💬 ${esc(r.approval_note)}</div>` : ''}
      <div class="appr" style="margin-top:8px">${apprButtons(r.report_id)}</div>
    </div>`;
  const metaCardsHtml = allMetaKeys.map(k => `
    <div class="meta-box">
      <div class="lbl">${esc(LABELS[k] || k)}</div>
      <div class="val">${fmt(k, r[k])}</div>
    </div>
  `).join('') + (gps ? `
    <div class="meta-box" style="border-color:var(--ok);grid-column:1/-1">
      <div class="lbl">🧭 נ.צ – נקודת ציון (GPS מאומת)</div>
      <div class="val"><span class="nc-chip" style="font-size:15px">${esc(ncText(gps))}</span></div>
      <div class="nc-actions">
        <button type="button" onclick="copyNC('${esc(ncText(gps))}')">📋 העתק נ.צ</button>
        <a href="${mapUrl}" target="_blank" rel="noopener">🗺️ Google Maps ↗</a>
        <a href="https://waze.com/ul?ll=${gps.latitude},${gps.longitude}&navigate=yes" target="_blank" rel="noopener">🚗 Waze ↗</a>
      </div>
    </div>
  ` : '') + apprBox;

  const workTableHtml = lines.length ? `
    <div class="detail-section">
      <div class="section-title">
        <span>🛠️ פירוט עבודות וביצוע בשטח</span>
        <span class="badge co">${lines.length} סעיפים</span>
      </div>
      <table class="work-table">
        <thead><tr><th>סעיף / פעולה שבוצעה</th><th>פירוט / כמות מדווחת</th></tr></thead>
        <tbody>
          ${lines.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(Array.isArray(v) ? v.join(', ') : v)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  ` : '';

  $('#detail').innerHTML = `
    <div class="sheet-header">
      <div>
        <h3>${esc(r.project || 'דוח ביצוע עבודה')}</h3>
        <span class="sub-id">מזהה דיווח: #${esc(r.report_id)} ${r.company ? `• ${esc(r.company)}` : ''}</span>
      </div>
      <button class="sheet-close" id="cl-top" title="סגירה">✕</button>
    </div>

    <div class="sheet-body">
      <div class="detail-section">
        <div class="section-title"><span>📋 פרטי התקשרות ומיקום</span></div>
        <div class="meta-grid">${metaCardsHtml}</div>
      </div>

      ${workTableHtml}

      <div class="detail-section" style="margin-bottom:0">
        <div class="section-title">
          <span>📷 תיעוד מצולם מהשטח</span>
          <button class="btn sm" id="share-rep">📤 שיתוף פרטי דיווח</button>
        </div>
        <div id="ph" class="msg">טוען תמונות מהשרת…</div>
      </div>
    </div>

    <div class="actions-footer">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn pri" id="pr">🖨️ הפקת PDF / הדפסה נקייה</button>
        <button class="btn" id="sv">${isSaved(r) ? '✅ נשמר – שמירה בשם שוב' : '💾 שמירה בשם…'}</button>
        <button class="btn" id="cl">סגירה</button>
      </div>
      ${userRole === 'admin' ? '<button class="btn bad" id="del">🗑️ מחיקת דיווח</button>' : ''}
    </div>
  `;

  $('#modal').classList.add('open');
  const closeModal = () => $('#modal').classList.remove('open');
  $('#cl').onclick = closeModal;
  $('#cl-top').onclick = closeModal;

  $('#share-rep').onclick = async () => {
    const summaryText = `דוח ביצוע עבודה #${r.report_id}\nפרויקט: ${r.project || '—'}\nחברה: ${r.company || '—'}\nקבלן: ${r.contractor_name || '—'}\nתאריך: ${r.date || '—'}\nכתובת: ${[r.city, r.address].filter(Boolean).join(', ') || '—'}` + (gps ? `\nנ.צ: ${ncText(gps)}\n${mapUrl}` : '') +
      (lines.length ? `\n\nפירוט עבודות:\n` + lines.map(([k, v]) => `• ${k}: ${joinV(v)}`).join('\n') : '');
    if (navigator.share) {
      try { await navigator.share({ title: `דוח עבודה - ${r.project || r.report_id}`, text: summaryText }); return; } catch (e) {}
    }
    navigator.clipboard.writeText(summaryText).then(() => showToast('פרטי הדוח הועתקו ללוח לשליחה בוואטסאפ/מייל'));
  };

  let items = (Array.isArray(parseJ(r.photos)) ? parseJ(r.photos) : []).filter(x => x && x.url).map(x => ({ cat: photoName(r, x), url: x.url }));
  const names = await listPhotos(id);
  if (!items.length) items = names.map(n => ({ cat: '', url: photoUrl(id, n) }));

  const groups = new Map();
  items.forEach(i => {
    const c = i.cat || photoName(r, null);
    if (!groups.has(c)) groups.set(c, []);
    groups.get(c).push(i);
  });

  $('#ph').className = '';
  $('#ph').innerHTML = items.length ? [...groups].map(([cat, arr]) => `
    <div class="gallery-cat-header">
      <span>🏷️ ${esc(cat)}</span>
      <span style="font-size:12px;color:var(--mut)">${arr.length} תמונות</span>
    </div>
    <div class="photos-grid">
      ${arr.map(i => `
        <div class="photo-card">
          <img loading="lazy" src="${esc(i.url)}" onclick="openLightbox('${esc(i.url)}', '${esc(r.project || 'דיווח')} - ${esc(cat)}')">
          <div class="photo-actions">
            <button onclick="openLightbox('${esc(i.url)}', '${esc(r.project || 'דיווח')} - ${esc(cat)}')" title="הגדל תמונה">🔍 הגדל</button>
            <button onclick="sharePhoto('${esc(i.url)}', '${esc(r.project || 'דיווח')} - ${esc(cat)}')" title="שלח בוואטסאפ / שתף">📤 שלח</button>
            <button onclick="copyPhotoLink('${esc(i.url)}')" title="העתק קישור">🔗</button>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('') : '<div class="empty" style="padding:20px">לא צורפו תמונות לדיווח זה</div>';

  const buildSheet = (srcOf = u => u) => `
      <div class="p first">
        <div class="pdf-banner">
          <div style="font-size:12px;opacity:0.85;margin-bottom:4px">פורטל ניהול ובקרת שטח • דוח ביצוע רשמי</div>
          <h1 style="margin:0 0 4px;font-size:24px">${esc(r.project || 'דוח ביצוע עבודה')}</h1>
          <div style="font-size:13px;opacity:0.9">מזהה דיווח: #${esc(r.report_id)} | הופק בתאריך: ${new Date().toLocaleDateString('he-IL')}</div>
        </div>
        <table>
          <tbody>
            ${allMetaKeys.map(k => `<tr><th style="width:32%">${esc(LABELS[k] || k)}</th><td>${fmt(k, r[k])}</td></tr>`).join('')}
            ${gps ? `<tr><th>נ.צ (קואורדינטות)</th><td style="direction:ltr;text-align:right">${esc(ncText(gps))}</td></tr>` : ''}
          </tbody>
        </table>
        ${lines.length ? `
          <h3 style="margin:22px 0 8px;color:#0f4c81;border-bottom:2px solid #0f4c81;padding-bottom:6px">פירוט עבודות שבוצעו</h3>
          <table>
            <thead><tr><th style="width:42%">סעיף / פעולה</th><th>פירוט / כמות מדווחת</th></tr></thead>
            <tbody>${lines.map(([k, v]) => `<tr><td><b>${esc(k)}</b></td><td>${esc(Array.isArray(v) ? v.join(', ') : v)}</td></tr>`).join('')}</tbody>
          </table>
        ` : ''}
      </div>` +
      items.map((i, idx) => `<div class="p"><div style="text-align:center;width:100%"><h3 style="color:#0f4c81;margin:0 0 10px">${esc(i.cat || 'תיעוד מצולם')} (${idx + 1}/${items.length})</h3><img src="${esc(srcOf(i.url))}"></div></div>`).join('');

  $('#pr').onclick = () => {
    $('#sheet').innerHTML = buildSheet();
    setTimeout(() => window.print(), 350);
  };

  // שמירה בשם: קובץ דוח עצמאי (HTML עם התמונות מוטמעות) – בכרום/אדג׳ נפתח חלון לבחירת נתיב ושם
  $('#sv').onclick = async () => {
    const btn = $('#sv'), label = btn.textContent;
    const name = `דוח-${String(r.project || 'ביצוע').replace(/[\\/:*?"<>|]/g, '_')}-${String(r.report_id).replace(/[\\/:*?"<>|]/g, '_')}.html`;
    let handle = null;
    if (window.showSaveFilePicker) {
      try { handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'דוח ביצוע (HTML)', accept: { 'text/html': ['.html'] } }] }); }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    btn.disabled = true; btn.textContent = 'מכין קובץ…';
    try {
      const urlMap = {};
      await Promise.all(items.map(async i => {
        try {
          const blob = await (await fetch(i.url)).blob();
          urlMap[i.url] = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
        } catch (e) { /* נשאר קישור לתמונה */ }
      }));
      const css = 'body{margin:0;background:#fff;color:#0f172a;font-family:Heebo,Arial,sans-serif}' +
        '#sheet .p{min-height:94vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;page-break-after:always}' +
        '#sheet .p:last-child{page-break-after:auto}#sheet .p img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:8px;border:1px solid #cbd5e1}' +
        '#sheet .first{display:block;min-height:auto;padding:24px}' +
        '#sheet .pdf-banner{background:#0f4c81;color:#fff;padding:18px 24px;border-radius:10px;margin-bottom:18px;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
        '#sheet table{width:100%;border-collapse:collapse;margin-top:12px}#sheet th,#sheet td{border:1px solid #cbd5e1;padding:9px 12px;text-align:right;font-size:13px}' +
        '#sheet th{background:#f1f5f9;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}';
      const html = `<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(r.project || 'דוח ביצוע עבודה')}</title><style>${css}</style></head><body><div id="sheet">${buildSheet(u => urlMap[u] || u)}</div></body></html>`;
      const file = new Blob([html], { type: 'text/html;charset=utf-8' });
      if (handle) { const w = await handle.createWritable(); await w.write(file); await w.close(); }
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
      showToast('הקובץ נשמר');
      await markSaved(r);
      refresh();
      btn.disabled = false; btn.textContent = '✅ נשמר – שמירה בשם שוב';
      return;
    } catch (e) { showToast('השמירה נכשלה'); }
    btn.disabled = false; btn.textContent = label;
  };

  if ($('#del')) $('#del').onclick = async () => {
    if (!confirm('למחוק את הדיווח ואת כל התמונות שלו לצמיתות?')) return;
    const d = await api(`${SB}/rest/v1/reports?report_id=eq.${encodeURIComponent(id)}`, { method: 'DELETE', headers: { Prefer: 'return=representation' } });
    const gone = d.ok ? await d.json() : [];
    if (!d.ok || !gone.length) { alert('המחיקה נכשלה – ייתכן שחסרה הרשאת מחיקה.'); return; }
    if (names.length) await api(`${SB}/storage/v1/object/${BUCKET}`, { method: 'DELETE', body: JSON.stringify({ prefixes: names.map(n => `${id}/${n}`) }) }).catch(() => {});
    reports = reports.filter(x => x.report_id !== id);
    closeModal();
    renderShell();
    showToast('הדיווח נמחק מהמערכת');
  };
}

$('#modal').onclick = e => { if (e.target.id === 'modal') e.target.classList.remove('open'); };

/* נעילה אוטומטית: אם האתר נסגר / ברקע יותר מ-5 דקות – נדרשת סיסמה מחדש */
const LOCK_MS = 5 * 60 * 1000;
const seenAt = () => { try { return +localStorage.getItem('dash_seen') || 0; } catch (e) { return 0; } };
const touchSeen = () => { try { if (session) localStorage.setItem('dash_seen', String(Date.now())); } catch (e) {} };
function lockIfStale() {
  if (session && Date.now() - seenAt() > LOCK_MS) {
    saveSession(null);
    try { localStorage.removeItem('dash_seen'); } catch (e) {}
    return true;
  }
  return false;
}
setInterval(touchSeen, 15000);
addEventListener('pagehide', touchSeen);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { touchSeen(); return; }
  if (lockIfStale()) renderLogin('עברו יותר מ-5 דקות – יש להתחבר מחדש.', true);
  else { touchSeen(); if (Date.now() - lastRefresh >= REFRESH_MS) softRefresh(); }
});

/* רענון נתונים אוטומטי כל 15 דקות (בלי לסגור חלונות פתוחים ובלי לאבד מקום) */
const REFRESH_MS = 15 * 60 * 1000;
let lastRefresh = Date.now();
async function softRefresh() {
  if (!session || !$('#list') || document.visibilityState !== 'visible') return;
  if ($('#modal') && $('#modal').classList.contains('open')) return;        // חלון דיווח פתוח
  if (view === 'users' || view === 'map') return;                           // מסכים שלא כדאי להפריע בהם
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;             // באמצע הקלדה
  try {
    let r = await api(`${SB}/rest/v1/reports?select=*&order=id.desc&limit=2000`);
    if (r.status === 400) r = await api(`${SB}/rest/v1/reports?select=*&limit=2000`);
    if (!r.ok) return;
    const rows = await r.json(), seenIds = new Map();
    rows.forEach(x => { if (!seenIds.has(x.report_id)) seenIds.set(x.report_id, x); });
    reports = [...seenIds.values()];
    lastRefresh = Date.now();
    refresh();
  } catch (e) {}
}
setInterval(() => { if (Date.now() - lastRefresh >= REFRESH_MS) softRefresh(); }, 60000);

function start() {
  const hp = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (hp.get('type') === 'recovery' && hp.get('access_token')) { renderReset(hp.get('access_token')); return; }
  if (hp.get('error_description')) { history.replaceState(null, '', location.pathname + location.search); renderLogin(hp.get('error_description')); return; }
  const locked = lockIfStale();
  touchSeen();
  session ? load() : renderLogin(locked ? 'עברו יותר מ-5 דקות – יש להתחבר מחדש.' : undefined, !!locked);
}
start();
</script>
</body>
</html>
