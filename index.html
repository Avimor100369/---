<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Executive Control Portal – ניהול ובקרת שטח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg: #f1f5f9;
  --bg-subtle: #e2e8f0;
  --card: #ffffff;
  --card-alt: #f8fafc;
  --tx: #0f172a;
  --tx-sec: #334155;
  --mut: #64748b;
  --line: #e2e8f0;
  --pri: #0f4c81;
  --pri-hover: #0a365c;
  --pri-light: #e0f2fe;
  --pri-tx: #ffffff;
  --acc: #0284c7;
  --bad: #e11d48;
  --bad-bg: #ffe4e6;
  --ok: #059669;
  --ok-bg: #d1fae5;
  --warn: #d97706;
  --warn-bg: #fef3c7;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
  --shadow-md: 0 4px 14px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.16), 0 8px 10px -6px rgba(15, 23, 42, 0.1);
  --radius: 16px;
}

:root[data-theme=dark] {
  --bg: #090e1a;
  --bg-subtle: #111827;
  --card: #162032;
  --card-alt: #0f172a;
  --tx: #f8fafc;
  --tx-sec: #cbd5e1;
  --mut: #94a3b8;
  --line: #283548;
  --pri: #38bdf8;
  --pri-hover: #7dd3fc;
  --pri-light: rgba(56, 189, 248, 0.14);
  --pri-tx: #090e1a;
  --acc: #38bdf8;
  --bad: #fb7185;
  --bad-bg: rgba(251, 113, 133, 0.14);
  --ok: #34d399;
  --ok-bg: rgba(52, 211, 153, 0.14);
  --warn: #fbbf24;
  --warn-bg: rgba(251, 191, 36, 0.14);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 20px 25px rgba(0, 0, 0, 0.65);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #090e1a;
    --bg-subtle: #111827;
    --card: #162032;
    --card-alt: #0f172a;
    --tx: #f8fafc;
    --tx-sec: #cbd5e1;
    --mut: #94a3b8;
    --line: #283548;
    --pri: #38bdf8;
    --pri-hover: #7dd3fc;
    --pri-light: rgba(56, 189, 248, 0.14);
    --pri-tx: #090e1a;
    --acc: #38bdf8;
    --bad: #fb7185;
    --bad-bg: rgba(251, 113, 133, 0.14);
    --ok: #34d399;
    --ok-bg: rgba(52, 211, 153, 0.14);
    --warn: #fbbf24;
    --warn-bg: rgba(251, 191, 36, 0.14);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 20px 25px rgba(0, 0, 0, 0.65);
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: 'Heebo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Top Executive Bar */
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 28px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 30;
  box-shadow: var(--shadow-sm);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
}
.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--pri), var(--acc));
  color: var(--pri-tx);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 20px;
  box-shadow: 0 4px 10px rgba(15, 76, 129, 0.3);
}
header h1 {
  font-size: 20px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.live-pill {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--ok-bg);
  color: var(--ok);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ok);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

header h1 small {
  display: block;
  font-size: 12px;
  font-weight: 400;
  color: var(--mut);
}
.user-badge {
  font-size: 12px;
  color: var(--mut);
  background: var(--card-alt);
  border: 1px solid var(--line);
  padding: 6px 12px;
  border-radius: 99px;
  direction: ltr;
}
@media (max-width: 760px) { .user-badge { display: none; } header { padding: 12px 16px; } }

button, input, select { font: inherit; }

.btn {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--tx);
  border-radius: 10px;
  padding: 8px 15px;
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.16s ease;
  box-shadow: var(--shadow-sm);
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--card-alt); border-color: var(--mut); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.pri { background: var(--pri); color: var(--pri-tx); border-color: var(--pri); }
.btn.pri:hover:not(:disabled) { background: var(--pri-hover); border-color: var(--pri-hover); }
.btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.ok:hover:not(:disabled) { opacity: 0.92; }
.btn.bad { color: var(--bad); border-color: var(--bad-bg); background: var(--bad-bg); }
.btn.bad:hover:not(:disabled) { background: var(--bad); color: #fff; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }

main { max-width: 1220px; margin: 0 auto; padding: 24px 20px 48px; }

/* Executive KPI Cards */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
  margin-bottom: 22px;
}
.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 22px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat::after {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 5px;
  background: var(--pri);
}
.stat.s-ok::after { background: var(--ok); }
.stat.s-acc::after { background: var(--acc); }
.stat.s-warn::after { background: var(--warn); }
.stat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.stat b { font-size: 30px; font-weight: 800; line-height: 1.1; color: var(--tx); }
.stat-ico { font-size: 20px; opacity: 0.85; }
.stat span { color: var(--mut); font-size: 13px; font-weight: 600; }
.stat small { color: var(--acc); font-size: 11.5px; margin-top: 4px; font-weight: 500; }

/* Control Panel (Search & Multi-Filters) */
.controls-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}
.search-wrap { position: relative; margin-bottom: 14px; }
.search {
  width: 100%;
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card-alt);
  color: var(--tx);
  font-size: 15px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-light); background: var(--card); }

.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.filters select, .filters input {
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card-alt);
  color: var(--tx);
  font-size: 13.5px;
  font-weight: 500;
}
.filters label {
  font-size: 13px;
  color: var(--mut);
  font-weight: 600;
  display: flex;
  gap: 6px;
  align-items: center;
  background: var(--card-alt);
  padding: 4px 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
}
.filters label input { border: none; background: transparent; padding: 4px; }
.quick-dates { display: flex; gap: 6px; margin-right: auto; }
@media (max-width: 820px) { .quick-dates { margin-right: 0; } }

/* Action Bar & View Tabs */
.bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
  align-items: center;
}
.bar .spacer { flex: 1; }
.tabs {
  display: inline-flex;
  background: var(--card);
  padding: 5px;
  border-radius: 12px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  flex-wrap: wrap;
}
.tabs .btn { border: none; box-shadow: none; background: transparent; padding: 7px 14px; border-radius: 8px; }
.tabs .btn.pri { background: var(--pri); color: var(--pri-tx); }

/* Report List Rows */
.row {
  display: grid;
  grid-template-columns: 115px 1.2fr 1.6fr auto;
  gap: 14px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 10px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.18s ease;
}
.row:hover {
  border-color: var(--pri);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
@media (max-width: 760px) {
  .row { grid-template-columns: 1fr 1fr; gap: 10px; }
  .row .meta-end { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
}
.row small { color: var(--mut); display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.2px; margin-bottom: 2px; }
.row .val { font-weight: 700; font-size: 15px; color: var(--tx); }
.row .meta-end { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.row .id-row {
  grid-column: 1 / -1;
  padding-top: 10px;
  margin-top: 2px;
  border-top: 1px dashed var(--line);
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  font-size: 12.5px;
  color: var(--mut);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
}
.badge.co { background: var(--pri-light); color: var(--pri); }
.badge.gps { background: var(--ok-bg); color: var(--ok); }
header { -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px); }
.stat { transition: transform .18s ease, box-shadow .18s ease; }
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(2, 132, 199, .35); outline-offset: 2px; }
.role-pill { display: inline-block; margin-inline-start: 6px; padding: 1px 8px; border-radius: 999px; background: var(--pri-light); color: var(--pri); font-size: 11px; font-weight: 800; }
::selection { background: var(--pri-light); color: var(--pri); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.appr { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.appr-b { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--line, #e2e8f0); color: var(--mut, #64748b); }
.appr-b.ok { background: var(--ok-bg, #dcfce7); color: var(--ok, #16a34a); }
.appr-b.bad { background: #fee2e2; color: #dc2626; }
.appr-btn { white-space: nowrap; font: inherit; font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 8px; border: 1px solid var(--line, #e2e8f0); background: var(--card, #fff); color: var(--tx, #0f172a); cursor: pointer; }
.appr-btn.ok { color: var(--ok, #16a34a); border-color: var(--ok, #16a34a); }
.appr-btn.bad { color: #dc2626; border-color: #dc2626; }
.appr-btn:hover { background: var(--pri-light, #e0f2fe); }
.appr-note { flex-basis: 100%; font-size: 12px; color: var(--mut, #64748b); }
.row > .appr { grid-column: 1 / -1; margin-top: 2px; padding-top: 10px; border-top: 1px dashed var(--line, #e2e8f0); align-items: center; }
.row .appr-note { flex-basis: auto; margin-inline-start: 4px; font-size: 13px; }
.v-done { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: var(--ok, #16a34a); color: #fff; font-size: 13px; font-weight: 900; line-height: 1; flex: none; }
.nc-chip { direction: ltr; unicode-bidi: embed; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; color: var(--ok); background: var(--ok-bg); padding: 2px 8px; border-radius: 6px; }
.nc-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.nc-actions a, .nc-actions button { font: inherit; font-size: 15px; font-weight: 700; padding: 11px 20px; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--tx); cursor: pointer; text-decoration: none; flex: 1 1 140px; box-shadow: var(--shadow-sm, 0 1px 2px rgba(15,23,42,.06)); }
.nc-actions a:hover, .nc-actions button:hover { background: var(--pri-light); }
.badge.ph-cnt { background: var(--card-alt); border: 1px solid var(--line); color: var(--tx-sec); }
.badge.lines-cnt { background: var(--warn-bg); color: var(--warn); }

/* Summary / Executive Analytics View */
.analytics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 18px;
}
.ana-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}
.ana-card h3 {
  margin: 0 0 14px;
  font-size: 16px;
  font-weight: 800;
  color: var(--pri);
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
}
.ana-row {
  margin-bottom: 12px;
}
.ana-row-top {
  display: flex;
  justify-content: space-between;
  font-size: 13.5px;
  font-weight: 600;
  margin-bottom: 4px;
}
.ana-bar-bg {
  height: 8px;
  background: var(--card-alt);
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.ana-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--pri), var(--acc));
  border-radius: 99px;
}

.empty, .msg { text-align: center; color: var(--mut); padding: 44px 16px; font-size: 15px; font-weight: 500; }
.err { background: var(--bad-bg); border: 1px solid var(--bad); color: var(--bad); border-radius: 12px; padding: 14px 18px; margin-bottom: 14px; white-space: pre-wrap; line-height: 1.5; font-weight: 600; }
.err.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.link { background: none; border: 0; color: var(--pri); cursor: pointer; padding: 8px 0; text-decoration: underline; font-weight: 600; }

/* Login */
.login {
  max-width: 420px;
  margin: 10vh auto;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 36px 32px;
  box-shadow: var(--shadow-lg);
}
.login h2 { margin: 0 0 6px; font-size: 25px; font-weight: 800; }
.login p { margin: 0 0 22px; color: var(--mut); font-size: 14px; }
.login input {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card-alt);
  color: var(--tx);
}

/* Modal & Structured Report Detail Sheet */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(5px);
  display: none;
  z-index: 50;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px 12px;
}
.modal.open { display: block; animation: fadeIn 0.18s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.sheet {
  background: var(--card);
  max-width: 960px;
  margin: 10px auto 30px;
  border-radius: 20px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  overflow-y: auto;
  max-height: 92vh;
  -webkit-overflow-scrolling: touch;
}

.sheet-header {
  background: linear-gradient(135deg, var(--pri), var(--pri-hover));
  color: var(--pri-tx);
  padding: 24px 28px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
.sheet-header h3 { margin: 0 0 4px; font-size: 23px; font-weight: 800; }
.sheet-header .sub-id { font-size: 13px; opacity: 0.9; direction: ltr; display: inline-block; font-family: monospace; }
.sheet-close {
  background: rgba(255,255,255,0.2);
  border: none;
  color: inherit;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sheet-close:hover { background: rgba(255,255,255,0.35); }

.sheet-body { padding: 24px 28px; }

.detail-section {
  background: var(--card-alt);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 20px;
}
.section-title {
  font-size: 15.5px;
  font-weight: 800;
  color: var(--pri);
  margin: 0 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.meta-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
  gap: 12px;
}
.meta-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
}
.meta-box .lbl { font-size: 11px; font-weight: 700; color: var(--mut); margin-bottom: 2px; }
.meta-box .val { font-size: 14px; font-weight: 700; color: var(--tx); word-break: break-word; }

.work-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.work-table th {
  background: var(--pri-light);
  color: var(--pri);
  text-align: right;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 800;
}
.work-table td {
  padding: 10px 14px;
  border-top: 1px solid var(--line);
  font-size: 14px;
  vertical-align: top;
}
.work-table tr:nth-child(even) td { background: var(--card-alt); }
.work-table td:first-child { font-weight: 700; color: var(--tx-sec); width: 38%; }

/* Photo Gallery & Lightbox */
.gallery-cat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 16px 0 10px;
  padding: 8px 14px;
  background: var(--card);
  border-right: 4px solid var(--pri);
  border-radius: 8px;
  font-weight: 800;
  font-size: 14px;
}
.photos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 12px;
}
.photo-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: transform 0.16s, box-shadow 0.16s;
}
.photo-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--pri); }
.photo-card img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  display: block;
  cursor: zoom-in;
  background: var(--bg-subtle);
}
.photo-actions {
  display: flex;
  gap: 4px;
  padding: 6px;
  background: var(--card);
  border-top: 1px solid var(--line);
}
.photo-actions button {
  flex: 1;
  border: 1px solid var(--line);
  background: var(--card-alt);
  color: var(--tx);
  border-radius: 6px;
  padding: 5px 6px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.photo-actions button:hover { background: var(--pri); color: var(--pri-tx); border-color: var(--pri); }

/* Lightbox Modal */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(5, 10, 20, 0.94);
  z-index: 100;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.lightbox.open { display: flex; }
.lightbox-caption {
  color: #f8fafc;
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 12px;
  text-align: center;
}
.lightbox img { max-width: 94vw; max-height: 74vh; border-radius: 12px; box-shadow: 0 12px 36px rgba(0,0,0,0.6); object-fit: contain; }
.lightbox-bar {
  margin-top: 16px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

.actions-footer {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  padding: 16px 28px;
  background: var(--card-alt);
  border-top: 1px solid var(--line);
  justify-content: space-between;
}

/* Gallery Hub Controls & Smart Logical Tree */
.gallery-hub-controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 18px;
  background: var(--card);
  padding: 14px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}
.hub-group {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}
.hub-group-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--pri);
  margin: 0 0 14px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--pri-light);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.hub-sub-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--tx-sec);
  margin: 14px 0 8px;
  padding: 5px 10px;
  background: var(--card-alt);
  border-right: 3px solid var(--acc);
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
}
.hub-photo-meta {
  padding: 7px 9px;
  font-size: 11.5px;
  color: var(--mut);
  background: var(--card-alt);
  border-top: 1px solid var(--line);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Toast Notification */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #0f172a;
  color: #fff;
  padding: 11px 22px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 700;
  box-shadow: var(--shadow-lg);
  z-index: 200;
  opacity: 0;
  transition: all 0.25s ease;
  border: 1px solid rgba(255,255,255,0.15);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* Print / Executive PDF Layout */
#sheet { display: none; }
@media print {
  body > *:not(#sheet) { display: none !important; }
  #sheet { display: block; color: #0f172a; background: #fff; font-family: 'Heebo', Arial, sans-serif; }
  #sheet .p { page-break-after: always; min-height: 94vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  #sheet .p:last-child { page-break-after: auto; }
  #sheet .p img { max-width: 100%; max-height: 82vh; object-fit: contain; border-radius: 8px; border: 1px solid #cbd5e1; }
  #sheet .first { display: block; min-height: auto; padding: 24px; }
  #sheet .pdf-banner { background: #0f4c81; color: #fff; padding: 18px 24px; border-radius: 10px; margin-bottom: 18px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #sheet table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  #sheet th, #sheet td { border: 1px solid #cbd5e1; padding: 9px 12px; text-align: right; font-size: 13px; }
  #sheet th { background: #f1f5f9; font-weight: 700; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
#map { position: relative; z-index: 0; }

/* ===== עיצוב משודרג, מסכים גדולים, מפות ===== */
body { background: radial-gradient(1100px 520px at 92% -8%, rgba(2,132,199,.13), transparent 60%), radial-gradient(900px 480px at -5% 0, rgba(15,76,129,.10), transparent 55%), var(--bg); background-attachment: fixed; }

.row { border-radius: 18px; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }

details.fold { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-sm); overflow: hidden; }

.f-ico { font-size: 20px; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 11px; border-radius: 999px; background: var(--pri-light); color: var(--pri); }
.pill.alt { background: var(--ok-bg, #dcfce7); color: var(--ok, #16a34a); }
.fold-body { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 10px; }

.loc { display: grid; grid-template-columns: minmax(130px, .9fr) auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }

@media (max-width: 900px) { .loc { grid-template-columns: 1fr; gap: 6px; } .loc-act { justify-content: flex-start; } }
/* ===== שורת דיווח קומפקטית עם לחצנים בצד ===== */
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; padding: 12px 16px; align-items: center; }

.side-ico button:hover, .side-ico a:hover { background: var(--pri-light); transform: translateY(-1px); }
.row-side .appr-note { font-size: 12px; max-height: 2.6em; overflow: hidden; }
.selbar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 9000; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; background: #0a2a4a; color: #fff; padding: 10px 16px; border-radius: 16px; box-shadow: 0 16px 40px -10px rgba(2,132,199,.6); max-width: 96vw; }

/* ===== שכבת עיצוב v2: שטוח, שקט ואחיד ===== */
:root { --hdr: #0f4c81; }

body { background: var(--bg) !important; font-variant-numeric: tabular-nums; }
header { background: var(--hdr) !important; box-shadow: none !important; border-bottom: 1px solid rgba(255,255,255,.1); -webkit-backdrop-filter: none; backdrop-filter: none; }
.brand-icon { background: rgba(255,255,255,.14) !important; box-shadow: none !important; color: #fff; }
.brand-icon svg { stroke: #fff; }
header h1 { font-weight: 700; }

.ic { width: 1.1em; height: 1.1em; vertical-align: -0.18em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn { transition: background .15s ease, border-color .15s ease, color .15s ease; }
.btn:hover:not(:disabled) { transform: none !important; }
.btn.pri { background: var(--pri) !important; box-shadow: none !important; }
.btn.pri:hover:not(:disabled) { background: var(--pri-hover) !important; }
.btn.ok { background: var(--ok) !important; box-shadow: none !important; color: #fff; }
.seg button.on { background: var(--pri) !important; box-shadow: none !important; }
.city-head { background: var(--card-alt) !important; }
.stat { box-shadow: none; border: 1px solid var(--line); }

.row, .stat, .city-card { animation: none !important; }
.row { border-radius: 10px; transition: background .12s ease, border-color .12s ease; box-shadow: none; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* ===== שלד חדש: סרגל צד, סינון דביק, מראה נקי ===== */
:root { --bg: #f3f5f9; --radius: 12px; --shadow-sm: 0 1px 2px rgba(15,23,42,.05); --shadow-md: 0 2px 8px rgba(15,23,42,.07); }
:root[data-theme=dark] { --bg: #0b1220; --card: #131c2e; --card-alt: #0f1727; --line: #25324a; }
body { font-size: 14.5px; line-height: 1.5; }
header { padding: 10px 24px; min-height: 58px; box-sizing: border-box; }
.brand-icon { width: 36px; height: 36px; border-radius: 10px; }
header h1 { font-size: 17px; }
header h1 small { display: none; }
.live-pill { background: rgba(255,255,255,.14); color: #fff; }
.live-dot { background: #4ade80; }
header .btn { background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.18); box-shadow: none; }
header .btn:hover:not(:disabled) { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.3); }
header .btn.bad { background: rgba(251,113,133,.18); color: #fecdd3; border-color: rgba(251,113,133,.3); }
.user-badge { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.16); color: #e2e8f0; }
.role-pill { background: rgba(255,255,255,.18) !important; color: #fff !important; }
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); align-items: start; min-height: calc(100vh - 58px); }
.side { position: sticky; top: 58px; height: calc(100vh - 58px); overflow-y: auto; box-sizing: border-box; padding: 18px 14px; background: var(--card); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.side-h { font-size: 11.5px; font-weight: 600; color: var(--mut); letter-spacing: .4px; padding: 10px 10px 4px; }
.side .tabs { display: flex; flex-direction: column; gap: 2px; background: none; border: 0; box-shadow: none; padding: 0; }
.side .tabs .btn, .side-ex .btn { width: 100%; justify-content: flex-start; padding: 10px 12px; font-size: 14px; font-weight: 500; border: 0; background: transparent !important; color: var(--tx-sec); box-shadow: none; border-radius: 9px; gap: 10px; }
.side .tabs .btn:hover:not(:disabled), .side-ex .btn:hover:not(:disabled) { background: var(--card-alt) !important; color: var(--tx); }
.side .tabs .btn.pri { background: var(--pri-light) !important; color: var(--pri) !important; font-weight: 700; }

  const dt = parseJ(r.details);
  if (dt && typeof dt === 'object') for (const k of Object.keys(dt)) if (k !== 'lines' && k !== 'gps' && unitKeyOk(k)) add(k, dt[k]);
  for (const k of Object.keys(r)) if (!['details', 'photos'].includes(k) && unitKeyOk(k)) add(k, r[k]);
  if (r.unit_number) add(r.unit_kind || 'גוב', r.unit_number);
  for (const [k, v] of linesOf(r)) if (UNIT_NUM_RE.test(String(k))) add(String(k), joinV(v));
  return found.length ? { text: found.map(f => `${f.kind} ${f.num}`).join(' · ') } : null;
}
function photoName(r, p) {
  const base = (p && p.category) || 'תיעוד כללי';
  const u = unitOf(r, p);
  return u ? `${base} · ${u.text}` : base;
}
function linesOf(r) { const dt = parseJ(r.details); return dt && Array.isArray(dt.lines) ? dt.lines.filter(Array.isArray) : []; }
function photosOf(r) { const p = parseJ(r.photos); return Array.isArray(p) ? p.filter(x => x && x.url) : []; }

function filtered() {
  const q = query.trim().toLowerCase();

      (!fFrom || (r.date && r.date >= fFrom)) &&
      (!fTo || (r.date && r.date <= fTo));
  });
}

async function sharePhoto(url, title = 'תיעוד עבודה') {
  try {
    if (navigator.share) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        const file = new File([blob], 'report-photo.jpg', { type: blob.type || 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ title, files: [file] });
          return;
        }
      } catch (e) {}
      await navigator.share({ title, url });
      return;
    }
  } catch (e) {
    if (e.name === 'AbortError') return;
  }
  copyPhotoLink(url);
}

    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  } catch (e) {
    window.open(url, '_blank');
  }
}

/* Download All Filtered Photos as Structured ZIP Folders */
async function downloadFilteredZip(rows) {
  if (typeof JSZip === 'undefined') {
    showToast('ספריית ה-ZIP עדיין נטענת, נסה שוב בעוד רגע');
    return;
  }
  const items = [];
  rows.forEach(r => {
    photosOf(r).forEach((p, idx) => {
      items.push({
        url: p.url,
        company: (r.company || 'ללא_חברה').replace(/[\\/:*?"<>|]/g, '_'),
        project: (r.project || 'ללא_פרויקט').replace(/[\\/:*?"<>|]/g, '_'),
        category: (p.category || 'כללי').replace(/[\\/:*?"<>|]/g, '_'),
        label: photoName(r, p).replace(/[\\/:*?"<>|]/g, '_').replace(/\s*·\s*/g, '_').replace(/\s+/g, '_'),
        date: r.date || 'ללא_תאריך',
        report_id: r.report_id,
        idx: idx + 1
      });
    });
  });

  if (!items.length) {
    showToast('אין תמונות להורדה בסינון הנוכחי');
    return;
  }

  const btn = $('#zip-btn');
  if (btn) { btn.disabled = true; btn.textContent = `⏳ אורז ${items.length} תמונות...`; }
  showToast(`מתחיל הורדה ואריזה של ${items.length} תמונות לתיקיות...`);

  try {
    const zip = new JSZip();
    let okCount = 0;
    for (const item of items) {
      try {
        const res = await fetch(item.url);
        if (!res.ok) continue;
        const blob = await res.blob();
        const ext = (blob.type && blob.type.includes('png')) ? 'png' : 'jpg';
        const folderPath = `${item.company}/${item.project}/${item.category}`;
        const fileName = `${item.label}_${item.date}_${item.report_id}_${item.idx}.${ext}`;
        zip.folder(folderPath).file(fileName, blob);
        okCount++;
      } catch (e) {}
    }

    if (!okCount) {
      showToast('לא ניתן היה להוריד את התמונות מהשרת');
      return;
    }

    const content = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(content);
    a.download = `תיעוד-תמונות-מסודר-${today()}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    showToast(`ירד בהצלחה! ${okCount} תמונות מסודרות בתיקיות`);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📦 הורדת תמונות כתיקיות (ZIP)'; }
  }
}

/* ===== חלון דו-שיח מעוצב (במקום alert / prompt / confirm) ===== */
function dlg(o) {
  return new Promise(res => {
    const ov = document.createElement('div');
    ov.className = 'dlg-ov'; ov.setAttribute('dir', 'rtl');
    ov.innerHTML = `<div class="dlg" role="dialog" aria-modal="true">
      <h3>${esc(o.title || '')}</h3>
      ${o.text ? `<p>${esc(o.text)}</p>` : ''}
      ${o.reasons ? `<div class="dlg-chips">${o.reasons.map(t => `<button type="button" class="chip">${esc(t)}</button>`).join('')}</div>` : ''}
      ${o.input ? `<textarea class="dlg-in" rows="3" placeholder="${esc(o.placeholder || '')}">${esc(o.value || '')}</textarea><div class="dlg-err"></div>` : ''}
      <div class="dlg-act"><button type="button" class="btn ${o.danger ? 'bad' : 'pri'}" data-ok>${esc(o.ok || 'אישור')}</button>${o.noCancel ? '' : '<button type="button" class="btn" data-no>ביטול</button>'}</div>
    </div>`;
    document.body.appendChild(ov);
    const ta = ov.querySelector('.dlg-in'), err = ov.querySelector('.dlg-err');
    const done = v => { document.removeEventListener('keydown', onKey, true); ov.remove(); res(v); };
    const submit = () => {
      if (!o.input) return done(true);
      const v = ta.value.trim();
      if (o.required && !v) { err.textContent = o.requiredMsg || 'שדה חובה'; ta.focus(); return; }
      done(v);
    };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(o.input ? null : false); } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey || !o.input)) { e.preventDefault(); submit(); } };
    document.addEventListener('keydown', onKey, true);
    ov.querySelector('[data-ok]').onclick = submit;
    const no = ov.querySelector('[data-no]'); if (no) no.onclick = () => done(o.input ? null : false);
    ov.onclick = e => { if (e.target === ov) done(o.input ? null : false); };
    ov.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (!ta) return; ta.value = (ta.value.trim() ? ta.value.trim() + ', ' : '') + c.textContent; err.textContent = ''; ta.focus(); });
    setTimeout(() => (ta || ov.querySelector('[data-ok]')).focus(), 30);
  });
}

function loadLib(src, ready) {

    const sc = document.createElement('script'); sc.src = src; sc.onload = () => (ready() ? res() : rej(new Error('lib'))); sc.onerror = () => rej(new Error('lib'));

}
var H2C_URL = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';

}

let _pdfBusy = false;
async function savePdfFor(id, o = {}) {
  const r = reports.find(x => x.report_id === id); if (!r) return;
  if (_pdfBusy) { showToast('קובץ אחר בהכנה, אנא המתן'); return; }
  const name = `דוח-${String(r.project || 'ביצוע').replace(/[\\/:*?"<>|]/g, '_')}-${String(r.report_id).replace(/[\\/:*?"<>|]/g, '_')}.pdf`;
  let handle = null;
  // חשוב: זו הפעולה הראשונה, לפני כל await – כך החלון נפתח מיד
  if (window.showSaveFilePicker) {
    try { handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'PDF', accept: { 'application/pdf': ['.pdf'] } }] }); }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  _pdfBusy = true;
  const btn = o.btn, label = o.label;
  if (btn) { btn.disabled = true; btn.textContent = 'מכין PDF…'; }
  showToast('מכין PDF…');
  let overlay = null, ok = false;
  try {
    const libs = loadPdfLibs();
    let items = (Array.isArray(parseJ(r.photos)) ? parseJ(r.photos) : []).filter(x => x && x.url).map(x => ({ cat: photoName(r, x), url: x.url }));
    if (!items.length) { const nm = await listPhotos(id); items = nm.map(n => ({ cat: '', url: photoUrl(id, n) })); }
    const urlMap = {};
    await Promise.all([libs, ...items.map(async i => {
      try {
        const blob = await (await fetch(i.url)).blob();
        urlMap[i.url] = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
      } catch (e) { /* נשאר קישור */ }
    })]);
    overlay = document.createElement('div');
    overlay.setAttribute('dir', 'rtl');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:100000;background:#e2e8f0;overflow:auto';
    overlay.innerHTML = '<div style="position:sticky;top:0;z-index:2;background:#0f4c81;color:#fff;padding:12px 18px;font:700 15px Arial,sans-serif">מכין את קובץ ה-PDF… אנא המתן</div>' +
      '<div id="pdfhost" style="width:718px;margin:16px auto;background:#fff;color:#0f172a;font-family:Heebo,Arial,sans-serif"><style>' +
      '#pdfhost .p{display:block;padding:0;margin:0 0 14px;background:#fff;text-align:center}#pdfhost .first{text-align:right}' +
      '#pdfhost .p img{max-width:100%;max-height:960px;object-fit:contain;border-radius:8px;border:1px solid #cbd5e1}' +
      '#pdfhost .pdf-banner{background:#0f4c81;color:#fff;padding:18px 24px;border-radius:10px;margin-bottom:18px;text-align:right}' +
      '#pdfhost table{width:100%;border-collapse:collapse;margin-top:12px}#pdfhost th,#pdfhost td{border:1px solid #cbd5e1;padding:8px 10px;text-align:right;font-size:13px}#pdfhost th{background:#f1f5f9;font-weight:700}' +
      '</style>' + buildReportSheet(r, items, u => urlMap[u] || u) + '</div>';
    document.body.appendChild(overlay);
    const host = overlay.querySelector('#pdfhost');
    await Promise.all([...host.querySelectorAll('img')].map(im => (im.complete ? null : new Promise(res => { im.onload = im.onerror = res; }))));
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
    const W = 190, H = 277;
    let first = true;
    for (const blk of host.querySelectorAll('.p')) {
      const cv = await window.html2canvas(blk, { scale: 1.6, useCORS: true, backgroundColor: '#ffffff', logging: false });
      const ratio = W / cv.width, pageH = Math.floor(H / ratio);
      for (let y = 0; y < cv.height; y += pageH) {
        const h = Math.min(pageH, cv.height - y);
        const part = document.createElement('canvas'); part.width = cv.width; part.height = h;
        const ctx = part.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, part.width, part.height);
        ctx.drawImage(cv, 0, y, cv.width, h, 0, 0, cv.width, h);
        if (!first) pdf.addPage(); first = false;
        pdf.addImage(part.toDataURL('image/jpeg', 0.9), 'JPEG', 10, 10, W, h * ratio);
      }
    }
    const blob = pdf.output('blob');
    if (handle) { const w = await handle.createWritable(); await w.write(blob); await w.close(); }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
    ok = true;

  } finally { if (overlay) overlay.remove(); _pdfBusy = false; }
  if (ok) refresh();
  if (btn) { btn.disabled = false; btn.textContent = ok ? '✅ נשמר – שמירה בשם שוב' : label; }
}

/* Smart Logical Sort Gallery Hub (Company -> Project / Category / Flat) */
function renderGalleryHub(rows) {
  const allItems = [];
  rows.forEach(r => {
    const phs = photosOf(r);
    phs.forEach(p => {
      allItems.push({
        url: p.url,
        category: p.category || 'תיעוד כללי',
        label: photoName(r, p),
        company: r.company || 'ללא שיוך חברה',
        project: r.project || 'ללא שם פרויקט',
        contractor: r.contractor_name || '',
        date: r.date || '',
        report_id: r.report_id
      });
    });
  });

  if (!allItems.length) {
    $('#list').innerHTML = '<div class="empty">אין תמונות להצגה בסינון הנוכחי</div>';
    return;
  }

  let contentHtml = '';

  if (galleryGroupBy === 'company_project') {
    // Hierarchical Logical Sort: Company -> Project
    const tree = new Map();
    allItems.forEach(item => {
      if (!tree.has(item.company)) tree.set(item.company, new Map());
      const projMap = tree.get(item.company);
      if (!projMap.has(item.project)) projMap.set(item.project, []);
      projMap.get(item.project).push(item);
    });

    contentHtml = [...tree].map(([compName, projMap]) => {
      const compTotal = [...projMap.values()].reduce((s, a) => s + a.length, 0);
      return `
        <div class="hub-group">
          <div class="hub-group-title">
            <span>🏢 ${esc(compName)}</span>
            <span class="badge co">${projMap.size} פרויקטים · ${compTotal} תמונות</span>
          </div>
          ${[...projMap].map(([projName, items]) => `
            <div class="hub-sub-title">
              <span>📁 ${esc(projName)}</span>
              <span>${items.length} תמונות</span>
            </div>
            <div class="photos-grid">
              ${items.map(i => renderHubPhotoCard(i)).join('')}
            </div>
          `).join('')}
        </div>
      `;
    }).join('');
  } else {
    const groups = new Map();
    allItems.forEach(item => {
      const key = galleryGroupBy === 'company' ? item.company : (galleryGroupBy === 'category' ? item.category : item.project);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(item);
    });

    contentHtml = [...groups].map(([grpName, items]) => `
      <div class="hub-group">
        <div class="hub-group-title">
          <span>${esc(grpName)}</span>
          <span class="badge ph-cnt">${items.length} תמונות</span>
        </div>
        <div class="photos-grid">
          ${items.map(i => renderHubPhotoCard(i)).join('')}
        </div>
      </div>
    `).join('');
  }

  $('#list').innerHTML = `
    <div class="gallery-hub-controls">
      <span style="font-weight:800;font-size:14px">מיון לוגי חכם לפי:</span>
      <select id="gb-sel" style="padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card-alt);color:var(--tx);font-weight:600">
        <option value="company_project"${galleryGroupBy === 'company_project' ? ' selected' : ''}>🏢 חברה ⬅ 📁 פרויקט (היררכי)</option>
        <option value="company"${galleryGroupBy === 'company' ? ' selected' : ''}>🏢 חברה / לקוח</option>
        <option value="project"${galleryGroupBy === 'project' ? ' selected' : ''}>📁 פרויקט / אתר</option>
        <option value="category"${galleryGroupBy === 'category' ? ' selected' : ''}>🏷️ קטגוריית תמונה</option>
      </select>
      <span style="color:var(--mut);font-size:13px;font-weight:600">סה״כ ${allItems.length} תמונות</span>
      <div style="margin-right:auto">
        <button class="btn pri sm" id="zip-btn">📦 הורדת תמונות כתיקיות (ZIP)</button>
      </div>
    </div>
    ${contentHtml}
  `;

  $('#gb-sel').onchange = e => { galleryGroupBy = e.target.value; renderGalleryHub(rows); };
  $('#zip-btn').onclick = () => downloadFilteredZip(rows);
}

function ensureLeaflet() {
  if (window.L) return Promise.resolve();
  if (leafletP) return leafletP;
  leafletP = new Promise((res, rej) => {
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = base + 'leaflet.min.css';
    const cssDone = new Promise(r => { l.onload = r; l.onerror = r; setTimeout(r, 3500); });   // מחכים לעיצוב המפה לפני שמציירים
    document.head.appendChild(l);
    const sc = document.createElement('script'); sc.src = base + 'leaflet.min.js';
    sc.onload = () => cssDone.then(res);
    sc.onerror = () => { leafletP = null; rej(new Error('leaflet')); };
    document.head.appendChild(sc);
  });
  return leafletP;
}

function addBase(map) {
  // ברירת מחדל: מפת רחובות של Esri (אותו שרת של הלוויין שעובד); חלופות: CARTO ו-OpenStreetMap
  const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles © Esri' });
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles © Esri' });
  const carto = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { subdomains: 'abcd', maxZoom: 20, attribution: '© OpenStreetMap © CARTO' });
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
  let errs = 0;
  esri.on('tileerror', () => { if (++errs === 8) { map.removeLayer(esri); sat.addTo(map); } });   // אם גם זה נחסם – לוויין
  esri.addTo(map);
  L.control.layers({ 'מפה': esri, 'לוויין': sat, 'מפה (CARTO)': carto, 'מפה (OSM)': osm }, null, { position: 'topleft' }).addTo(map);
}

const FIELD_RE = { city: /^(עיר|ישוב|יישוב|שם עיר)$/, project: /^(שם פרויקט|פרויקט|פרויקט \/ אתר|שם האתר|אתר)$/ };
function fieldOf(r, kind) {
  const v = r[kind]; if (v != null && String(v).trim() !== '') return String(v).trim();
  for (const [k, val] of linesOf(r)) if (FIELD_RE[kind].test(String(k).replace(/[:׳']/g, '').trim())) { const x = String(joinV(val)).trim(); if (x) return x; }
  return '';
}

/* ===== שמירת מיקומים כתיקייה: מיקומים / עיר / פרויקט.xlsx ===== */
var safeName = t => String(t || '').replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim().slice(0, 80) || 'ללא שם';
function placesTree(rows) {
  const tree = new Map();
  rows.map(r => ({ r, g: gpsOf(r) })).filter(x => x.g).forEach(x => {
    const c = fieldOf(x.r, 'city') || 'ללא עיר', p = fieldOf(x.r, 'project') || 'ללא פרויקט';
    if (!tree.has(c)) tree.set(c, new Map());
    const pm = tree.get(c); if (!pm.has(p)) pm.set(p, []); pm.get(p).push(x);
  });
  return tree;
}
function unitLabel(r) {
  const u = unitOf(r, null); if (u) return u.text;
  const ls = linesOf(r), kind = ls.find(([k]) => /^גוב או עמוד/.test(String(k))), det = ls.find(([k]) => /^פירוט/.test(String(k)));
  const t = [kind && joinV(kind[1]), det && joinV(det[1])].filter(Boolean).join(' · ');
  return t || 'ללא מספר גוב / עמוד';
}
function placesHtml(city, proj, list) {

  return `<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(proj)} – ${esc(city)}</title>
<style>body{font-family:Arial,sans-serif;margin:24px;color:#0f172a}h1{font-size:20px;margin:0}p{color:#64748b;margin:4px 0 16px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #cbd5e1;padding:9px 12px;text-align:right}th{background:#f1f5f9}a{color:#0f4c81;font-weight:700}</style></head>

}
async function savePlacesFolder(rows) {
  const tree = placesTree(rows);
  if (!tree.size) { showToast('אין מיקומים לשמירה בסינון הנוכחי'); return; }
  let root = null;
  // חלון בחירת התיקייה נפתח מיד בלחיצה
  if (window.showDirectoryPicker) {
    try { root = await window.showDirectoryPicker({ mode: 'readwrite', id: 'dash-places' }); }
    catch (e) { if (e && e.name === 'AbortError') return; root = null; }
  }
  const files = [];
  tree.forEach((pm, city) => pm.forEach((list, proj) => files.push({ dir: safeName(city), name: safeName(proj) + '.html', data: placesHtml(city, proj, list) })));
  try {
    if (root) {
      const top = await root.getDirectoryHandle('מיקומים', { create: true });
      for (const f of files) { const d = await top.getDirectoryHandle(f.dir, { create: true }); await writeFileTo(d, f.name, f.data); }
      showToast(`נשמרה תיקיית "מיקומים" · ${tree.size} ערים · ${files.length} קבצי קישורים`);
      return;
    }
  } catch (e) { console.error(e); showToast('הכתיבה לתיקייה נכשלה – יורד קובץ ZIP'); }
  try {
    const zip = new JSZip();
    files.forEach(f => zip.folder('מיקומים').folder(f.dir).file(f.name, f.data));
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'מיקומים.zip'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    showToast('התיקייה ירדה כקובץ ZIP (מיקומים.zip)');
  } catch (e) { showToast('שמירת התיקייה נכשלה: ' + ((e && e.message) || e)); }
}

    ${pts.length ? `<div class="places">${cities.map(([city, pm], ci) => `
      <details class="fold"${ci === 0 ? ' open' : ''}>
        <summary><span class="f-ico">📁</span><b>${esc(city)}</b><span class="pill">${countOf(pm)} מיקומים</span><span class="pill alt">${pm.size} פרויקטים</span></summary>
        <div class="fold-body">${[...pm.entries()].sort((a, b) => b[1].length - a[1].length).map(([proj, list]) => `
          <details class="fold sub"${ci === 0 ? ' open' : ''}>
            <summary><span class="f-ico">📂</span><b>${esc(proj)}</b><span class="pill">${list.length}</span></summary>
            <div class="loc-list">${list.sort((a, b) => String(b.r.date || '').localeCompare(String(a.r.date || ''))).map(locRow).join('')}</div>
          </details>`).join('')}</div>
      </details>`).join('')}</div>` : '<div class="empty">אין דיווחים עם מיקום GPS בסינון הנוכחי.</div>'}`;
  $('#plSave').onclick = () => savePlacesFolder(rows);
  $('#plOpen').onclick = () => document.querySelectorAll('.places details').forEach(d => { d.open = true; });
  $('#plClose').onclick = () => document.querySelectorAll('.places details').forEach(d => { d.open = false; });
}

async function renderMap(rows) {
  const tok = ++mapTok;
  const pts = rows.map(r => ({ r, g: gpsOf(r) })).filter(x => x.g);
  killMaps();
  $('#list').innerHTML = `
    <div class="map-bar">
      <div class="seg"><button type="button" class="${mapMode === 'all' ? 'on' : ''}" data-mm="all">🗺️ מפה כללית</button><button type="button" class="${mapMode === 'cities' ? 'on' : ''}" data-mm="cities">🏙️ לפי ערים</button></div>
      <div class="legend"><span><i style="background:#059669"></i>אושר</span><span><i style="background:#e11d48"></i>לא אושר</span><span><i style="background:#0f4c81"></i>ממתין</span></div>
      <span class="muted">${pts.length} מיקומים</span>
    </div>
    ${mapMode === 'all' ? '<div id="map" class="map-box"></div>' : '<div id="cityMaps"></div>'}
    ${pts.length ? '' : '<div class="empty">אין דיווחים עם מיקום GPS בסינון הנוכחי.</div>'}`;
  $('#list').onclick = e => { const b = e.target.closest('[data-open]'); if (b) openDetail(b.dataset.open); };
  document.querySelectorAll('[data-mm]').forEach(b => b.onclick = () => { mapMode = b.dataset.mm; renderMap(rows); });
  try { await ensureLeaflet(); } catch (e) { if (tok === mapTok) $('#list').innerHTML = '<div class="err">טעינת המפה נכשלה. בדוק חיבור לאינטרנט ונסה שוב.</div>'; return; }
  if (tok !== mapTok) return;

  if (mapMode === 'all') {
    if (!$('#map')) return;
    mapObj = L.map('map', { zoomControl: true }).setView([31.5, 34.9], 8);
    addBase(mapObj);
    const bounds = [];
    pts.forEach(({ r, g }) => { L.marker([g.latitude, g.longitude], { icon: pinIcon(r) }).addTo(mapObj).bindPopup(popupHtml(r, g)); bounds.push([g.latitude, g.longitude]); });
    if (bounds.length) mapObj.fitBounds(bounds, { padding: [35, 35], maxZoom: 16 });
    [100, 400, 1000].forEach(t => setTimeout(() => { if (mapObj) mapObj.invalidateSize(); }, t));
    return;
  }

  // תצוגה לפי ערים: כרטיס לכל עיר – מפה, נ.צ ומספר גוב/עמוד לכל נקודה
  const byCity = new Map();
  pts.forEach(x => { const c = fieldOf(x.r, 'city') || 'ללא עיר'; if (!byCity.has(c)) byCity.set(c, []); byCity.get(c).push(x); });
  const cities = [...byCity.entries()].sort((a, b) => b[1].length - a[1].length);
  $('#cityMaps').innerHTML = cities.map(([city, list], ci) => `
    <section class="city-card">
      <div class="city-head"><h3>🏙️ ${esc(city)}</h3><span class="city-count">${list.length} מיקומים</span></div>
      <div class="city-body">
        <div class="city-map" id="cm-${ci}"></div>
        <div class="city-pts">${list.map(({ r, g }, pi) => {
          const u = unitOf(r, null);
          return `<div class="cp" data-focus="${ci}:${pi}">
            <div class="cp-top"><i class="dot" style="background:${STATUS_COLOR(r)}"></i><b>${esc(u ? u.text : 'ללא גוב/עמוד')}</b><span class="cp-sub">${esc(r.project || '')} · ${esc(r.date || '')}</span></div>
            <div class="cp-nc"><span class="nc-chip">🧭 נ.צ ${esc(ncText(g))}</span></div>
            <div class="cp-act">
              <button type="button" onclick="event.stopPropagation();copyNC('${esc(ncText(g))}')">📋 העתק נ.צ</button>
              <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${g.latitude},${g.longitude}" onclick="event.stopPropagation()">Google ↗</a>
              <a target="_blank" rel="noopener" href="https://waze.com/ul?ll=${g.latitude},${g.longitude}&navigate=yes" onclick="event.stopPropagation()">Waze ↗</a>
              <button type="button" data-open="${esc(r.report_id)}">פתיחת דיווח</button>
            </div></div>`;
        }).join('')}</div>
      </div>
    </section>`).join('');
  cities.forEach(([city, list], ci) => {
    const el = document.getElementById('cm-' + ci); if (!el) return;
    const m = L.map(el, { scrollWheelZoom: false }).setView([list[0].g.latitude, list[0].g.longitude], 15);
    addBase(m);
    const markers = list.map(({ r, g }) => L.marker([g.latitude, g.longitude], { icon: pinIcon(r) }).addTo(m).bindPopup(popupHtml(r, g)));
    m.fitBounds(list.map(x => [x.g.latitude, x.g.longitude]), { padding: [30, 30], maxZoom: 17 });
    cityMaps.push(m);
    el.closest('.city-card').querySelectorAll('[data-focus]').forEach(c => c.onclick = () => {
      const pi = +c.dataset.focus.split(':')[1];
      m.setView(markers[pi].getLatLng(), 18); markers[pi].openPopup();
    });
    [100, 500, 1200].forEach(t => setTimeout(() => { try { m.invalidateSize(); } catch (e) {} }, t));
  });
}

/* ===================== ייצוא אקסל מקצועי ===================== */
const joinV = v => Array.isArray(v) ? v.join(', ') : (v ?? '');
const HE_MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
const monthKeyOf = r => { const m = /^(\d{4})-(\d{2})/.exec(String(r.date || '')) || /^(\d{4})-(\d{2})/.exec(String(r.created_at || '')); return m ? `${m[1]}-${m[2]}` : null; };
const monthLabelOf = key => { const [y, m] = key.split('-'); return `${HE_MONTHS[+m - 1]} ${y}`; };
const XB = c => ({ style: 'thin', color: { rgb: c } });
const BORD = { top: XB('CBD5E1'), bottom: XB('CBD5E1'), left: XB('CBD5E1'), right: XB('CBD5E1') };
const GROUP_COLORS = { 'פרטי הדיווח': ['0A365C', '0F4C81'], 'סעיפי עבודה': ['115E59', '0F766E'], 'נתונים נוספים': ['475569', '64748B'], 'אישור': ['92400E', 'B45309'], 'מיקום': ['1E293B', '334155'] };

function simpleSheet(title, head, data, widths, numCols = [], total = null) {
  const N = head.length;
  const aoa = [[title, ...Array(N - 1).fill('')], Array(N).fill(''), head, ...data];
  if (total) aoa.push(total);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: N - 1 } }];
  ws['!cols'] = widths.map(w => ({ wch: w }));
  ws['!views'] = [{ rightToLeft: true, RTL: true, showGridLines: false }];
  ws['!rows'] = [{ hpt: 34 }, { hpt: 6 }, { hpt: 30 }];
  const lastR = aoa.length - 1;
  for (let R = 0; R <= lastR; R++) for (let C = 0; C < N; C++) {
    const addr = XLSX.utils.encode_cell({ r: R, c: C });
    const cell = ws[addr] || (ws[addr] = { t: 's', v: '' });
    if (R === 0) cell.s = { font: { name: 'Arial', sz: 16, bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '0A2A4A' } }, alignment: { horizontal: 'right', vertical: 'center', readingOrder: 2 } };
    else if (R === 1) continue;
    else if (R === 2) cell.s = { font: { name: 'Arial', sz: 10.5, bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '0F4C81' } }, alignment: { horizontal: 'center', vertical: 'center', wrapText: true }, border: { ...BORD, bottom: { style: 'medium', color: { rgb: '0A365C' } } } };
    else if (total && R === lastR) cell.s = { font: { name: 'Arial', sz: 10.5, bold: true, color: { rgb: '0A365C' } }, fill: { fgColor: { rgb: 'E2E8F0' } }, alignment: { horizontal: numCols.includes(C) ? 'center' : 'right', vertical: 'center' }, border: { ...BORD, top: { style: 'medium', color: { rgb: '0A365C' } } } };
    else cell.s = { font: { name: 'Arial', sz: 10, bold: numCols.includes(C), color: { rgb: '0F172A' } }, fill: { fgColor: { rgb: (R % 2) ? 'FFFFFF' : 'F1F5F9' } }, alignment: { horizontal: numCols.includes(C) ? 'center' : 'right', vertical: 'center', wrapText: true }, border: BORD };
  }
  if (data.length) ws['!autofilter'] = { ref: `${XLSX.utils.encode_cell({ r: 2, c: 0 })}:${XLSX.utils.encode_cell({ r: 2 + data.length, c: N - 1 })}` };
  return ws;
}

function buildWorkbook(rows, title, subtitle) {
  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  const scalar = v => (v && typeof v === 'object') ? (Array.isArray(v) ? v.join(', ') : JSON.stringify(v)) : (v ?? '');
  const mapLink = g => g ? `https://www.google.com/maps?q=${g.latitude},${g.longitude}` : '';
  const fmtCreated = v => { if (!v) return ''; const d = new Date(v); return isNaN(d) ? String(v) : d.toLocaleString('he-IL'); };
  const isPhotoLine = (k, v) => /תמונ|צילום|photo|image|img|pic/i.test(String(k)) || /^\s*(\d+\s*)?תמונ(ה|ות)\s*(\d+)?\s*$/.test(String(joinV(v)));
  const workLines = r => linesOf(r).filter(([k, v]) => !UNIT_NUM_RE.test(String(k)) && !isPhotoLine(k, v));
  const canonOf = name => {
    const t = String(name).replace(/[:׳']/g, '').trim();
    if (/^(תאריך|תאריך ביצוע)$/.test(t)) return 'date';
    if (/^(שם פרויקט|פרויקט|פרויקט \/ אתר|שם האתר|אתר)$/.test(t)) return 'project';
    if (/^(עיר|ישוב|יישוב|שם עיר)$/.test(t)) return 'city';
    if (/^(כתובת|כתובת מדויקת)$/.test(t)) return 'address';
    return null;
  };

  // שדות נוספים (מעבר לבסיס) – נאספים אוטומטית, בלי תמונות
  const baseKeys = ['report_id', 'date', 'company', 'contractor_name', 'project', 'city', 'address'];
  const skip = new Set(['id', 'photos', 'details', 'created_at', 'updated_at', 'exported_at', 'approval_status', 'approval_note', 'approved_by', 'approved_at', 'lat', 'lon', 'unit_kind', 'unit_number', ...baseKeys]);
  const isPhotoKey = k => /תמונ|photo|image|img|pic/i.test(k);
  const extraKeys = [];
  const addExtra = k => { if (!isPhotoKey(k) && !extraKeys.includes(k) && !unitKeyOk(k.replace(/^details\./, ''))) extraKeys.push(k); };
  rows.forEach(r => {
    Object.keys(r).forEach(k => { if (!skip.has(k) && r[k] != null && r[k] !== '') addExtra(k); });
    const dt = parseJ(r.details);
    if (dt && typeof dt === 'object') Object.keys(dt).forEach(k => { if (k !== 'lines' && k !== 'gps' && dt[k] != null && dt[k] !== '') addExtra('details.' + k); });
  });
  const extraVal = (r, k) => { if (k.startsWith('details.')) { const dt = parseJ(r.details); return scalar(dt && dt[k.slice(8)]); } return scalar(r[k]); };
  const extraLabel = k => LABELS[k] || k.replace(/^details\./, '');

  // סעיפי העבודה: כל סעיף = עמודה; סעיף שחוזר באותו דיווח = עמודה נוספת
  const totals = new Map(), itemNames = [], maxOcc = new Map();
  const perReport = rows.map(r => {
    const m = new Map(), cnt = new Map();
    const top = { date: r.date || '', project: r.project || '', city: r.city || '', address: r.address || '' };
    workLines(r).forEach(([k, v]) => {
      const name = String(k || '—'), val = joinV(v), n = Number(val), isNum = val !== '' && !isNaN(n);
      const cn = canonOf(name);
      if (cn) { if (!top[cn] && val !== '') top[cn] = val; return; }
      const c = (cnt.get(name) || 0) + 1; cnt.set(name, c);
      if (!itemNames.includes(name)) itemNames.push(name);
      maxOcc.set(name, Math.max(maxOcc.get(name) || 0, c));
      m.set(name + '\u0000' + c, isNum ? n : val);
      const t = totals.get(name) || { count: 0, sum: 0, hasNum: false, reports: new Set() };
      t.count++; t.reports.add(r.report_id);
      if (isNum) { t.sum += n; t.hasNum = true; }
      totals.set(name, t);
    });
    m.top = top;
    return m;
  });
  const itemCols = [];
  itemNames.forEach(nm => { for (let c = 1; c <= maxOcc.get(nm); c++) itemCols.push({ key: nm + '\u0000' + c, label: c === 1 ? nm : `${nm} (${c})` }); });
  const longText = l => /טקסט|הערות|הערה|תיאור|פירוט/.test(l);
  const stText = r => r.approval_status === 'approved' ? 'אושר' : r.approval_status === 'rejected' ? 'לא אושר' : 'ממתין';

  const cols = [];
  const add = (group, label, type, w, get) => cols.push({ group, label, type, w, get });
  add('פרטי הדיווח', 'מזהה דיווח', 'text', 17, r => r.report_id || '');
  add('פרטי הדיווח', 'חברה / לקוח', 'text', 16, r => r.company || '');
  add('פרטי הדיווח', 'קבלן מבצע', 'text', 18, r => r.contractor_name || '');
  add('פרטי הדיווח', 'תאריך ביצוע', 'center', 13, (r, i) => perReport[i].top.date);
  add('פרטי הדיווח', 'פרויקט / אתר', 'text', 24, (r, i) => perReport[i].top.project);
  add('פרטי הדיווח', 'עיר', 'text', 14, (r, i) => perReport[i].top.city);
  add('פרטי הדיווח', 'כתובת', 'text', 26, (r, i) => perReport[i].top.address);
  add('פרטי הדיווח', 'גוב / עמוד', 'center', 14, r => { const u = unitOf(r, null); return u ? u.text : ''; });
  itemCols.forEach(c => add('סעיפי עבודה', c.label, longText(c.label) ? 'long' : 'num', longText(c.label) ? 44 : Math.min(24, Math.max(12, c.label.length + 3)), (r, i) => perReport[i].has(c.key) ? perReport[i].get(c.key) : ''));
  extraKeys.forEach(k => add('נתונים נוספים', extraLabel(k), 'text', 18, r => extraVal(r, k)));
  add('נתונים נוספים', 'זמן קליטה במערכת', 'center', 19, r => fmtCreated(r.created_at));
  add('אישור', 'סטטוס אישור', 'status', 14, r => stText(r));
  add('אישור', 'הערת אישור', 'long', 32, r => r.approval_note || '');
  add('אישור', 'אושר ע״י', 'text', 22, r => r.approved_by || '');
  add('אישור', 'תאריך אישור', 'center', 19, r => fmtCreated(r.approved_at));
  add('מיקום', 'נ.צ', 'ltr', 26, r => { const g = gpsOf(r); return g ? ncText(g) : 'ללא מיקום'; });
  add('מיקום', 'קו רוחב (Lat)', 'coord', 14, r => { const g = gpsOf(r); return g ? +(+g.latitude).toFixed(6) : ''; });
  add('מיקום', 'קו אורך (Lon)', 'coord', 14, r => { const g = gpsOf(r); return g ? +(+g.longitude).toFixed(6) : ''; });
  add('מיקום', 'ניווט', 'link', 13, r => mapLink(gpsOf(r)));

  const NC = cols.length, LAST = NC - 1, GROW = 4, HDR = 5, R0 = 6;
  const nA = rows.filter(r => r.approval_status === 'approved').length, nR = rows.filter(r => r.approval_status === 'rejected').length;
  const kpi = `סה״כ ${rows.length} דיווחים   ·   ✓ ${nA} אושרו   ·   ⏳ ${rows.length - nA - nR} ממתינים   ·   ✕ ${nR} לא אושרו   ·   ${new Set(rows.map(r => r.contractor_name).filter(Boolean)).size} קבלנים   ·   ${new Set(rows.map(r => (r.city || '').trim()).filter(Boolean)).size} ערים`;
  const blank = () => Array(NC).fill('');
  const aoa = [[title, ...Array(LAST).fill('')], [subtitle, ...Array(LAST).fill('')], [kpi, ...Array(LAST).fill('')], blank(), cols.map(c => c.group), cols.map(c => c.label)];
  rows.forEach((r, i) => aoa.push(cols.map(c => c.get(r, i))));
  const totRow = cols.map((c, ci) => ci === 0 ? 'סה״כ' : (c.type === 'num' ? rows.reduce((a, _, i) => { const v = c.get(rows[i], i); return a + (typeof v === 'number' ? v : 0); }, 0) || '' : ''));
  aoa.push(totRow);
  aoa.push([`הופק מתוך לוח ניהול ובקרה · ${new Date().toLocaleString('he-IL')}`, ...Array(LAST).fill('')]);
  const TROW = R0 + rows.length, FROW = TROW + 1;

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const merges = [0, 1, 2, FROW].map(r => ({ s: { r, c: 0 }, e: { r, c: LAST } }));
  let gs = 0;
  for (let c = 1; c <= NC; c++) if (c === NC || cols[c].group !== cols[gs].group) { if (c - 1 > gs) merges.push({ s: { r: GROW, c: gs }, e: { r: GROW, c: c - 1 } }); gs = c; }
  ws['!merges'] = merges;
  ws['!cols'] = cols.map(c => ({ wch: c.w }));
  ws['!views'] = [{ rightToLeft: true, RTL: true, showGridLines: false }];
  const hts = []; hts[0] = { hpt: 36 }; hts[1] = { hpt: 22 }; hts[2] = { hpt: 26 }; hts[3] = { hpt: 6 }; hts[GROW] = { hpt: 22 }; hts[HDR] = { hpt: 38 };
  ws['!rows'] = hts;

  for (let R = 0; R <= FROW; R++) for (let C = 0; C < NC; C++) {
    const addr = XLSX.utils.encode_cell({ r: R, c: C });
    const cell = ws[addr] || (ws[addr] = { t: 's', v: '' });
    const col = cols[C], gc = GROUP_COLORS[col.group] || ['334155', '475569'];
    if (R === 0) cell.s = { font: { name: 'Arial', sz: 18, bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '0A2A4A' } }, alignment: { horizontal: 'right', vertical: 'center', readingOrder: 2 } };
    else if (R === 1) cell.s = { font: { name: 'Arial', sz: 11, color: { rgb: 'BAE6FD' } }, fill: { fgColor: { rgb: '0F4C81' } }, alignment: { horizontal: 'right', vertical: 'center', readingOrder: 2 } };
    else if (R === 2) cell.s = { font: { name: 'Arial', sz: 11, bold: true, color: { rgb: '0A365C' } }, fill: { fgColor: { rgb: 'E0F2FE' } }, alignment: { horizontal: 'right', vertical: 'center', readingOrder: 2 }, border: { bottom: XB('7DD3FC') } };
    else if (R === 3) continue;
    else if (R === GROW) cell.s = { font: { name: 'Arial', sz: 11, bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: gc[0] } }, alignment: { horizontal: 'center', vertical: 'center' }, border: { left: XB('FFFFFF'), right: XB('FFFFFF') } };
    else if (R === HDR) cell.s = { font: { name: 'Arial', sz: 10.5, bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: gc[1] } }, alignment: { horizontal: 'center', vertical: 'center', wrapText: true }, border: { top: XB('FFFFFF'), left: XB('FFFFFF'), right: XB('FFFFFF'), bottom: { style: 'medium', color: { rgb: gc[0] } } } };
    else if (R === TROW) cell.s = { font: { name: 'Arial', sz: 10.5, bold: true, color: { rgb: '0A365C' } }, fill: { fgColor: { rgb: 'E2E8F0' } }, alignment: { horizontal: col.type === 'num' ? 'center' : 'right', vertical: 'center' }, border: { ...BORD, top: { style: 'medium', color: { rgb: '0A365C' } } } };
    else if (R === FROW) cell.s = { font: { name: 'Arial', sz: 9, italic: true, color: { rgb: '94A3B8' } }, alignment: { horizontal: 'right', vertical: 'center', readingOrder: 2 } };
    else {
      const t = col.type, band = (R - R0) % 2 === 0;
      let fill = band ? 'FFFFFF' : 'F1F5F9', fc = '0F172A', bold = false, hz = 'right', ul = false;
      if (t === 'num') { hz = 'center'; bold = true; if (typeof cell.v === 'number') cell.z = '#,##0.##'; }
      else if (t === 'center') hz = 'center';
      else if (t === 'ltr' || t === 'coord') { hz = 'left'; if (typeof cell.v === 'number') cell.z = '0.000000'; }
      else if (t === 'status') {
        hz = 'center'; bold = true;
        if (cell.v === 'אושר') { fill = 'D1FAE5'; fc = '065F46'; } else if (cell.v === 'לא אושר') { fill = 'FEE2E2'; fc = '991B1B'; } else { fill = 'FEF3C7'; fc = '92400E'; }
      } else if (t === 'link' && typeof cell.v === 'string' && cell.v.startsWith('http')) {
        cell.l = { Target: cell.v, Tooltip: 'פתח במפה' }; cell.v = 'פתח במפה'; fc = '0284C7'; ul = true; hz = 'center';
      }
      cell.s = { font: { name: 'Arial', sz: 10, bold, underline: ul, color: { rgb: fc } }, fill: { fgColor: { rgb: fill } }, alignment: { horizontal: hz, vertical: 'center', wrapText: true }, border: BORD };
    }
  }
  if (rows.length) ws['!autofilter'] = { ref: `${XLSX.utils.encode_cell({ r: HDR, c: 0 })}:${XLSX.utils.encode_cell({ r: TROW - 1, c: LAST })}` };
  XLSX.utils.book_append_sheet(wb, ws, 'דיווחים');

  // סיכום סעיפים
  const itemRows = [...totals].sort((a, b) => a[0].localeCompare(b[0], 'he')).map(([k, t]) => [k, t.reports.size, t.count, t.hasNum ? t.sum : '']);
  XLSX.utils.book_append_sheet(wb, simpleSheet('סיכום כמויות לפי סעיף עבודה', ['סעיף / סוג עבודה', 'מס׳ דיווחים', 'מס׳ הופעות', 'סה״כ כמות'], itemRows, [40, 16, 16, 18], [1, 2, 3]), 'סיכום סעיפים');

  // סיכום קבלנים
  const byC = new Map();
  rows.forEach(r => { const k = r.contractor_name || 'ללא קבלן'; const o = byC.get(k) || { n: 0, a: 0, x: 0, cities: new Set() }; o.n++; if (r.approval_status === 'approved') o.a++; else if (r.approval_status === 'rejected') o.x++; if (r.city) o.cities.add(r.city.trim()); byC.set(k, o); });
  const conRows = [...byC].sort((a, b) => b[1].n - a[1].n).map(([k, o]) => [k, o.n, o.a, o.n - o.a - o.x, o.x, o.cities.size]);
  const tot = conRows.reduce((a, r) => [a[0], a[1] + r[1], a[2] + r[2], a[3] + r[3], a[4] + r[4], ''], ['סה״כ', 0, 0, 0, 0, '']);

  return wb;
}

/* ייצוא חודשי: קובץ לכל חודש ("נובמבר 2026"); קבצי חודשים קודמים עוברים לתיקייה "דוח חודשי" */
const idbOpen = () => new Promise((res, rej) => { const q = indexedDB.open('dash_fs', 1); q.onupgradeneeded = () => q.result.createObjectStore('h'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const idbGet = async k => { try { const d = await idbOpen(); return await new Promise(res => { const r = d.transaction('h').objectStore('h').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); } catch (e) { return null; } };
const idbSet = async (k, v) => { try { const d = await idbOpen(); await new Promise(res => { const t = d.transaction('h', 'readwrite'); t.objectStore('h').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} };
async function getBaseDir(pick) {
  if (!window.showDirectoryPicker) return null;
  let h = pick ? null : await idbGet('dir');
  if (h) { try { let pm = await h.queryPermission({ mode: 'readwrite' }); if (pm !== 'granted') pm = await h.requestPermission({ mode: 'readwrite' }); if (pm !== 'granted') h = null; } catch (e) { h = null; } }
  if (!h && pick) { h = await window.showDirectoryPicker({ mode: 'readwrite', id: 'dash-excel' }); await idbSet('dir', h); }
  return h || null;
}
async function writeFileTo(dir, name, data) { const fh = await dir.getFileHandle(name, { create: true }); const w = await fh.createWritable(); await w.write(data); await w.close(); }

async function exportExcelMonthly(pick) {
  if (typeof XLSX === 'undefined') { showToast('ספריית האקסל עדיין נטענת, נסה שוב בעוד רגע'); return; }
  let dir = null;
  try { dir = await getBaseDir(pick); } catch (e) { if (e && e.name === 'AbortError') return; showToast('לא ניתן לגשת לתיקייה שנבחרה – הקובץ יורד כרגיל'); dir = null; }
  showToast('מכין את קובץ האקסל…');
  const now = new Date(), curKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const curName = `${monthLabelOf(curKey)}.xlsx`;
  let mk = null;
  try {
    const byMonth = new Map();
    [...reports].sort((a, b) => String(a.date || '').localeCompare(String(b.date || ''))).forEach(r => { const k = monthKeyOf(r); if (!k) return; if (!byMonth.has(k)) byMonth.set(k, []); byMonth.get(k).push(r); });
    mk = k => buildWorkbook(byMonth.get(k) || [], `דוח ביצוע עבודות – ${monthLabelOf(k)}`, `חודש ${monthLabelOf(k)} · הופק ב-${now.toLocaleDateString('he-IL')} · ${(byMonth.get(k) || []).length} דיווחים`);
    if (!dir) {
      XLSX.writeFile(mk(curKey), curName);
      showToast(`הקובץ "${curName}" הורד` + (window.showDirectoryPicker ? ' · לשמירה אוטומטית בתיקיות לחץ על "תיקיית שמירה"' : ''));
      return;
    }
    const bytes = wb => XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    await writeFileTo(dir, curName, bytes(mk(curKey)));
    const arch = await dir.getDirectoryHandle('דוח חודשי', { create: true });
    const prevKeys = [...byMonth.keys()].filter(k => k < curKey).sort(), latestPrev = prevKeys[prevKeys.length - 1];
    for (const k of prevKeys) {
      const nm = `${monthLabelOf(k)}.xlsx`;
      let exists = true; try { await arch.getFileHandle(nm); } catch (e) { exists = false; }
      if (!exists || k === latestPrev) await writeFileTo(arch, nm, bytes(mk(k)));
    }
    // קבצי חודשים קודמים שנשארו בתיקייה הראשית – עוברים לתיקיית "דוח חודשי"
    const re = new RegExp('^(' + HE_MONTHS.join('|') + ') (\\d{4})\\.xlsx$');
    for await (const [nm, h] of dir.entries()) {
      const m = h.kind === 'file' && re.exec(nm); if (!m || nm === curName) continue;
      const key = `${m[2]}-${String(HE_MONTHS.indexOf(m[1]) + 1).padStart(2, '0')}`;
      if (key >= curKey) continue;
      let exists = true; try { await arch.getFileHandle(nm); } catch (e) { exists = false; }
      if (!exists) await writeFileTo(arch, nm, await (await h.getFile()).arrayBuffer());
      await dir.removeEntry(nm);
    }
    showToast(`נשמר: ${curName} בתיקייה שבחרת · חודשים קודמים בתיקייה "דוח חודשי"`);
  } catch (e) {
    console.error(e);
    try { if (mk) { XLSX.writeFile(mk(curKey), curName); showToast('לא ניתן לכתוב לתיקייה – הקובץ הורד כרגיל'); return; } } catch (e2) { console.error(e2); }
    showToast('יצירת קובץ האקסל נכשלה: ' + ((e && e.message) || e));
  }
}

}

/* נעילה אוטומטית: אחרי 30 דקות ללא פעילות (או אתר סגור / ברקע כל הזמן הזה) – נדרשת סיסמה מחדש */
const LOCK_MS = 30 * 60 * 1000;
const seenAt = () => { try { return +localStorage.getItem('dash_seen') || 0; } catch (e) { return 0; } };
const touchSeen = () => { try { if (session) localStorage.setItem('dash_seen', String(Date.now())); } catch (e) {} };
function lockIfStale() {
  if (session && Date.now() - seenAt() > LOCK_MS) {
    saveSession(null);
    try { localStorage.removeItem('dash_seen'); } catch (e) {}
    return true;
  }
  return false;
}
let lastAct = Date.now();
const markActive = () => { const t = Date.now(); if (t - lastAct > 5000) { lastAct = t; touchSeen(); } };
['pointerdown', 'keydown', 'touchstart', 'wheel', 'mousemove', 'scroll'].forEach(ev => addEventListener(ev, markActive, { passive: true, capture: true }));
setInterval(() => { if (session && lockIfStale()) renderLogin('נותקת עקב חוסר פעילות של 30 דקות – יש להתחבר מחדש.'); }, 30000);
addEventListener('pagehide', touchSeen);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { touchSeen(); return; }
  if (lockIfStale()) renderLogin('נותקת עקב חוסר פעילות של 30 דקות – יש להתחבר מחדש.', true);
  else { touchSeen(); if (Date.now() - lastRefresh >= REFRESH_MS) softRefresh(); }
});

/* רענון נתונים אוטומטי כל 15 דקות (בלי לסגור חלונות פתוחים ובלי לאבד מקום) */
const REFRESH_MS = 5 * 60 * 1000;
let lastRefresh = Date.now();
async function softRefresh() {
  if (!session || !$('#list') || document.visibilityState !== 'visible') return;
  if ($('#modal') && $('#modal').classList.contains('open')) return;        // חלון דיווח פתוח
  if (view === 'users' || view === 'map') return;                           // מסכים שלא כדאי להפריע בהם
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;             // באמצע הקלדה
  try {
    let r = await api(`${SB}/rest/v1/reports?select=*&order=id.desc&limit=2000`);
    if (r.status === 400) r = await api(`${SB}/rest/v1/reports?select=*&limit=2000`);
    if (!r.ok) return;
    const rows = await r.json(), seenIds = new Map();
    rows.forEach(x => { if (!seenIds.has(x.report_id)) seenIds.set(x.report_id, x); });
    reports = [...seenIds.values()];
    lastRefresh = Date.now();
    refresh();
  } catch (e) {}
}
setInterval(() => { if (Date.now() - lastRefresh >= REFRESH_MS) softRefresh(); paintGreet(); }, 60000);

function start() {
  const hp = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (hp.get('type') === 'recovery' && hp.get('access_token')) { renderReset(hp.get('access_token')); return; }
  if (hp.get('error_description')) { history.replaceState(null, '', location.pathname + location.search); renderLogin(hp.get('error_description')); return; }
  const locked = lockIfStale();
  touchSeen();
  session ? load() : renderLogin(locked ? 'נותקת עקב חוסר פעילות של 30 דקות – יש להתחבר מחדש.' : undefined, !!locked);
}
start();
</script>
